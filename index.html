3><strong>C. Rekap pemantauan kemajuan (agregat per angkatan)<\/strong><\/h3><table>\n<colgroup>\n<col/>\n<col/>\n<col/>\n<col/>\n<col/>\n<\/colgroup>\n<thead>\n<tr>\n<th><strong>Indikator<\/strong><\/th>\n<th><strong>Sumber<\/strong><\/th>\n<th><strong>Jumlah mahasiswa<\/strong><\/th>\n<th><strong>Memenuhi<\/strong><\/th>\n<th><strong>Tindak lanjut<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>IPS ≥ 3,00 dan tanpa nilai &lt; B<\/td>\n<td>SIA<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Kehadiran ≥ 80%<\/td>\n<td>LMS/presensi<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>≥ 3 pertemuan PA per semester (K26)<\/td>\n<td>F-PM-11<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Milestone tesis sesuai jadwal<\/td>\n<td>Dashboard tesis<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Mahasiswa berisiko diintervensi ≤ 30 hari (K24)<\/td>\n<td>F-PM-12<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><h3><strong>D. Rekap ketepatan umpan balik (K09)<\/strong><\/h3><table>\n<colgroup>\n<col/>\n<col/>\n<col/>\n<col/>\n<col/>\n<\/colgroup>\n<thead>\n<tr>\n<th><strong>Mata kuliah<\/strong><\/th>\n<th><strong>Penilaian disampel<\/strong><\/th>\n<th><strong>Umpan balik ≤ 14 hari<\/strong><\/th>\n<th><strong>Persentase<\/strong><\/th>\n<th><strong>Catatan<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><h3><strong>E. Lembar revisi strategi pembelajaran<\/strong><\/h3><table>\n<colgroup>\n<col/>\n<col/>\n<col/>\n<col/>\n<col/>\n<col/>\n<\/colgroup>\n<thead>\n<tr>\n<th><strong>Mata kuliah<\/strong><\/th>\n<th><strong>Data pemicu (nilai, analisis butir, EDOM)<\/strong><\/th>\n<th><strong>Masalah teridentifikasi<\/strong><\/th>\n<th><strong>Revisi strategi<\/strong><\/th>\n<th><strong>Mulai diterapkan<\/strong><\/th>\n<th><strong>Evaluasi efek<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><p>[Kota], [tanggal]<\/p><table>\n<colgroup>\n<col/>\n<col/>\n<\/colgroup>\n<tbody>\n<tr>\n<td><p>Disusun oleh,<\/p>\n<p><strong>Koordinator bidang Pembelajaran &amp; Kurikulum (K2)<\/strong><\/p>\n<p>[Nama &amp; NIP/NIDN]<\/p><\/td>\n<td><p>Mengetahui,<\/p>\n<p><strong>Ketua Program Studi<\/strong><\/p>\n<p>[Nama &amp; NIP/NIDN]<\/p><\/td>\n<\/tr>\n<\/tbody>\n<\/table>"},"C3-03":{"id":"C3-03","title":"Template Kerangka Kebijakan dan Prosedur Remedial serta Konseling Mahasiswa","elements":["3.2.2","3.2.3","4.2.1","4.2.4"],"related":"SOP-PM-06, F-PM-11, F-PM-12, P13, P15, K24, K26, C4-02, C3-01","by":"Koordinator bidang Kemahasiswaan, Alumni & Keselamatan (K4) bersama Kaprodi menyusun; unit layanan konseling memberi masukan; Pimpinan UPPS mengesahkan.","when":"Disusun bersama paket SOP Rev. 01, disosialisasikan pada orientasi mahasiswa baru, dan ditinjau setiap tahun berdasarkan monev layanan (P15).","purpose":"Membuktikan bahwa mahasiswa yang membutuhkan bantuan tambahan ditetapkan berdasarkan hasil penilaian dan memperoleh dukungan yang terdefinisi, yaitu remedial akademik, mentoring, dan konseling yang rahasia serta peka budaya.","assessor":["Kriteria penetapan mahasiswa yang membutuhkan dukungan berbasis data penilaian.","Ketentuan remedial (syarat, bentuk, waktu, batas nilai) yang jelas dan diterapkan konsisten.","Prosedur konseling yang menjamin kerahasiaan, memiliki jalur rujukan, dan layanan krisis.","Rekaman pelaksanaan dan pemantauan hasil dukungan."],"tips":["SOP-PM-06 sudah mengatur identifikasi dini dan rencana dukungan; dokumen ini menambahkan ketentuan remedial pada peraturan akademik dan prosedur layanan konseling tingkat universitas/fakultas.","Pisahkan rekaman konseling (rahasia, disimpan unit konseling) dari rekaman akademik; Tim PM hanya menerima data agregat.","Nyatakan batas nilai hasil remedial sesuai peraturan akademik universitas agar adil dan konsisten."],"outline":["A. Dasar hukum","B. Ketentuan pokok remedial","C. Ketentuan pokok konseling","D. Prosedur ringkas","E. Pemantauan"],"html":"<blockquote>\n<p>Hubungan dokumen: SOP-PM-06 menetapkan kriteria risiko (IPS &lt; 3,00, nilai &lt; B, kehadiran &lt; 80%, bimbingan tesis terhenti ≥ 2 bulan, milestone terlambat &gt; 1 semester) dan intervensi ≤ 30 hari dengan F-PM-12. Kerangka berikut melengkapi ketentuan remedial dan konseling.<\/p>\n<\/blockquote><h3><strong>A. Dasar hukum<\/strong><\/h3><ul>\n<li><p>Permendiktisaintek No. 39 Tahun 2025, Pasal 27 (penilaian formatif untuk memantau perkembangan dan memberi umpan balik) dan Pasal 38 (layanan mahasiswa termasuk bimbingan konseling dan kesehatan).<\/p><\/li>\n<li><p>Peraturan akademik [Nama Universitas]; pedoman layanan konseling universitas.<\/p><\/li>\n<li><p>STD-3.2 dan STD-4.2 dalam STD-MKM-01.<\/p><\/li>\n<\/ul><h3><strong>B. Ketentuan pokok remedial<\/strong><\/h3><ol>\n<li><p>Sasaran: mahasiswa dengan nilai di bawah batas lulus CPMK atau mata kuliah.<\/p><\/li>\n<li><p>Bentuk: tugas perbaikan, ujian ulang, tutorial terstruktur, atau mentoring sejawat.<\/p><\/li>\n<li><p>Waktu: paling lambat [….] minggu setelah nilai diumumkan dan sebelum batas pengisian nilai akhir.<\/p><\/li>\n<li><p>Nilai maksimum hasil remedial: [ditetapkan dalam peraturan akademik].<\/p><\/li>\n<li><p>Soal/tugas remedial melalui moderasi yang sama dengan ujian reguler (SOP-PM-04).<\/p><\/li>\n<\/ol><h3><strong>C. Ketentuan pokok konseling<\/strong><\/h3><ol>\n<li><p>Akses: dapat diminta mahasiswa sendiri atau dirujuk PA/dosen dengan persetujuan mahasiswa.<\/p><\/li>\n<li><p>Kerahasiaan: catatan konseling hanya diakses konselor; pengecualian hanya untuk keselamatan jiwa.<\/p><\/li>\n<li><p>Layanan krisis dan rujukan ke tenaga profesional atau fasilitas kesehatan.<\/p><\/li>\n<li><p>Peka budaya, inklusif, dan dapat diakses mahasiswa kelas kerja atau daring.<\/p><\/li>\n<\/ol><h3><strong>D. Prosedur ringkas<\/strong><\/h3><table>\n<colgroup>\n<col/>\n<col/>\n<col/>\n<col/>\n<col/>\n<\/colgroup>\n<thead>\n<tr>\n<th><strong>No<\/strong><\/th>\n<th><strong>Aktivitas<\/strong><\/th>\n<th><strong>Pelaksana<\/strong><\/th>\n<th><strong>Waktu<\/strong><\/th>\n<th><strong>Rekaman<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>Penetapan mahasiswa membutuhkan dukungan dari data penilaian<\/td>\n<td>PA; koordinator tesis<\/td>\n<td>Bulanan<\/td>\n<td>F-PM-12<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>Penawaran remedial dan penyusunan rencana dukungan<\/td>\n<td>Dosen; PA<\/td>\n<td>≤ 30 hari<\/td>\n<td>F-PM-12<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>Pelaksanaan remedial dengan soal termoderasi<\/td>\n<td>Dosen pengampu<\/td>\n<td>Sesuai jadwal<\/td>\n<td>F-PM-08; nilai<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>Rujukan konfidensial ke unit layanan konseling<\/td>\n<td>PA<\/td>\n<td>Sesuai kebutuhan<\/td>\n<td>Surat rujukan terbatas<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>Pemantauan hingga risiko teratasi<\/td>\n<td>PA<\/td>\n<td>Bulanan<\/td>\n<td>F-PM-11<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>Laporan agregat anonim<\/td>\n<td>Koordinator K4<\/td>\n<td>Semester<\/td>\n<td>Laporan monev P15<\/td>\n<\/tr>\n<\/tbody>\n<\/table><h3><strong>E. Pemantauan<\/strong><\/h3><table>\n<colgroup>\n<col/>\n<col/>\n<col/>\n<\/colgroup>\n<thead>\n<tr>\n<th><strong>Indikator<\/strong><\/th>\n<th><strong>Target<\/strong><\/th>\n<th><strong>Sumber<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Mahasiswa berisiko diintervensi ≤ 30 hari (K24)<\/td>\n<td>100%<\/td>\n<td>F-PM-12<\/td>\n<\/tr>\n<tr>\n<td>Mahasiswa dengan ≥ 3 pertemuan PA per semester (K26)<\/td>\n<td>≥ 90%<\/td>\n<td>F-PM-11<\/td>\n<\/tr>\n<tr>\n<td>Mahasiswa lulus setelah remedial<\/td>\n<td>Dipantau<\/td>\n<td>SIA<\/td>\n<\/tr>\n<\/tbody>\n<\/table><p>[Kota], [tanggal]<\/p><table>\n<colgroup>\n<col/>\n<col/>\n<col/>\n<\/colgroup>\n<tbody>\n<tr>\n<td><p>Disusun oleh,<\/p>\n<p><strong>Koordinator bidang Kemahasiswaan, Alumni &amp; Keselamatan (K4)<\/strong><\/p>\n<p>[Nama &amp; NIP/NIDN]<\/p><\/td>\n<td><p>Diperiksa oleh,<\/p>\n<p><strong>Ketua Program Studi<\/strong><\/p>\n<p>[Nama &amp; NIP/NIDN]<\/p><\/td>\n<td><p>Disahkan oleh,<\/p>\n<p><strong>Pimpinan UPPS<\/strong><\/p>\n<p>[Nama &amp; NIP/NIDN]<\/p><\/td>\n<\/tr>\n<\/tbody>\n<\/table>"},"C3-04":{"id":"C3-04","title":"Template Kerangka Panduan Ujian Program Studi MKM","elements":["3.1.3","3.3.1","3.3.2","3.3.4","4.3.6"],"related":"SOP-PM-04, SOP-PM-05, F-PM-08, F-PM-10, P04, P13, K07, K08, C3-01, C3-06","by":"Sub-tim penjaminan mutu penilaian menyusun bersama tim dosen per mata kuliah; Kaprodi memeriksa; Pimpinan UPPS mengesahkan.","when":"Disusun sebelum semester berjalan, disosialisasikan pada awal semester, dan direview setiap Juli (P04).","purpose":"Membuktikan bahwa panduan ujian dikembangkan berdasarkan capaian pembelajaran dengan melibatkan pihak terkait, mengintegrasikan penilaian lintas CPL dan isi kurikulum, menetapkan prosedur standard setting dan keputusan kelulusan, menjamin keamanan mahasiswa, serta dievaluasi berkala.","assessor":["Panduan disusun dengan melibatkan dosen, sub-tim penilaian, dan masukan mahasiswa.","Blue print yang mengaitkan ujian dengan CPMK dan CPL.","Prosedur standard setting dan pihak pengambil keputusan kemajuan dan kelulusan.","Informasi isi, metode, dan kualitas penilaian yang disampaikan kepada mahasiswa.","Pengaturan jadwal dan pelaksanaan ujian yang aman dan inklusif."],"tips":["Masukkan rubrik ujian tesis yang terkalibrasi; ujian tesis adalah penilaian sumatif paling menentukan pada jenjang magister.","Lampirkan notulen penyusunan atau review panduan sebagai bukti pelibatan pihak terkait.","Gunakan F-PM-08 sebagai rekaman moderasi dan analisis butir; panduan cukup merujuknya."],"outline":["A. Outline panduan ujian","B. Blue print ujian per mata kuliah","C. Komponen dan jadwal penilaian","D. Rubrik ujian tesis"],"html":"<h3><strong>A. Outline panduan ujian<\/strong><\/h3><table>\n<colgroup>\n<col/>\n<col/>\n<col/>\n<\/colgroup>\n<thead>\n<tr>\n<th><strong>Bab<\/strong><\/th>\n<th><strong>Judul<\/strong><\/th>\n<th><strong>Isi minimal<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>I<\/td>\n<td>Pendahuluan<\/td>\n<td>Tujuan, dasar, pihak penyusun dan pihak yang dimintai masukan, masa berlaku.<\/td>\n<\/tr>\n<tr>\n<td>II<\/td>\n<td>Kebijakan dan sistem penilaian<\/td>\n<td>Prinsip, formatif dan sumatif, keterkaitan dengan CPL, bobot komponen.<\/td>\n<\/tr>\n<tr>\n<td>III<\/td>\n<td>Jenis ujian<\/td>\n<td>UTS, UAS, tugas besar/proyek, ujian proposal, seminar hasil, ujian tesis.<\/td>\n<\/tr>\n<tr>\n<td>IV<\/td>\n<td>Penyusunan dan moderasi<\/td>\n<td>Blue print, penulisan soal/rubrik, telaah sejawat, pengamanan naskah.<\/td>\n<\/tr>\n<tr>\n<td>V<\/td>\n<td>Standard setting<\/td>\n<td>Metode (Angoff modifikasi, borderline, rubrik terkalibrasi), batas lulus, pihak penetap.<\/td>\n<\/tr>\n<tr>\n<td>VI<\/td>\n<td>Pelaksanaan dan tata tertib<\/td>\n<td>Jadwal, pengawasan, ujian daring, akomodasi mahasiswa berkebutuhan khusus, integritas akademik, keamanan dan kesehatan peserta.<\/td>\n<\/tr>\n<tr>\n<td>VII<\/td>\n<td>Pengolahan nilai dan analisis<\/td>\n<td>Penskoran, analisis butir dan reliabilitas, kalibrasi antar-penilai.<\/td>\n<\/tr>\n<tr>\n<td>VIII<\/td>\n<td>Umpan balik dan pengumuman<\/td>\n<td>Umpan balik ≤ 14 hari, pengumuman nilai melalui LMS/SIA.<\/td>\n<\/tr>\n<tr>\n<td>IX<\/td>\n<td>Susulan, remedial, dan banding<\/td>\n<td>Syarat dan prosedur; rujukan C3-03 dan SOP-PM-05.<\/td>\n<\/tr>\n<tr>\n<td>X<\/td>\n<td>Keputusan kemajuan dan kelulusan<\/td>\n<td>Syarat lanjut tahap tesis, yudisium, pihak berwenang.<\/td>\n<\/tr>\n<tr>\n<td>XI<\/td>\n<td>Evaluasi panduan<\/td>\n<td>Review tahunan berdasarkan laporan QA penilaian dan umpan balik.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><h3><strong>B. Blue print ujian per mata kuliah<\/strong><\/h3><table>\n<colgroup>\n<col/>\n<col/>\n<\/colgroup>\n<tbody>\n<tr>\n<td><strong>Mata kuliah<\/strong><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Jenis ujian<\/strong><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Dosen/tim penyusun<\/strong><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><table>\n<colgroup>\n<col/>\n<col/>\n<col/>\n<col/>\n<col/>\n<col/>\n<\/colgroup>\n<thead>\n<tr>\n<th><strong>CPMK<\/strong><\/th>\n<th><strong>Bobot (%)<\/strong><\/th>\n<th><strong>Level kognitif<\/strong><\/th>\n<th><strong>Bentuk soal/tugas<\/strong><\/th>\n<th><strong>Jumlah butir<\/strong><\/th>\n<th><strong>Keterangan<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><h3><strong>C. Komponen dan jadwal penilaian<\/strong><\/h3><table>\n<colgroup>\n<col/>\n<col/>\n<col/>\n<col/>\n<col/>\n<\/colgroup>\n<thead>\n<tr>\n<th><strong>Komponen<\/strong><\/th>\n<th><strong>Formatif/Sumatif<\/strong><\/th>\n<th><strong>Minggu ke-<\/strong><\/th>\n<th><strong>Bobot (%)<\/strong><\/th>\n<th><strong>CPMK yang dinilai<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><h3><strong>D. Rubrik ujian tesis<\/strong><\/h3><table>\n<colgroup>\n<col/>\n<col/>\n<col/>\n<col/>\n<\/colgroup>\n<thead>\n<tr>\n<th><strong>Aspek<\/strong><\/th>\n<th><strong>Bobot (%)<\/strong><\/th>\n<th><strong>Kriteria sangat baik<\/strong><\/th>\n<th><strong>Kriteria kurang<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Rumusan masalah dan relevansi kesmas<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Kajian pustaka dan kerangka teori<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Metodologi dan etika penelitian<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Analisis data<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Pembahasan dan implikasi kebijakan/program<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Presentasi dan penguasaan materi<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><p>[Kota], [tanggal]<\/p><table>\n<colgroup>\n<col/>\n<col/>\n<col/>\n<\/colgroup>\n<tbody>\n<tr>\n<td><p>Disusun oleh,<\/p>\n<p><strong>Koordinator bidang Penjaminan Mutu Penilaian (K3)<\/strong><\/p>\n<p>[Nama &amp; NIP/NIDN]<\/p><\/td>\n<td><p>Diperiksa oleh,<\/p>\n<p><strong>Ketua Program Studi<\/strong><\/p>\n<p>[Nama &amp; NIP/NIDN]<\/p><\/td>\n<td><p>Disahkan oleh,<\/p>\n<p><strong>Pimpinan UPPS<\/strong><\/p>\n<p>[Nama &amp; NIP/NIDN]<\/p><\/td>\n<\/tr>\n<\/tbody>\n<\/table>"},"C3-05":{"id":"C3-05","title":"Template Kerangka Kebijakan Banding Hasil Penilaian dan Rekap Penanganan Banding","elements":["3.3.3"],"related":"SOP-PM-05, F-PM-10, SOP-PM-04, P04, INS-SVY-01, C3-01","by":"Kaprodi bersama Koordinator bidang Penjaminan Mutu Penilaian (K3); Sekretaris Tim PM memelihara rekap; Pimpinan UPPS menetapkan Tim Banding.","when":"Kebijakan ditetapkan bersama SOP Rev. 01; Tim Banding ditetapkan setiap tahun akademik; rekap banding disusun setiap semester.","purpose":"Membuktikan bahwa UPPS/PS memiliki kebijakan banding yang jelas, tersosialisasi kepada seluruh mahasiswa, memiliki tim banding yang ditetapkan, langkah penyelesaian perselisihan, dan jalur eskalasi ke otoritas yang lebih tinggi.","assessor":["Kebijakan atau peraturan banding tertulis yang dapat diakses mahasiswa.","SK atau penetapan Tim Banding yang independen dari dosen pengampu.","Langkah penyelesaian dengan tenggat dan eskalasi.","Rekaman penanganan banding dan pemanfaatannya untuk perbaikan penilaian."],"tips":["SOP-PM-05 sudah mengatur langkah dan tenggat tingkat prodi; tingkat fakultas/universitas perlu menegaskan kewenangan Wakil Dekan Akademik sebagai pemutus akhir dan memasukkan hak banding ke peraturan akademik.","Tunjukkan bukti sosialisasi pada orientasi dan dalam panduan akademik; asesor sering menanyakannya kepada mahasiswa.","Rekap yang tidak berisi kasus tetap disimpan sebagai bukti sistem berjalan."],"outline":["A. Dasar","B. Ketentuan pokok kebijakan banding","C. Penetapan Tim Banding","D. Rekap penanganan banding per semester","E. Pemantauan"],"html":"<blockquote>\n<p>Hubungan dokumen: SOP-PM-05 mengatur prosedur (pengajuan F-PM-10 ≤ 7 hari setelah nilai diumumkan, klarifikasi dosen ≤ 5 hari kerja, telaah Tim Banding ≤ 7 hari kerja, keputusan ≤ 14 hari kerja total, eskalasi ≤ 7 hari). Kerangka berikut menambahkan ketentuan kebijakan.<\/p>\n<\/blockquote><h3><strong>A. Dasar<\/strong><\/h3><ul>\n<li><p>Permendiktisaintek No. 39 Tahun 2025, Pasal 26 (penilaian transparan, akuntabel, berkeadilan) dan Pasal 27 ayat (6) (mekanisme penilaian disosialisasikan).<\/p><\/li>\n<li><p>Peraturan akademik [Nama Universitas]; STD-3.3 dalam STD-MKM-01.<\/p><\/li>\n<\/ul><h3><strong>B. Ketentuan pokok kebijakan banding<\/strong><\/h3><ol>\n<li><p>Hak setiap mahasiswa mengajukan banding atas nilai mata kuliah dan ujian tesis.<\/p><\/li>\n<li><p>Alasan yang dapat diterima: kesalahan administrasi atau perhitungan, ketidaksesuaian penilaian dengan rubrik, pelanggaran prosedur, atau keadaan khusus yang terdokumentasi.<\/p><\/li>\n<li><p>Komposisi Tim Banding: Kaprodi dan dua dosen bukan pengampu; anggota yang berkonflik kepentingan wajib mundur.<\/p><\/li>\n<li><p>Perlindungan mahasiswa dari tindakan pembalasan dan kerahasiaan proses.<\/p><\/li>\n<li><p>Keputusan tertulis beralasan; keputusan Wakil Dekan Akademik bersifat final.<\/p><\/li>\n<li><p>Sosialisasi melalui orientasi, panduan akademik, laman prodi, dan RPS.<\/p><\/li>\n<\/ol><h3><strong>C. Penetapan Tim Banding<\/strong><\/h3><table>\n<colgroup>\n<col/>\n<col/>\n<\/colgroup>\n<tbody>\n<tr>\n<td><strong>Nomor dan tanggal SK<\/strong><\/td>\n<td>[Nomor SK]<\/td>\n<\/tr>\n<tr>\n<td><strong>Periode<\/strong><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Ketua<\/strong><\/td>\n<td>Ketua Program Studi<\/td>\n<\/tr>\n<tr>\n<td><strong>Anggota 1<\/strong><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Anggota 2<\/strong><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Pemutus akhir (eskalasi)<\/strong><\/td>\n<td>Wakil Dekan Akademik<\/td>\n<\/tr>\n<\/tbody>\n<\/table><h3><strong>D. Rekap penanganan banding per semester<\/strong><\/h3><table>\n<colgroup>\n<col/>\n<col/>\n<col/>\n<col/>\n<col/>\n<col/>\n<col/>\n<\/colgroup>\n<thead>\n<tr>\n<th><strong>No. registrasi<\/strong><\/th>\n<th><strong>Mata kuliah/ujian<\/strong><\/th>\n<th><strong>Kategori alasan<\/strong><\/th>\n<th><strong>Tahap selesai<\/strong><\/th>\n<th><strong>Lama (hari kerja)<\/strong><\/th>\n<th><strong>Hasil<\/strong><\/th>\n<th><strong>Perbaikan sistemik<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><blockquote>\n<p>Hasil: diterima, diterima sebagian, atau ditolak. Tahap selesai: klarifikasi dosen, Tim Banding, atau eskalasi.<\/p>\n<\/blockquote><h3><strong>E. Pemantauan<\/strong><\/h3><ul>\n<li><p>Banding diselesaikan ≤ 14 hari kerja: 100%.<\/p><\/li>\n<li><p>Proporsi mahasiswa yang menyatakan prosedur banding diketahui dan dapat diakses (INS-SVY-01 butir 11).<\/p><\/li>\n<li><p>Pola banding berulang pada mata kuliah yang sama diteruskan ke laporan QA penilaian dan, bila sistemik, diterbitkan PTK.<\/p><\/li>\n<\/ul><p>[Kota], [tanggal]<\/p><table>\n<colgroup>\n<col/>\n<col/>\n<col/>\n<\/colgroup>\n<tbody>\n<tr>\n<td><p>Disusun oleh,<\/p>\n<p><strong>Ketua Program Studi<\/strong><\/p>\n<p>[Nama &amp; NIP/NIDN]<\/p><\/td>\n<td><p>Diperiksa oleh,<\/p>\n<p><strong>Ketua Tim PM<\/strong><\/p>\n<p>[Nama &amp; NIP/NIDN]<\/p><\/td>\n<td><p>Disahkan oleh,<\/p>\n<p><strong>Pimpinan UPPS<\/strong><\/p>\n<p>[Nama &amp; NIP/NIDN]<\/p><\/td>\n<\/tr>\n<\/tbody>\n<\/table>"},"C3-06":{"id":"C3-06","title":"Template Rencana dan Laporan Pelaksanaan Penjaminan Mutu Penilaian per Semester","elements":["3.4.1","3.4.2","3.4.3","3.4.4","3.4.5","3.4.6"],"related":"SOP-PM-04, F-PM-08, SOP-PM-09, SOP-PM-11, INS-SVY-01, INS-SVY-08, P04, K07, K08, K09, SK-PM-01","by":"Sub-tim penjaminan mutu penilaian di bawah Koordinator bidang Penjaminan Mutu Penilaian (K3); Kaprodi menerima laporan dan meneruskan rekomendasi.","when":"Rencana disusun awal semester; laporan pelaksanaan pada akhir semester dan dibahas di rapat dosen; review sistem penilaian setiap Juli.","purpose":"Membuktikan bahwa tim penjaminan mutu penilaian ditetapkan, merencanakan dan melaksanakan langkah QA secara berkala, menghimpun pendapat mahasiswa, dosen, tendik, dan pemangku kepentingan, menganalisis setiap penilaian, menggunakan datanya untuk memperbaiki pembelajaran dan kurikulum, serta meninjau sistem penilaian secara berkala.","assessor":["SK sub-tim penilaian beserta keahlian asesmen anggotanya.","Rencana QA dengan jadwal dan penanggung jawab.","Hasil moderasi, standard setting, analisis butir (indeks kesukaran, daya pembeda), dan reliabilitas.","Pendapat pemangku kepentingan tentang penilaian dan tindak lanjutnya.","Distribusi data kepada dosen, pengelola mata kuliah, Tim Kurikulum, dan UPPS serta revisi sistem penilaian."],"tips":["Gunakan F-PM-08 untuk setiap ujian; dokumen ini merangkum seluruh F-PM-08 dalam satu semester.","Tindak lanjut rekomendasi harus dapat ditelusuri ke RPS, bank soal, atau keputusan peninjauan kurikulum.","Untuk ujian esai, proyek, dan tesis, laporkan kalibrasi antar-penilai sebagai pengganti analisis butir."],"outline":["A. Penetapan tim","B. Rencana penjaminan mutu penilaian","C. Laporan pelaksanaan per ujian","D. Pendapat pemangku kepentingan tentang penilaian","E. Pemanfaatan data dan review sistem"],"html":"<h3><strong>A. Penetapan tim<\/strong><\/h3><table>\n<colgroup>\n<col/>\n<col/>\n<\/colgroup>\n<tbody>\n<tr>\n<td><strong>Dasar penetapan (SK sub-tim)<\/strong><\/td>\n<td>[Nomor SK]<\/td>\n<\/tr>\n<tr>\n<td><strong>Ketua sub-tim<\/strong><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Anggota dan keahlian asesmen<\/strong><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Semester/TA<\/strong><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><h3><strong>B. Rencana penjaminan mutu penilaian<\/strong><\/h3><table>\n<colgroup>\n<col/>\n<col/>\n<col/>\n<col/>\n<col/>\n<col/>\n<\/colgroup>\n<thead>\n<tr>\n<th><strong>No<\/strong><\/th>\n<th><strong>Kegiatan<\/strong><\/th>\n<th><strong>Sasaran<\/strong><\/th>\n<th><strong>Minggu/waktu<\/strong><\/th>\n<th><strong>PIC<\/strong><\/th>\n<th><strong>Rekaman<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>Validasi blue pr ong>Hasil review sistem penilaian tahunan dan revisi yang ditetapkan:<\/strong><\/p><p>[Kota], [tanggal]<\/p><table>\n<colgroup>\n<col/>\n<col/>\n<\/colgroup>\n<tbody>\n<tr>\n<td><p>Disusun oleh,<\/p>\n<p><strong>Koordinator bidang Penjaminan Mutu Penilaian (K3)<\/strong><\/p>\n<p>[Nama &amp; NIP/NIDN]<\/p><\/td>\n<td><p>Mengetahui,<\/p>\n<p><strong>Ketua Program Studi<\/strong><\/p>\n<p>[Nama &amp; NIP/NIDN]<\/p><\/td>\n<\/tr>\n<\/tbody>\n<\/table>"},"C4-01":{"id":"C4-01","title":"Template Kerangka Peraturan Seleksi dan Penerimaan Mahasiswa Baru serta Matriks Keselarasan Regulasi","elements":["4.1.1","4.1.2","4.1.3","4.1.4","4.1.5","4.1.6","4.1.7"],"related":"P14, SOP-PM-13, F-PM-18, K25, STD-MKM-01, C1-05","by":"Panitia seleksi bersama Kaprodi menyusun pedoman teknis tingkat prodi; Pimpinan UPPS mengusulkan dan menyelaraskan dengan peraturan PMB universitas.","when":"Ditetapkan sebelum setiap periode penerimaan; dievaluasi setelah tiap gelombang seleksi (P14, Mei–Agustus) dan direvisi bila diperlukan.","purpose":"Membuktikan bahwa kebijakan seleksi dan penerimaan selaras dengan VMT institusi dan ketentuan pemerintah atau lembaga berwenang, disusun oleh pihak yang bebas intervensi, adil, non-diskriminatif, inklusif, memperhatikan linieritas keilmuan dan kebutuhan tenaga kerja, tersosialisasi, serta dikaji ulang secara berkala.","assessor":["Peraturan atau pedoman tertulis yang memuat tujuan, prinsip, kriteria, dan proses seleksi.","Matriks keselarasan dengan ketentuan pemerintah dan kebijakan internal.","Penetapan tim seleksi yang otonom dan bebas konflik kepentingan.","Analisis daya tampung terhadap dosen, sarpras, dan lahan praktik.","Bukti sosialisasi dan laporan evaluasi seleksi berkala."],"tips":["Jika seleksi diatur universitas, jelaskan secara eksplisit bagian yang diterapkan atau disesuaikan pada tingkat prodi.","Rumuskan kriteria linieritas (linier, serumpun dengan matrikulasi, tidak memenuhi) secara tertulis agar tidak menimbulkan tafsir.","Kaitkan kanal pengaduan pendaftar dengan SOP-PM-13 dan catat penyelesaiannya."],"outline":["A. Dasar hukum","B. Ketentuan pokok yang wajib dimuat","C. Matriks keselarasan","D. Analisis daya tampung","E. Pemantauan"],"html":"<blockquote>\n<p>SOP-PM-13 sudah menyediakan kanal keluhan calon mahasiswa dan P14 memantau seleksi. Pada tingkat universitas/fakultas perlu tersedia peraturan PMB pascasarjana; tingkat prodi menambahkan pedoman teknis yang memuat ketentuan di bawah.<\/p>\n<\/blockquote><h3><strong>A. Dasar hukum<\/strong><\/h3><ul>\n<li><p>UU No. 12 Tahun 2012 tentang Pendidikan Tinggi.<\/p><\/li>\n<li><p>Permendiktisaintek No. 39 Tahun 2025, Pasal 35–36: penerimaan berdasarkan potensi dan prestasi, bersifat afirmatif, inklusif, dan adil, diumumkan terbuka di laman resmi, seleksi transparan dan akuntabel, dan dapat melakukan rekognisi pembelajaran lampau.<\/p><\/li>\n<li><p>Peraturan rektor tentang penerimaan mahasiswa pascasarjana [Nama Universitas].<\/p><\/li>\n<\/ul><h3><strong>B. Ketentuan pokok yang wajib dimuat<\/strong><\/h3><ol>\n<li><p>Tujuan dan prinsip seleksi yang diturunkan dari VMT institusi dan unggulan PS.<\/p><\/li>\n<li><p>Tim seleksi: komposisi, kewenangan otonom, pakta integritas, dan larangan konflik kepentingan.<\/p><\/li>\n<li><p>Persyaratan: ijazah S1, kriteria linieritas dengan keilmuan kesmas, ketentuan matrikulasi.<\/p><\/li>\n<li><p>Daya tampung yang dihitung dari rasio dosen, kapasitas pembimbing tesis, sarpras, dan lahan praktik.<\/p><\/li>\n<li><p>Penyesuaian terhadap kebutuhan tenaga kesehatan lokal dan nasional, termasuk tugas belajar.<\/p><\/li>\n<li><p>Non-diskriminasi (usia, suku, gender, agama, disabilitas) dan afirmasi.<\/p><\/li>\n<li><p>Penerimaan mahasiswa internasional, pindahan, rekognisi pembelajaran lampau, dan pendaftar terlambat.<\/p><\/li>\n<li><p>Tahapan seleksi, mekanisme permohonan, pengumuman, dan pengaduan.<\/p><\/li>\n<li><p>Sosialisasi kepada pemangku kepentingan internal dan eksternal.<\/p><\/li>\n<li><p>Evaluasi dan revisi setiap periode beserta pihak yang terlibat.<\/p><\/li>\n<\/ol><h3><strong>C. Matriks keselarasan<\/strong><\/h3><table>\n<colgroup>\n<col/>\n<col/>\n<col/>\n<col/>\n<\/colgroup>\n<thead>\n<tr>\n<th><strong>Ketentuan pemerintah/lembaga<\/strong><\/th>\n<th><strong>Ketentuan dalam peraturan seleksi<\/strong><\/th>\n<th><strong>Bagian/pasal dokumen internal<\/strong><\/th>\n<th><strong>Bukti penerapan<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Afirmatif, inklusif, adil (Pasal 36 ayat 2)<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Diumumkan terbuka di laman resmi (Pasal 36 ayat 3)<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Seleksi transparan dan akuntabel<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Rekognisi pembelajaran lampau (Pasal 36 ayat 4)<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><h3><strong>D. Analisis daya tampung<\/strong><\/h3><table>\n<colgroup>\n<col/>\n<col/>\n<col/>\n<col/>\n<\/colgroup>\n<thead>\n<tr>\n<th><strong>Komponen<\/strong><\/th>\n<th><strong>Data<\/strong><\/th>\n<th><strong>Dasar perhitungan<\/strong><\/th>\n<th><strong>Kesimpulan<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Dosen tetap dan rasio terhadap mahasiswa<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Kapasitas pembimbing tesis<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Ruang kuliah dan laboratorium<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Lahan praktik aktif<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Daya tampung yang ditetapkan<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><h3><strong>E. Pemantauan<\/strong><\/h3><table>\n<colgroup>\n<col/>\n<col/>\n<col/>\n<\/colgroup>\n<thead>\n<tr>\n<th><strong>Indikator<\/strong><\/th>\n<th><strong>Target<\/strong><\/th>\n<th><strong>Sumber<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Rasio keketatan seleksi (K25)<\/td>\n<td>≥ 3 : 1<\/td>\n<td>Data PMB<\/td>\n<\/tr>\n<tr>\n<td>Evaluasi seleksi per periode<\/td>\n<td>100% periode<\/td>\n<td>Laporan P14<\/td>\n<\/tr>\n<tr>\n<td>Keluhan seleksi ditangani<\/td>\n<td>100%<\/td>\n<td>Register F-PM-18<\/td>\n<\/tr>\n<tr>\n<td>Profil keberagaman mahasiswa baru<\/td>\n<td>Dilaporkan<\/td>\n<td>Laporan P14<\/td>\n<\/tr>\n<\/tbody>\n<\/table><p>[Kota], [tanggal]<\/p><table>\n<colgroup>\n<col/>\n<col/>\n<col/>\n<\/colgroup>\n<tbody>\n<tr>\n<td><p>Disusun oleh,<\/p>\n<p><strong>Ketua Panitia Seleksi<\/strong><\/p>\n<p>[Nama &amp; NIP/NIDN]<\/p><\/td>\n<td><p>Diperiksa oleh,<\/p>\n<p><strong>Ketua Program Studi<\/strong><\/p>\n<p>[Nama &amp; NIP/NIDN]<\/p><\/td>\n<td><p>Disahkan oleh,<\/p>\n<p><strong>Pimpinan UPPS<\/strong><\/p>\n<p>[Nama &amp; NIP/NIDN]<\/p><\/td>\n<\/tr>\n<\/tbody>\n<\/table>"},"C4-02":{"id":"C4-02","title":"Template Kerangka Kebijakan dan Pedoman Layanan Dukungan serta Konseling Mahasiswa","elements":["4.2.1","4.2.2","4.2.3","4.2.4","4.2.6","4.2.7"],"related":"SOP-PM-06, SOP-PM-13, SOP-PM-07, F-PM-11, F-PM-12, P15, K26, K10, C3-03, C4-03","by":"Koordinator bidang Kemahasiswaan, Alumni & Keselamatan (K4) menyusun bersama perwakilan mahasiswa dan unit layanan konseling; Pimpinan UPPS mengesahkan.","when":"Ditetapkan bersama paket SOP Rev. 01; disosialisasikan setiap orientasi mahasiswa baru; ditinjau setiap semester pada forum mahasiswa (P15, Mei dan November).","purpose":"Membuktikan bahwa UPPS/PS menyediakan layanan akademik dan non-akademik yang setara, rahasia, peka budaya, dapat diakses, tersosialisasi kepada dosen dan mahasiswa, dikembangkan bersama organisasi mahasiswa, dan dievaluasi berkala bersama perwakilan mahasiswa.","assessor":["Daftar layanan lengkap: PA, karir, bantuan keuangan, asuransi, kesejahteraan dan konseling, akses layanan kesehatan, disabilitas, minat-bakat, dukungan teknologi.","Pedoman layanan yang mudah diakses dan diketahui dosen serta mahasiswa.","Prosedur konseling sesuai prinsip konseling dan budaya setempat.","Keterlibatan organisasi mahasiswa dalam pengembangan dan penerapan layanan.","Prosedur evaluasi relevansi, aksesibilitas, dan kerahasiaan bersama perwakilan mahasiswa."],"tips":["SOP-PM-06 mengatur identifikasi dini; SOP-PM-13 mengatur keluhan; dokumen ini menjadi payung yang menghubungkan seluruh layanan beserta unit pelaksananya di tingkat universitas/fakultas.","Sesuaikan layanan bagi mahasiswa magister yang bekerja (jadwal sore, layanan daring).","Jangan mencantumkan layanan yang belum tersedia; tuliskan sebagai rencana pengembangan."],"outline":["A. Dasar hukum","B. Prinsip layanan","C. Daftar layanan dan unit pelaksana","D. Prosedur konseling ringkas","E. Sosialisasi dan keterlibatan mahasiswa","F. Evaluasi"],"html":"<h3><strong>A. Dasar hukum<\/strong><\/h3><ul>\n<li><p>Permendiktisaintek No. 39 Tahun 2025, Pasal 38: layanan mahasiswa minimal meliputi administrasi akademik, bimbingan konseling, kesehatan, dan keperluan dasar untuk mahasiswa berkebutuhan khusus.<\/p><\/li>\n<li><p>Peraturan rektor tentang layanan kemahasiswaan [Nama Universitas]; STD-4.2 dalam STD-MKM-01.<\/p><\/li>\n<\/ul><h3><strong>B. Prinsip layanan<\/strong><\/h3><ul>\n<li><p>Setara bagi semua mahasiswa, termasuk kelas kerja sama dan mahasiswa internasional.<\/p><\/li>\n<li><p>Rahasia: data pribadi dan konseling hanya diakses petugas berwenang; pelaporan ke Tim PM dalam bentuk agregat anonim.<\/p><\/li>\n<li><p>Peka budaya, inklusif, dan memperhatikan kearifan lokal.<\/p><\/li>\n<li><p>Dapat diakses luring dan daring.<\/p><\/li>\n<\/ul><h3><strong>C. Daftar layanan dan unit pelaksana<\/strong><\/h3><table>\n<colgroup>\n<col/>\n<col/>\n<col/>\n<col/>\n<col/>\n<\/colgroup>\n<thead>\n<tr>\n<th><strong>Layanan<\/strong><\/th>\n<th><strong>Unit pelaksana<\/strong><\/th>\n<th><strong>Cara akses<\/strong><\/th>\n<th><strong>Jam/kanal<\/strong><\/th>\n<th><strong>Rekaman<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Pembimbingan akademik<\/td>\n<td>PA<\/td>\n<td>Jadwal PA<\/td>\n<td><\/td>\n<td>F-PM-11<\/td>\n<\/tr>\n<tr>\n<td>Bimbingan karir<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Beasiswa dan konseling keuangan<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Asuransi kesehatan dan kecelakaan<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Konseling psikologis dan kesejahteraan<\/td>\n<td>Unit layanan konseling<\/td>\n<td><\/td>\n<td><\/td>\n<td>Rahasia<\/td>\n<\/tr>\n<tr>\n<td>Akses layanan kesehatan<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Layanan disabilitas<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Pengembangan minat dan bakat<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Dukungan teknologi (LMS, perangkat lunak analisis)<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Layanan darurat/krisis<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><h3><strong>D. Prosedur konseling ringkas<\/strong><\/h3><ol>\n<li><p>Mahasiswa mengajukan sendiri atau dirujuk PA/dosen dengan persetujuan mahasiswa (SOP-PM-06).<\/p><\/li>\n<li><p>Konselor melakukan asesmen awal dan menyepakati rencana konseling.<\/p><\/li>\n<li><p>Sesi konseling dilaksanakan dan dicatat dalam rekaman rahasia unit konseling.<\/p><\/li>\n<li><p>Rujukan ke tenaga profesional atau fasilitas kesehatan bila diperlukan; kondisi darurat ditangani segera.<\/p><\/li>\n<li><p>Tindak lanjut dan penutupan layanan; data agregat dilaporkan per semester.<\/p><\/li>\n<\/ol><h3><strong>E. Sosialisasi dan keterlibatan mahasiswa<\/strong><\/h3><ul>\n<li><p>Pedoman layanan dimuat di laman prodi, LMS, dan materi orientasi.<\/p><\/li>\n<li><p>Perwakilan mahasiswa dilibatkan dalam penyusunan dan forum evaluasi tiap semester (notulen F-PM-02).<\/p><\/li>\n<li><p>Dosen menerima informasi layanan pada rapat awal semester.<\/p><\/li>\n<\/ul><h3><strong>F. Evaluasi<\/strong><\/h3><table>\n<colgroup>\n<col/>\n<col/>\n<col/>\n<col/>\n<\/colgroup>\n<thead>\n<tr>\n<th><strong>Aspek<\/strong><\/th>\n<th><strong>Metode<\/strong><\/th>\n<th><strong>Frekuensi<\/strong><\/th>\n<th><strong>PIC<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Relevansi<\/td>\n<td>Survei INS-SVY-01 bagian C; forum mahasiswa<\/td>\n<td>Semester<\/td>\n<td>Koordinator K4<\/td>\n<\/tr>\n<tr>\n<td>Aksesibilitas<\/td>\n<td>Data pemanfaatan dan waktu tunggu<\/td>\n<td>Semester<\/td>\n<td>Koordinator K4<\/td>\n<\/tr>\n<tr>\n<td>Kerahasiaan<\/td>\n<td>Survei butir 16; keluhan<\/td>\n<td>Semester<\/td>\n<td>Tim PM<\/td>\n<\/tr>\n<\/tbody>\n<\/table><p>[Kota], [tanggal]<\/p><table>\n<colgroup>\n<col/>\n<col/>\n<col/>\n<\/colgroup>\n<tbody>\n<tr>\n<td><p>Disusun oleh,<\/p>\n<p><strong>Koordinator bidang Kemahasiswaan, Alumni &amp; Keselamatan (K4)<\/strong><\/p>\n<p>[Nama &amp; NIP/NIDN]<\/p><\/td>\n<td><p>Diperiksa oleh,<\/p>\n<p><strong>Ketua Program Studi<\/strong><\/p>\n<p>[Nama &amp; NIP/NIDN]<\/p><\/td>\n<td><p>Disahkan oleh,<\/p>\n<p><strong>Pimpinan UPPS<\/strong><\/p>\n<p>[Nama &amp; NIP/NIDN]<\/p><\/td>\n<\/tr>\n<\/tbody>\n<\/table>"},"C4-03":{"id":"C4-03","title":"Template Inventaris SDM, Anggaran, dan Fasilitas Pendukung Layanan Mahasiswa","elements":["4.2.1","4.2.5","4.2.7"],"related":"P15, P19, K10, K32, INS-SVY-01, C4-02, C6-01","by":"Koordinator bidang Kemahasiswaan, Alumni & Keselamatan (K4) bersama Koordinator bidang Sarpras, Keuangan & Tata Kelola; bagian keuangan/umum menyediakan data realisasi.","when":"Dimutakhirkan setiap semester dan menjadi masukan monev layanan (P15) serta monev sarpras dan keuangan (P19, September).","purpose":"Membuktikan bahwa layanan dukungan mahasiswa ditopang oleh staf pendukung yang memadai dan berkualifikasi, alokasi serta realisasi anggaran, dan fasilitas yang dapat diakses, sehingga kualitas layanan dapat din td>\n<\/tr>\n<\/tbody>\n<\/table><h3><strong>C. Lima butir dengan indeks terendah<\/strong><\/h3><table>\n<colgroup>\n<col/>\n<col/>\n<col/>\n<col/>\n<\/colgroup>\n<thead>\n<tr>\n<th><strong>No butir<\/strong><\/th>\n<th><strong>Pernyataan<\/strong><\/th>\n<th><strong>Indeks (%)<\/strong><\/th>\n<th><strong>Dugaan penyebab<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><h3><strong>D. Analisis komentar terbuka<\/strong><\/h3><table>\n<colgroup>\n<col/>\n<col/>\n<col/>\n<\/colgroup>\n<thead>\n<tr>\n<th><strong>Kategori<\/strong><\/th>\n<th><strong>Frekuensi<\/strong><\/th>\n<th><strong>Ringkasan isi<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><h3><strong>E. Analisis subkelompok<\/strong><\/h3><p>Bandingkan indeks per angkatan, status (reguler/kelas kerja sama), dan peminatan bila jumlah responden per kelompok ≥ 5 agar anonimitas terjaga.<\/p><h3><strong>F. Rencana tindak lanjut<\/strong><\/h3><table>\n<colgroup>\n<col/>\n<col/>\n<col/>\n<col/>\n<col/>\n<col/>\n<\/colgroup>\n<thead>\n<tr>\n<th><strong>Temuan<\/strong><\/th>\n<th><strong>Tindakan<\/strong><\/th>\n<th><strong>Unit/PIC<\/strong><\/th>\n<th><strong>Tenggat<\/strong><\/th>\n<th><strong>Indikator keberhasilan<\/strong><\/th>\n<th><strong>Status<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><h3><strong>G. Publikasi hasil<\/strong><\/h3><table>\n<colgroup>\n<col/>\n<col/>\n<\/colgroup>\n<tbody>\n<tr>\n<td><strong>Tanggal publikasi ringkasan \"Anda menyampaikan – kami melakukan\"<\/strong><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Media publikasi<\/strong><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Temuan yang diteruskan sebagai PTK (nomor)<\/strong><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><p>[Kota], [tanggal]<\/p><table>\n<colgroup>\n<col/>\n<col/>\n<\/colgroup>\n<tbody>\n<tr>\n<td><p>Disusun oleh,<\/p>\n<p><strong>Ketua Tim PM<\/strong><\/p>\n<p>[Nama &amp; NIP/NIDN]<\/p><\/td>\n<td><p>Mengetahui,<\/p>\n<p><strong>Ketua Program Studi<\/strong><\/p>\n<p>[Nama &amp; NIP/NIDN]<\/p><\/td>\n<\/tr>\n<\/tbody>\n<\/table>"},"C4-06":{"id":"C4-06","title":"Template Kerangka Kebijakan Kampus Sehat dan Rencana Kerja Tahunan Prodi","elements":["4.3.3","4.4.1","4.4.2","4.4.3"],"related":"P16, SOP-PM-12, SOP-PM-13, F-PM-14, INS-SVY-01, K10, C5-11, C4-07","by":"Pimpinan UPPS bersama Satgas PPKPT menetapkan kebijakan tingkat universitas/fakultas; Koordinator bidang Kemahasiswaan, Alumni & Keselamatan (K4) menyusun rencana kerja prodi.","when":"Kebijakan mengikuti peraturan universitas; rencana kerja prodi ditetapkan setiap awal tahun akademik dan dievaluasi setiap semester (P16).","purpose":"Membuktikan bahwa UPPS menerapkan lingkungan kampus sehat yang bebas kekerasan seksual, perundungan, dan intoleransi melalui kebijakan, prosedur pelaporan dan penanganan, rencana kerja kegiatan mahasiswa, serta sosialisasi yang terpantau.","assessor":["Kebijakan dan prosedur tertulis tentang pencegahan dan penanganan kekerasan seksual, perundungan, dan intoleransi.","Rencana kerja kegiatan mahasiswa yang bebas kekerasan dan disosialisasikan.","Kanal pelaporan yang aman dan rahasia serta penanggung jawab yang jelas.","Pemantauan rasa aman dan pengetahuan mahasiswa tentang cara melapor."],"tips":["Penanganan kasus kekerasan menjadi kewenangan Satgas PPKPT; SOP-PM-13 mengecualikan kasus kekerasan seksual dan SOP-PM-12 hanya mengatur pelaporan insiden serta rujukan. Prodi perlu menambahkan rencana kerja pencegahan dan aturan relasi dalam bimbingan.","Masukkan materi kampus sehat dalam orientasi mahasiswa baru sesuai Pasal 37 Permendiktisaintek 39/2025.","Sajikan data kasus hanya agregat; jangan menyimpan identitas korban di repositori prodi."],"outline":["A. Dasar hukum","B. Ketentuan pokok yang wajib dimuat","C. Rencana kerja kampus sehat tahunan","D. Alur pelaporan ringkas","E. Pemantauan"],"html":"<h3><strong>A. Dasar hukum<\/strong><\/h3><ul>\n<li><p>Permendiktisaintek No. 39 Tahun 2025, Pasal 14 ayat (2) tentang pencegahan dan penanganan kekerasan terhadap sivitas akademika dan Pasal 37 tentang penyiapan mahasiswa untuk kampus bebas kekerasan seksual, perundungan, dan intoleransi.<\/p><\/li>\n<li><p>UU No. 12 Tahun 2022 tentang Tindak Pidana Kekerasan Seksual.<\/p><\/li>\n<li><p>Peraturan menteri tentang pencegahan dan penanganan kekerasan di lingkungan perguruan tinggi yang berlaku dan peraturan rektor tentang Satgas PPKPT.<\/p><\/li>\n<\/ul><h3><strong>B. Ketentuan pokok yang wajib dimuat<\/strong><\/h3><ol>\n<li><p>Definisi bentuk kekerasan (seksual, fisik, psikis, perundungan, diskriminasi dan intoleransi).<\/p><\/li>\n<li><p>Ruang lingkup: kampus, kegiatan daring, praktik lapangan, bimbingan tesis, dan kegiatan organisasi.<\/p><\/li>\n<li><p>Kode perilaku relasi dosen–mahasiswa, termasuk bimbingan di tempat dan waktu yang wajar serta kanal komunikasi resmi.<\/p><\/li>\n<li><p>Kanal pelaporan, perlindungan pelapor dan korban, larangan pembalasan, serta kerahasiaan.<\/p><\/li>\n<li><p>Peran Satgas PPKPT, Kaprodi, PA, dan Koordinator praktik lapangan.<\/p><\/li>\n<li><p>Pemulihan korban dan sanksi sesuai peraturan.<\/p><\/li>\n<\/ol><h3><strong>C. Rencana kerja kampus sehat tahunan<\/strong><\/h3><table>\n<colgroup>\n<col/>\n<col/>\n<col/>\n<col/>\n<col/>\n<col/>\n<\/colgroup>\n<thead>\n<tr>\n<th><strong>Kegiatan<\/strong><\/th>\n<th><strong>Sasaran<\/strong><\/th>\n<th><strong>Waktu<\/strong><\/th>\n<th><strong>PIC<\/strong><\/th>\n<th><strong>Indikator<\/strong><\/th>\n<th><strong>Bukti<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Sosialisasi Satgas PPKPT dan kanal pelaporan<\/td>\n<td>Mahasiswa, dosen, tendik<\/td>\n<td>Tiap semester<\/td>\n<td>Koordinator K4<\/td>\n<td><\/td>\n<td>F-PM-01<\/td>\n<\/tr>\n<tr>\n<td>Materi kampus sehat pada orientasi<\/td>\n<td>Mahasiswa baru<\/td>\n<td>Awal TA<\/td>\n<td>Kaprodi<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Pembekalan pra-praktik lapangan<\/td>\n<td>Mahasiswa, pembimbing lapangan<\/td>\n<td>Sebelum penempatan<\/td>\n<td>Koordinator praktik<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Sosialisasi kode perilaku bimbingan<\/td>\n<td>Dosen<\/td>\n<td>Rapat awal semester<\/td>\n<td>Kaprodi<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Kampanye anti-perundungan dan toleransi<\/td>\n<td>Sivitas<\/td>\n<td><\/td>\n<td>Perwakilan mahasiswa<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Survei rasa aman (INS-SVY-01 butir 19–21)<\/td>\n<td>Mahasiswa<\/td>\n<td>Tiap semester<\/td>\n<td>Tim PM<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><h3><strong>D. Alur pelaporan ringkas<\/strong><\/h3><ol>\n<li><p>Korban atau saksi melapor ke Satgas PPKPT, Kaprodi, PA, atau kanal daring.<\/p><\/li>\n<li><p>Penerima laporan memastikan keselamatan segera dan merujuk ke Satgas PPKPT ≤ 24 jam.<\/p><\/li>\n<li><p>Insiden di lahan praktik dicatat dengan F-PM-14 bagian A tanpa detail yang tidak perlu.<\/p><\/li>\n<li><p>Satgas menangani sesuai peraturan; prodi menjalankan perlindungan akademik korban.<\/p><\/li>\n<li><p>Tim PM menerima data agregat untuk evaluasi dan pembaruan register risiko.<\/p><\/li>\n<\/ol><h3><strong>E. Pemantauan<\/strong><\/h3><table>\n<colgroup>\n<col/>\n<col/>\n<col/>\n<\/colgroup>\n<thead>\n<tr>\n<th><strong>Indikator<\/strong><\/th>\n<th><strong>Sumber<\/strong><\/th>\n<th><strong>Frekuensi<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Mahasiswa yang merasa aman dan bebas kekerasan (butir 19–20)<\/td>\n<td>INS-SVY-01<\/td>\n<td>Semester<\/td>\n<\/tr>\n<tr>\n<td>Mahasiswa yang tahu cara melapor (butir 21)<\/td>\n<td>INS-SVY-01<\/td>\n<td>Semester<\/td>\n<\/tr>\n<tr>\n<td>Laporan yang dirujuk ≤ 24 jam (agregat)<\/td>\n<td>Satgas PPKPT<\/td>\n<td>Semester<\/td>\n<\/tr>\n<\/tbody>\n<\/table><p>[Kota], [tanggal]<\/p><table>\n<colgroup>\n<col/>\n<col/>\n<col/>\n<\/colgroup>\n<tbody>\n<tr>\n<td><p>Disusun oleh,<\/p>\n<p><strong>Koordinator bidang Kemahasiswaan, Alumni &amp; Keselamatan (K4)<\/strong><\/p>\n<p>[Nama &amp; NIP/NIDN]<\/p><\/td>\n<td><p>Diperiksa oleh,<\/p>\n<p><strong>Ketua Program Studi<\/strong><\/p>\n<p>[Nama &amp; NIP/NIDN]<\/p><\/td>\n<td><p>Disahkan oleh,<\/p>\n<p><strong>Pimpinan UPPS<\/strong><\/p>\n<p>[Nama &amp; NIP/NIDN]<\/p><\/td>\n<\/tr>\n<\/tbody>\n<\/table>"},"C4-07":{"id":"C4-07","title":"Template Kerangka Kebijakan Keselamatan Mahasiswa di Kampus, Laboratorium, dan Lahan Praktik","elements":["4.4.1","4.4.2","4.4.3","4.4.4","4.4.5","4.3.2","4.3.4"],"related":"SOP-PM-12, F-PM-13, F-PM-14, P16, K27, K33, C6-04, C4-08, C2-03","by":"Pimpinan UPPS menetapkan; Koordinator praktik lapangan dan Koordinator bidang Kemahasiswaan, Alumni & Keselamatan (K4) menyusun; unit K3 universitas memberi masukan.","when":"Ditetapkan bersama paket SOP Rev. 01; ditinjau setiap tahun dan setiap terjadi insiden serius atau perubahan lahan praktik.","purpose":"Membuktikan bahwa UPPS memberi perlindungan hukum dan peraturan keselamatan fisik serta psikologis mahasiswa, menetapkan penanggung jawab di setiap lingkungan, mengidentifikasi dan mencegah risiko, serta menetapkan persyaratan dokumen dan catatan keselamatan.","assessor":["Definisi keselamatan fisik dan psikologis serta bentuk perlindungan mahasiswa.","Penanggung jawab keselamatan di kampus, laboratorium, lahan praktik, dan kegiatan lapangan.","Mekanisme identifikasi, mitigasi, pencatatan, dan pelaporan risiko.","Persyaratan dokumen keselamatan sebelum, selama, dan sesudah praktik.","Pengaturan beban dan jam praktik lapangan."],"tips":["SOP-PM-12 sudah mengatur kelayakan lahan, pembekalan, pelaporan insiden ≤ 24 jam, dan RCA ≤ 14 hari; kebijakan ini menambahkan perlindungan hukum, asuransi, penanggung jawab, dan aturan jam praktik pada tingkat UPPS.","Pastikan klausul keselamatan dan tanggung jawab tercantum dalam setiap PKS lahan praktik.","Jam kerja minimum dan maksimum serta hari libur praktik harus mengacu peraturan yang berlaku dan tertulis di pedoman praktik."],"outline":["A. Dasar hukum","B. Ketentuan pokok","C. Penanggung jawab keselamatan","D. Persyaratan dokumen keselamatan","E. Pemantauan"],"html":"<h3><strong>A. Dasar hukum<\/strong><\/h3><ul>\n<li><p>Permendiktisaintek No. 39 Tahun 2025, Pasal 14 ayat (1) huruf c tentang jaminan keamanan, kenyamanan, dan kesejahteraan sivitas akademika.<\/p><\/li>\n<li><p>UU No. 1 Tahun 1970 tentang Keselamatan Kerja dan kebijakan K3 universitas (C6-04).<\/p><\/li>\n<li><p>PKS/MoU dengan lahan praktik; STD-4.3 dan STD-4.4 dalam STD-MKM-01.<\/p><\/li>\n<\/ul><h3><strong>B. Ketentuan pokok<\/strong><\/h3><ol>\n<li><p>Definisi keselamatan fisik (cedera, infeksi, bahan berbahaya, lalu lintas, bencana) dan psikologis (kekerasan, perundungan, tekanan berlebih).<\/p><\/li>\n<li><p>Perlindungan: asuransi kecelakaan dan kesehatan, klausul tanggung jawab dalam PKS, pendampingan hukum.<\/p><\/li>\n<li><p>Larangan penugasan di luar kompetensi dan tanpa pengawasan pembimbing.<\/p><\/li>\n<li><p>Beban dan jam praktik: jam minimum [….], maksimum [….] per minggu, pengaturan libur dan cuti, serta waktu persiapan ujian.<\/p><\/li>\n<li><p>Identifikasi risiko sebelum penempatan dengan F-PM-13; lahan risiko tinggi tidak ditempati sebelum dimitigasi.<\/p><\/li>\n<li><p>Pelaporan insiden ≤ 24 jam dengan F-PM-14 dan RCA sesuai pedoman C4-08.<\/p><\/li>\n<\/ol><h3><strong>C. Penanggung jawab keselamatan<\/strong><\/h3><table>\n<colgroup>\n<col/>\n<col/>\n<col/>\n<col/>\n<\/colgroup>\n<thead>\n<tr>\n<th><strong>Lingkungan<\/strong><\/th>\n<th><strong>Penanggung jawab<\/strong><\/th>\n<th><strong>Tugas utama<\/strong><\/th>\n<th><strong>Kontak darurat<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Kampus<\/td>\n<td>Bagian keuangan/umum dan unit K3<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Laboratorium<\/td>\n<td>Kepala laboratorium<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Lahan praktik<\/td>\n<td>Koordinator praktik lapangan dan Pembimbing lapangan (wahana)<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Kegiatan lapangan/penelitian<\/td>\n<td>Pembimbing tesis/dosen penanggung jawab<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Tingkat manajemen<\/td>\n<td>Pimpinan UPPS<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><h3><strong>D. Persyaratan dokumen keselamatan<\/strong><\/h3><table>\n<colgroup>\n<col/>\n<col/>\n<col/>\n<col/>\n<\/colgroup>\n<thead>\n<tr>\n<th><strong>Tahap<\/strong><\/th>\n<th><strong>Dokumen wajib<\/strong><\/th>\n<th><strong>Penanggung jawab<\/strong><\/th>\n<th><strong>Tersedia<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Sebelum praktik<\/td>\n<td>PKS berlaku, F-PM-13, bukti asuransi, surat tugas, bukti pembekalan, daftar kontak darurat<\/td>\n<td>Koordinator praktik<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Selama praktik<\/td>\n<td>Logbook, presensi, catatan supervisi, laporan insiden bila ada<\/td>\n<td>Pembimbing lapangan<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Sesudah praktik<\/td>\n<td>Evaluasi lahan, rekap insiden dan RCA, pembaruan register risiko<\/td>\n<td>Koordinator praktik; Tim PM<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><h3><strong>E. Pemantauan<\/strong><\/h3><ul>\n<li><p>Lahan aktif dengan asesmen kelayakan dan risiko ≤ 12 bulan (K27): 100%.<\/p><\/li>\n<li><p>Insiden dengan RCA dan tindak lanjut: 100%.<\/p><\/li>\n<li><p>Risiko tinggi dengan mitigasi berjalan (K33): 100%, ditinjau triwulanan.<\/p><\/li>\n<\/ul><p>[Kota], [tanggal]<\/p><table>\n<colgroup>\n<col/>\n<col/>\n<col/>\n<\/colgroup>\n<tbody>\n<tr>\n<td><p>Disusun oleh,<\/p>\n<p><strong>Koordinator praktik lapangan<\/strong><\/p>\n<p>[Nama &amp; NIP/NIDN]<\/p><\/td>\n<td><p>Diperiksa oleh,<\/p>\n<p><strong>Ketua Program Studi<\/strong><\/p>\n<p>[Nama &amp; NIP/NIDN]<\/p><\/td>\n<td><p>Disahkan oleh,<\/p>\n<p><strong>Pimpinan UPPS<\/strong><\/p>\n<p>[Nama &amp; NIP/NIDN]<\/p><\/td>\n<\/tr>\n<\/tbody>\n<\/table>"},"C4-08":{"id":"C4-08","title":"Template Kerangka Pedoman Analisis Akar Masalah (RCA) Insiden Keselamatan Mahasiswa","elements":["4.4.2","4.4.4","4.4.5"],"related":"SOP-PM-12, SOP-PM-09, F-PM-14, F-PM-04, P16, P08, K33, C4-07","by":"Ketua Tim PM bersama Koordinator praktik lapangan menyusun; Pimpinan UPPS mengesahkan; Tim RCA ditetapkan per kasus.","when":"Ditetapkan bersama paket SOP Rev. 01; diterapkan setiap insiden yang memenuhi kriteria RCA (≤ 14 hari); ditinjau setiap tahun.","purpose":"Membuktikan bahwa UPPS/PS memiliki pedoman baku untuk menganalisis akar masalah insiden keselamatan dan ketidaksesuaian serius, sehingga tindakan pencegahan tepat sasaran, tercatat, dan efektivitasnya diverifikasi.","assessor":["Kriteria kapan RCA wajib dilakukan.","Komposisi Tim RCA yang independen dan menjaga kerahasiaan.","Langkah analisis terstruktur dengan alat bantu (5-Why, fishbone).","Tindakan pencegahan berbasis hierarki pengendalian dan verifikasi efektivitas.","Rekap RCA dan pembaruan register risiko."],"tips":["F-PM-14 menjadi rekaman RCA insiden dan F-PM-04 rekaman PTK; pedoman ini menjelaskan cara mengisinya secara benar, bukan menggantikannya.","Fokus pada sistem dan proses, bukan mencari kesalahan individu; nyatakan prinsip ini di awal pedoman.","Kasus kekerasan seksual ditangani Satgas PPKPT; RCA prodi hanya menelaah faktor sistem tanpa mengungkap identitas."],"outline":["A. Outline pedoman","B. Matriks kebutuhan RCA","C. Langkah RCA","D. Lembar analisis faktor kontributor","E. Rekap RCA tahunan"],"html":"<h3><strong>A. Outline pedoman<\/strong><\/h3><table>\n<colgroup>\n<col/>\n<col/>\n<\/colgroup>\n<thead>\n<tr>\n<th><strong>Bagian<\/strong><\/th>\n<th><strong>Isi minimal<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Tujuan dan prinsip<\/td>\n<td>Pembelajaran organisasi, fokus sistem, tidak menyalahkan, kerahasiaan.<\/td>\n<\/tr>\n<tr>\n<td>Ruang lingkup<\/td>\n<td>Insiden keselamatan di kampus, laboratorium, lahan praktik; KTS mayor berulang; keluhan sistemik.<\/td>\n<\/tr>\n<tr>\n<td>Kriteria RCA<\/td>\n<td>Matriks di bagian B.<\/td>\n<\/tr>\n<tr>\n<td>Tim RCA<\/td>\n<td>Ketua independen dari unit terkait, Koordinator praktik lapangan, wakil Tim PM, pembimbing lapangan bila relevan, perwakilan mahasiswa bila tidak berkonflik.<\/td>\n<\/tr>\n<tr>\n<td>Langkah RCA<\/td>\n<td>Bagian C.<\/td>\n<\/tr>\n<tr>\n<td>Pelaporan dan pembelajaran<\/td>\n<td>Laporan ke Kaprodi dan RTM, pembaruan register risiko, berbagi pelajaran secara anonim.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><h3><strong>B. Matriks kebutuhan RCA<\/strong><\/h3><table>\n<colgroup>\n<col/>\n<col/>\n<col/>\n<col/>\n<\/colgroup>\n<thead>\n<tr>\n<th><strong>Tingkat dampak<\/strong><\/th>\n<th><strong>Contoh<\/strong><\/th>\n<th><strong>RCA wajib<\/strong><\/th>\n<th><strong>Batas waktu<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Berat<\/td>\n<td>Cedera serius, kekerasan, paparan infeksi berisiko tinggi<\/td>\n<td>Ya, lengkap<\/td>\n<td>≤ 14 hari<\/td>\n<\/tr>\n<tr>\n<td>Sedang<\/td>\n<td>Cedera ringan berulang, nyaris celaka dengan potensi berat<\/td>\n<td>Ya<\/td>\n<td>≤ 14 hari<\/td>\n<\/tr>\n<tr>\n<td>Ringan<\/td>\n<td>Kejadian tunggal tanpa cedera<\/td>\n<td>Analisis singkat 5-Why<\/td>\n<td>≤ 30 hari<\/td>\n<\/tr>\n<\/tbody>\n<\/table><blockquote>\n<p>Gunakan skor risiko kemungkinan × dampak (1–5): ≥ 15 Tinggi, 8–14 Sedang, &lt; 8 Rendah, sesuai register risiko.<\/p>\n<\/blockquote><h3><strong>C. Langkah RCA<\/strong><\/h3><ol>\n<li><p>Amankan situasi, lindungi korban, dan laporkan ≤ 24 jam (F-PM-14 bagian A).<\/p><\/li>\n<li><p>Bentuk Tim RCA dan tandatangani pernyataan kerahasiaan.<\/p><\/li>\n<li><p>Kumpulkan fakta: kronologi, wawancara, dokumen (F-PM-13, logbook, PKS), observasi lokasi.<\/p><\/li>\n<li><p>Susun urutan kejadian dan identifikasi penyimpangan dari prosedur.<\/p><\/li>\n<li><p>Analisis faktor kontributor: manusia, prosedur, lingkungan/lahan, organisasi/komunikasi.<\/p><\/li>\n<li><p>Tetapkan akar masalah dengan 5-Why dan diagram fishbone.<\/p><\/li>\n<li><p>Susun tindakan pencegahan menurut hierarki pengendalian: eliminasi, substitusi, rekayasa, administratif, APD.<\/p><\/li>\n<li><p>Tetapkan PIC dan tenggat; terbitkan PTK bila sistemik (SOP-PM-09).<\/p><\/li>\n<li><p>Verifikasi efektivitas pada siklus berikutnya dan perbarui register risiko.<\/p><\/li>\n<\/ol><h3><strong>D. Lembar analisis faktor kontributor<\/strong><\/h3><table>\n<colgroup>\n<col/>\n<col/>\n<col/>\n<col/>\n<\/colgroup>\n<thead>\n<tr>\n<th><strong>Kategori<\/strong><\/th>\n<th><strong>Faktor kontributor<\/strong><\/th>\n<th><strong>Bukti<\/strong><\/th>\n<th><strong>Akar masalah (Ya/Tidak)<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Manusia<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Prosedur<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Lingkungan/lahan<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Organisasi/komunikasi<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><h3><strong>E. Rekap RCA tahunan<\/strong><\/h3><table>\n<colgroup>\n<col/>\n<col/>\n<col/>\n<col/>\n<col/>\n<\/colgroup>\n<thead>\n<tr>\n<th><strong>No. insiden<\/strong><\/th>\n<th><strong>Kategori<\/strong><\/th>\n<th><strong>Akar masalah<\/strong><\/th>\n<th><strong>Tindakan pencegahan<\/strong><\/th>\n<th><strong>Efektif (Ya/Tidak)<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><p>[Kota], [tanggal]<\/p><table>\n<colgroup>\n<col/>\n<col/>\n<col/>\n<\/colgroup>\n<tbody>\n<tr>\n<td><p>Disusun oleh,<\/p>\n<p><strong>Ketua Tim PM<\/strong><\/p>\n<p>[Nama &amp; NIP/NIDN]<\/p><\/td>\n<td><p>Diperiksa oleh,<\/p>\n<p><strong>Ketua Program Studi<\/strong><\/p>\n<p>[Nama &amp; NIP/NIDN]<\/p><\/td>\n<td><p>Disahkan oleh,<\/p>\n<p><strong>Pimpinan UPPS<\/strong><\/p>\n<p>[Nama &amp; NIP/NIDN]<\/p><\/td>\n<\/tr>\n<\/tbody>\n<\/table>"},"C5-01":{"id":"C5-01","title":"Template Rencana Pengembangan SDM Dosen dan Tendik Berbasis Kebutuhan Bidang Ilmu 2026–2030","elements":["5.1.1","5.1.2","5.3.1","5.4.2"],"related":"P17, F-PM-15, STD-MKM-01, SOP-PM-10, K28, K29, C5-03, C5-10","by":"Disusun Kaprodi bersama Koordinator bidang SDM, Penelitian & PkM (K5) dan Bagian SDM; diverifikasi Tim PM; disahkan Pimpinan UPPS.","when":"Disusun untuk periode Renstra (4–5 tahun), direview setiap semester dalam monev SDM P17 (Februari dan Agustus) dan diputuskan perubahannya dalam RTM.","purpose":"Membuktikan bahwa UPPS/PS menghitung kebutuhan jumlah dan kualifikasi dosen serta tendik berdasarkan jumlah mahasiswa, kurikulum, beban tridharma, dan perkembangan ilmu, lalu menuangkannya ke rencana rekrutmen, studi lanjut, jabatan fungsional, CPD, dan regenerasi yang terukur, didanai, dan direview berkala.","assessor":["Perhitungan kebutuhan dosen mempertimbangkan jumlah mahasiswa, struktur kurikulum, beban penelitian, PkM, pembimbingan tesis, dan tugas manajerial (5.1.1).","Rencana memuat kualifikasi sesuai UU 14/2005, jenjang pendidikan, jabatan fungsional, dan kompetensi per bidang ilmu kesmas, termasuk rencana regenerasi dosen (5.1.2).","Rencana pengembangan profesional dan jenjang karir mencakup dosen tetap dan dosen kontrak serta dikaitkan dengan kurikulum dan roadmap penelitian/PkM (5.3.1).","Perencanaan kecukupan tendik (administrasi, pustakawan, operator TI, laboran) tersedia dan selaras dengan layanan tridharma (5.4.2).","Ada bukti pelaksanaan, evaluasi kemajuan, dan review rencana secara teratur, bukan hanya dokumen yang disahkan sekali."],"tips":["Mulailah dari analisis kesenjangan per bidang ilmu (C5-03), bukan dari daftar keinginan; setiap kegiatan dalam rencana harus menjawab satu kesenjangan.","Cantumkan proyeksi pensiun dan studi lanjut agar rencana regenerasi terlihat nyata; asesor sering menanyakan dampak dosen yang tugas belajar terhadap rasio.","Gunakan target K28 dan K29 sebagai indikator, tetapi isi baseline dari data riil semester berjalan; jangan menulis angka perkiraan sebagai capaian.","Lampirkan notulen RTM atau rapat pimpinan yang mengesahkan dan meninjau rencana agar siklus PPEPP terbukti."],"outline":["A. Kerangka isi dokumen","B. Analisis kebutuhan dan kesenjangan dosen per bidang ilmu","C. Rencana pengembangan SDM","D. Monitoring dan review"],"html":"<table>\n<colgroup>\n<col/>\n<col/>\n<\/colgroup>\n<tbody>\n<tr>\n<td><strong>Periode rencana<\/strong><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Dasar penyusunan (Renstra/Renop, hasil monev P17, RTM)<\/strong><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Jumlah mahasiswa aktif (data per tanggal)<\/strong><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Tanggal pengesahan dan nomor dokumen<\/strong><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><h3><strong>A. Kerangka isi dokumen<\/strong><\/h3><ol>\n<li><p>Pendahuluan: dasar hukum, keterkaitan dengan VMTS, unggulan, dan Renstra prodi.<\/p><\/li>\n<li><p>Analisis kebutuhan dosen: jumlah mahasiswa, beban SKS kurikulum, pembimbingan tesis, penelitian, PkM, dan tugas manajerial.<\/p><\/li>\n<li><p>Profil dosen saat ini dan kesenjangan per bidang ilmu kesmas (rujuk pemetaan C5-03 dan data kualifikasi C5-10).<\/p><\/li>\n<li><p>Analisis kebutuhan tendik berdasarkan jenis layanan dan beban kerja.<\/p><\/li>\n<li><p>Rencana rekrutmen, regenerasi, studi lanjut, jabatan fungsional, sertifikasi, dan CPD.<\/p><\/li>\n<li><p>Pembiayaan, penanggung jawab, indikator, serta mekanisme monev dan review.<\/p><\/li>\n<\/ol><h3><strong>B. Analisis kebutuhan dan kesenjangan dosen per bidang ilmu<\/strong><\/h3><table>\n<colgroup>\n<col/>\n<col/>\n<col/>\n<col/>\n<col/>\n<col/>\n<col/>\n<col/>\n<\/colgroup>\n<thead>\n<tr>\n<th><strong>No<\/strong><\/th>\n<th><strong>Bidang ilmu/kelompok MK<\/strong><\/th>\n<th><strong>SKS dan bimbingan per tahun<\/strong><\/th>\n<th><strong>Dosen tersedia (S3/S2)<\/strong><\/th>\n<th><strong>Jafung tersedia<\/strong><\/th>\n<th><strong>Kebutuhan ideal<\/strong><\/th>\n<th><strong>Kesenjangan<\/strong><\/th>\n<th><strong>Keterangan regenerasi<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>Biostatistik dan epidemiologi<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>Administrasi dan kebijakan kesehatan<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>Promosi kesehatan dan ilmu perilaku<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>Kesehatan lingkungan dan K3<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>Gizi kesehatan masyarakat<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>Kesehatan reproduksi dan keluarga<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>Metodologi penelitian dan tesis<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>9<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><table>\n<colgroup>\n<col/>\n<col/>\n<\/colgroup>\n<tbody>\n<tr>\n<td><strong>Rasio dosen tetap terhadap mahasiswa aktif saat ini<\/strong><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Rasio yang ditetapkan prodi sebagai rasio optimal dan dasar penetapannya<\/strong><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Rerata beban kerja dosen (SKS/semester) dan rentangnya<\/strong><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Dosen yang akan pensiun atau tugas belajar dalam 5 tahun<\/strong><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><h3><strong>C. Rencana pengembangan SDM<\/strong><\/h3><table>\n<colgroup>\n<col/>\n<col/>\n<col/>\n<col/>\n<col/>\n<col/>\n<col/>\n<\/colgroup>\n<thead>\n<tr>\n<th><strong>No<\/strong><\/th>\n<th><strong>Sasaran<\/strong><\/th>\n<th><strong>Kegiatan<\/strong><\/th>\n<th><strong>Tahun<\/strong><\/th>\n<th><strong>Indikator dan target<\/strong><\/th>\n<th><strong>Anggaran dan sumber dana<\/strong><\/th>\n<th><strong>PIC<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>Proporsi dosen tetap S3 meningkat<\/td>\n<td>Studi lanjut S3 sesuai bidang kesenjangan<\/td>\n<td><\/td>\n<td>K28: ≥ 50%<\/td>\n<td><\/td>\n<td>Kaprodi; Bagian SDM<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>Jenjang jabatan fungsional meningkat<\/td>\n<td>Pendampingan pengusulan jafung<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td>Bagian SDM<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>Seluruh dosen tetap mengikuti CPD<\/td>\n<td>Pelatihan pedagogi, asesmen, metodologi, publikasi<\/td>\n<td><\/td>\n<td>K29: 100%<\/td>\n<td><\/td>\n<td>Koordinator K5<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>Regenerasi bidang kritis<\/td>\n<td>Rekrutmen dosen baru dan mentoring senior–junior<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td>Pimpinan UPPS<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>Kecukupan dan kompetensi tendik<\/td>\n<td>Rekrutmen atau pelatihan layanan, TI, kepustakaan<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td>Bagian SDM<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><h3><strong>D. Monitoring dan review<\/strong><\/h3><p>Kemajuan rencana dicatat setiap semester pada rekap F-PM-15 dan laporan monev SDM P17. Deviasi terhadap target dibahas dalam rapat mutu bulanan dan diputuskan dalam RTM; perubahan rencana dicatat pada riwayat revisi dokumen ini.<\/p><table>\n<colgroup>\n<col/>\n<col/>\n<col/>\n<col/>\n<\/colgroup>\n<thead>\n<tr>\n<th><strong>Semester<\/strong><\/th>\n<th><strong>Kegiatan terealisasi<\/strong><\/th>\n<th><strong>Deviasi dan penyebab<\/strong><\/th>\n<th><strong>Keputusan RTM dan tindak lanjut<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><p>[Kota], [tanggal]<\/p><table>\n<colgroup>\n<col/>\n<col/>\n<col/>\n<\/colgroup>\n<tbody>\n<tr>\n<td><p>Disusun oleh,<\/p>\n<p><strong>Koordinator bidang SDM, Penelitian &amp; PkM (K5)<\/strong><\/p>\n<p>[Nama &amp; NIP/NIDN]<\/p><\/td>\n<td><p>Diperiksa oleh,<\/p>\n<p><strong>Ketua Program Studi<\/strong><\/p>\n<p>[Nama &amp; NIP/NIDN]<\/p><\/td>\n<td><p>Disahkan oleh,<\/p>\n<p><strong>Pimpinan UPPS<\/strong><\/p>\n<p>[Nama &amp; NIP/NIDN]<\/p><\/td>\n<\/tr>\n<\/tbody>\n<\/table>"},"C5-02":{"id":"C5-02","title":"Template Kerangka Kebijakan dan Prosedur Pengembangan SDM Dosen dan Tendik beserta Rekap Rapat Pengembangan SDM","elements":["5.2.4","5.2.5","5.3.1","5.3.2","5.3.3","5.4.3"],"related":"P17, F-PM-15, F-PM-01, F-PM-02, INS-SVY-02, INS-SVY-03, STD-MKM-01, C5-01, C5-06","by":"Kebijakan ditetapkan Rektor/Dekan melalui Bagian SDM; Kaprodi dan Koordinator K5 menyusun penjabaran prodi dan rekap rapat; Sekretaris Tim PM mengarsipkan notulen dan daftar hadir.","when":"Kebijakan direview sesuai siklus universitas; penjabaran prodi dan sosialisasi setiap awal tahun akademik dan saat orientasi dosen/tendik baru; rekap rapat diperbarui setiap semester.","purpose":"Membuktikan bahwa universitas/fakultas memiliki kebijakan dan prosedur SDM yang lengkap (penilaian kinerja, retensi, promosi, penghargaan, sanksi, hak, CPD, jenjang karir), berlaku setara bagi prodi MKM, dipahami dosen dan tendik, serta dibahas dalam forum yang terdokumentasi.","assessor":["Kebijakan dan prosedur penilaian kinerja dan perilaku dosen serta pihak yang bertanggung jawab ditetapkan (5.2.4).","Ada ketentuan retensi, promosi, penghargaan, pemberhentian, penurunan pangkat, dan pemecatan yang dipahami dosen, serta informasi hak (benefit, tunjangan, remunerasi) yang teratur (5.2.4).","Kebijakan menjamin keberlanjutan dan kesejahteraan serta setara dengan prodi lain di institusi (5.2.5).","Kebijakan CPD dan jenjang karir untuk dosen tetap dan kontrak, termasuk kepastian dana dan kesempatan, tersosialisasi (5.3.1; 5.3.3).","Notulen dan daftar hadir menunjukkan kebijakan dibahas, disosialisasikan, dan mekanisme umpan balik atas kebijakan berjalan."],"tips":["Prodi tidak perlu membuat kebijakan SDM sendiri; cukup lampirkan peraturan universitas/fakultas lalu tambahkan penjabaran prodi yang menunjukkan cara penerapannya di MKM.","Belum ada SOP-PM khusus SDM; mekanisme prodi saat ini berjalan melalui P17 dan F-PM-15, sehingga kebijakan universitas/fakultas perlu memuat ketentuan pokok yang belum tercakup di tingkat prodi (sanksi, promosi, remunerasi).","Tunjukkan kesetaraan dengan prodi lain melalui pernyataan ruang lingkup kebijakan yang berlaku untuk seluruh prodi, bukan klaim naratif.","Gunakan hasil butir INS-SVY-02 dan INS-SVY-03 tentang kejelasan tugas, hak, dan jenjang karir sebagai bukti pemahaman kebijakan."],"outline":["A. Ketentuan pokok wajib dalam kebijakan universitas/fakultas","B. Prosedur penerapan di tingkat prodi","C. Rekap rapat dan sosialisasi pengembangan SDM"],"html":"<blockquote>\n<p>Dokumen ini berupa kerangka minimal. Ketentuan yang sudah diatur dalam peraturan universitas/fakultas cukup dirujuk nomor dan pasalnya; kolom penjabaran prodi diisi oleh Kaprodi.<\/p>\n<\/blockquote><h3><strong>A. Ketentuan pokok wajib dalam kebijakan universitas/fakultas<\/strong><\/h3><table>\n<colgroup>\n<col/>\n<col/>\n<col/>\n<col/>\n<col/>\n<\/colgroup>\n<thead>\n<tr>\n<th><strong>No<\/strong><\/th>\n<th><strong>Ketentuan pokok (Buku II/III)<\/strong><\/th>\n<th><strong>Rujukan peraturan universitas/fakultas<\/strong><\/th>\n<th><strong>Penjabaran di Prodi MKM<\/strong><\/th>\n<th><strong>Status (ada/perlu ditambahkan)<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>Perencanaan dan rekrutmen dosen serta tendik berbasis kebutuhan<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>Orientasi dosen dan tendik baru<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>Penilaian kinerja dan perilaku, termasuk pihak penilai dan periodenya<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>Retensi, promosi, dan pemberian penghargaan<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>Pemberhentian, penurunan pangkat, dan pemecatan beserta hak membela diri<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>Hak dosen/tendik: benefit, tunjangan, remunerasi, dan cara penyampaian informasinya<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>Pengembangan profesional berkelanjutan dan jenjang karir dosen tetap dan kontrak<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td>Kepastian dana dan kesempatan CPD (beasiswa, hibah perjalanan, hibah publikasi)<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>9<\/td>\n<td>Pengembangan skill layanan dan jenjang karir tendik<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>Kesejahteraan, keberlanjutan, dan kesetaraan antarprodi<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>11<\/td>\n<td>Mekanisme umpan balik dosen dan tendik atas kebijakan SDM<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><h3><strong>B. Prosedur penerapan di tingkat prodi<\/strong><\/h3><ol>\n<li><p>Kaprodi menyampaikan kebijakan SDM kepada dosen dan tendik setiap awal tahun akademik dan pada orientasi pegawai baru.<\/p><\/li>\n<li><p>Kinerja dosen dimonev setiap semester menggunakan F-PM-15; kinerja tendik dimonev menggunakan instrumen pada C5-06.<\/p><\/li>\n<li><p>Rencana CPD individu disepakati Kaprodi dan dosen, lalu direkap dalam rencana pengembangan SDM (C5-01).<\/p><\/li>\n<li><p>Masukan atas kebijakan dihimpun melalui survei INS-SVY-02 dan INS-SVY-03 serta forum dosen, lalu diteruskan ke Bagian SDM.<\/p><\/li>\n<li><p>Hasil monev dan masukan dibahas dalam RTM untuk diputuskan tindak lanjutnya.<\/p><\/li>\n<\/ol><h3><strong>C. Rekap rapat dan sosialisasi pengembangan SDM<\/strong><\/h3><p>Notulen menggunakan F-PM-02 dan daftar hadir menggunakan F-PM-01. Tabel berikut menjadi indeks bukti agar asesor mudah menelusuri.<\/p><table>\n<colgroup>\n<col/>\n<col/>\n<col/>\n<col/>\n<col/>\n<col/>\n<col/>\n<\/colgroup>\n<thead>\n<tr>\n<th><strong>No<\/strong><\/th>\n<th><strong>Tanggal<\/strong><\/th>\n<th><strong>Forum/kegiatan<\/strong><\/th>\n<th><strong>Agenda SDM yang dibahas<\/strong><\/th>\n<th><strong>Unsur hadir (dosen/tendik/pimpinan)<\/strong><\/th>\n<th><strong>Keputusan pokok<\/strong><\/th>\n<th><strong>Kode file bukti<\/strong><\/th>\n<\/tr>\n<\ 5-09","title":"Template Kerangka Kebijakan Penelitian dan PkM serta Matriks Integrasi Hasil ke Pembelajaran","elements":["5.5.1","5.5.2","5.5.3","5.6.1","5.6.2","5.6.3"],"related":"F-PM-16, F-PM-05, SOP-PM-03, P18, P03, STD-MKM-01, C5-07, C5-08","by":"Kebijakan ditetapkan universitas/LPPM dan fakultas; penjabaran prodi dan matriks integrasi disusun Koordinator penelitian & PkM bersama Koordinator K2; diverifikasi Kaprodi.","when":"Kebijakan direview sesuai siklus universitas; matriks integrasi diperbarui setiap awal semester saat validasi RPS (F-PM-05) dan direkap tahunan pada P18.","purpose":"Membuktikan bahwa universitas/UPPS memiliki kebijakan dan prosedur penelitian dan PkM yang dipahami dosen (hibah, dana, publikasi, pelibatan mahasiswa, kolaborasi) serta kebijakan dan pelaksanaan integrasi hasilnya ke dalam pembelajaran.","assessor":["Kebijakan pelaksanaan penelitian dan PkM serta pelibatan mahasiswa tersedia dan disosialisasikan (5.5.1; 5.6.1).","Prosedur pengajuan hibah, dukungan dana, publikasi, keterlibatan mahasiswa, dan kolaborasi nasional/internasional tersedia (5.5.2; 5.6.2).","Kebijakan dan bukti pelaksanaan integrasi hasil penelitian dan PkM ke pembelajaran (5.5.3; 5.6.3).","Monev dan tindak lanjut kegiatan penelitian dan PkM terdokumentasi."],"tips":["Belum ada SOP-PM khusus penelitian dan PkM; prodi memantau melalui P18 dan F-PM-16, sehingga prosedur hibah, dana, dan publikasi harus dirujuk ke peraturan universitas/LPPM.","Buktikan integrasi dengan menunjuk bagian RPS (topik, studi kasus, bahan bacaan) yang memuat hasil penelitian/PkM, bukan sekadar pernyataan dalam kebijakan.","Tambahkan butir pemeriksaan integrasi hasil penelitian pada validasi RPS (F-PM-05) agar bukti terkumpul otomatis setiap semester."],"outline":["A. Ketentuan pokok wajib dalam kebijakan universitas/fakultas","B. Prosedur integrasi hasil ke pembelajaran di prodi","C. Matriks integrasi hasil penelitian dan PkM ke pembelajaran"],"html":"<h3><strong>A. Ketentuan pokok wajib dalam kebijakan universitas/fakultas<\/strong><\/h3><table>\n<colgroup>\n<col/>\n<col/>\n<col/>\n<col/>\n<col/>\n<\/colgroup>\n<thead>\n<tr>\n<th><strong>No<\/strong><\/th>\n<th><strong>Ketentuan pokok<\/strong><\/th>\n<th><strong>Rujukan peraturan<\/strong><\/th>\n<th><strong>Penjabaran prodi<\/strong><\/th>\n<th><strong>Status<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>Arah dan prioritas penelitian/PkM selaras roadmap dan unggulan<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>Prosedur pengajuan, seleksi, dan pelaporan hibah internal dan eksternal<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>Dukungan dana penelitian, PkM, dan publikasi (biaya publikasi, proofreading, klinik penulisan)<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>Pelibatan mahasiswa dalam penelitian dan PkM dosen, termasuk tesis payung<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>Kolaborasi nasional dan internasional<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>Etik penelitian dan integritas akademik<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>Integrasi hasil penelitian dan PkM ke pembelajaran<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td>Monev, pelaporan, dan tindak lanjut<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>9<\/td>\n<td>Penghargaan atas hibah, HKI, paten, dan publikasi<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><h3><strong>B. Prosedur integrasi hasil ke pembelajaran di prodi<\/strong><\/h3><ol>\n<li><p>Dosen mengidentifikasi hasil penelitian/PkM yang relevan dengan CPMK saat menyusun RPS.<\/p><\/li>\n<li><p>Koordinator K2 memeriksa pencantuman hasil tersebut pada validasi RPS menggunakan F-PM-05.<\/p><\/li>\n<li><p>Dosen menerapkan hasil sebagai materi, studi kasus, bahan bacaan, atau tugas mahasiswa.<\/p><\/li>\n<li><p>Koordi
