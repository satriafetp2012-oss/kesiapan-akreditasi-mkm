akan ditetapkan Rektor/Dekan; penjabaran prodi disusun Kaprodi bersama Koordinator K5 dan Koordinator K4; berkoordinasi dengan Satgas PPKPT dan Unit layanan konseling.","when":"Ditetapkan sekali dan direview tahunan; sosialisasi setiap awal tahun akademik dan pada orientasi pegawai baru; monev tahunan melalui INS-SVY-02 dan INS-SVY-03.","purpose":"Membuktikan bahwa UPPS/PS memiliki kebijakan pencegahan perundungan terhadap dosen dan tendik, mekanisme yang menjamin pencegahan dan penyebarluasannya kepada semua pemangku kepentingan, serta program bagi dosen dan tendik yang mungkin mengalami perundungan.","assessor":["Kebijakan tertulis pencegahan perundungan yang mencakup dosen/staf akademik dan tendik (5.1.3).","Mekanisme pencegahan, pelaporan, dan penanganan, serta bukti penyebarluasan kepada semua pemangku kepentingan.","Program pendampingan dan pemulihan bagi dosen dan tendik yang mengalami perundungan.","Monev berkala atas efektivitas kebijakan dengan data agregat yang menjaga kerahasiaan."],"tips":["SOP-PM-13 menangani keluhan umum dan mengecualikan kasus kekerasan seksual yang ditangani Satgas PPKPT; kebijakan universitas/fakultas perlu menegaskan alur khusus perundungan antarpegawai dan relasi kuasa atasan–bawahan.","Kebijakan kampus sehat untuk mahasiswa (C4-06) dapat diperluas cakupannya ke dosen dan tendik, asalkan ketentuan untuk pegawai ditulis eksplisit.","Sajikan data kasus hanya secara agregat dan anonim sesuai kode etik Tim PM."],"outline":["A. Kerangka dokumen kebijakan","B. Hubungan dengan dokumen mutu prodi","C. Rekap diseminasi dan monev"],"html":"<blockquote>\n<p>Kerahasiaan: identitas pelapor, terlapor, dan saksi tidak dicantumkan dalam dokumen bukti akreditasi. Data disajikan agregat.<\/p>\n<\/blockquote><h3><strong>A. Kerangka dokumen kebijakan<\/strong><\/h3><table>\n<colgroup>\n<col/>\n<col/>\n<col/>\n<col/>\n<\/colgroup>\n<thead>\n<tr>\n<th><strong>No<\/strong><\/th>\n<th><strong>Ketentuan pokok<\/strong><\/th>\n<th><strong>Isi minimal yang harus diatur<\/strong><\/th>\n<th><strong>Rujukan/status<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>Tujuan dan ruang lingkup<\/td>\n<td>Berlaku bagi dosen tetap, dosen tidak tetap, tendik, dan pimpinan di seluruh lokasi kerja termasuk lahan praktik dan ruang daring<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>Definisi dan bentuk perundungan<\/td>\n<td>Fisik, verbal, sosial, siber, akademik, dan penyalahgunaan relasi kuasa<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>Prinsip<\/td>\n<td>Tanpa toleransi, kerahasiaan, non-retaliasi, keadilan prosedural, dan keberpihakan pada korban<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>Pencegahan<\/td>\n<td>Kode etik, pelatihan, orientasi, pembagian beban kerja yang adil, dan pengawasan atasan<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>Kanal pelaporan<\/td>\n<td>Kanal rahasia (F-PM-18 atau kanal universitas), pelaporan langsung ke Satgas PPKPT, dan pelaporan anonim<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>Penanganan<\/td>\n<td>Penerimaan, asesmen awal, pemeriksaan, keputusan, dan tenggat setiap tahap<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>Sanksi<\/td>\n<td>Jenis sanksi bertingkat sesuai peraturan kepegawaian<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td>Perlindungan dan pemulihan<\/td>\n<td>Konseling, pendampingan, penyesuaian tugas sementara, dan pemantauan pascakasus<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>9<\/td>\n<td>Diseminasi<\/td>\n<td>Sosialisasi tahunan, laman unit, dan materi orientasi<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>Monev<\/td>\n<td>Butir survei INS-SVY-02 nomor 9 dan INS-SVY-03 nomor 5, rekap kasus agregat, dan review kebijakan<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><h3><strong>B. Hubungan dengan dokumen mutu prodi<\/strong><\/h3><ul>\n<li><p>SOP-PM-13 dan F-PM-18 digunakan sebagai kanal penerimaan keluhan; laporan perundungan diteruskan ke Satgas PPKPT atau unit kepegawaian sesuai kebijakan.<\/p><\/li>\n<li><p>Analisis tren dan rencana pencegahan dibahas dalam RTM tanpa menyebut identitas.<\/p><\/li>\n<li><p>Materi kebijakan dimasukkan ke paket orientasi dosen baru (C5-05).<\/p><\/li>\n<\/ul><h3><strong>C. Rekap diseminasi dan monev<\/strong><\/h3><table>\n<colgroup>\n<col/>\n<col/>\n<col/>\n<col/>\n<col/>\n<col/>\n<col/>\n<\/colgroup>\n<thead>\n<tr>\n<th><strong>No<\/strong><\/th>\n<th><strong>Kegiatan diseminasi/monev<\/strong><\/th>\n<th><strong>Tanggal<\/strong><\/th>\n<th><strong>Sasaran<\/strong><\/th>\n<th><strong>Jumlah peserta/responden<\/strong><\/th>\n<th><strong>Hasil utama<\/strong><\/th>\n<th><strong>Kode file<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><table>\n<colgroup>\n<col/>\n<col/>\n<\/colgroup>\n<tbody>\n<tr>\n<td><strong>Indeks lingkungan kerja bebas perundungan (dosen/tendik)<\/strong><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Jumlah laporan agregat dan status penyelesaian<\/strong><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><p>[Kota], [tanggal]<\/p><table>\n<colgroup>\n<col/>\n<col/>\n<col/>\n<\/colgroup>\n<tbody>\n<tr>\n<td><p>Disusun oleh,<\/p>\n<p><strong>Koordinator bidang SDM, Penelitian &amp; PkM (K5)<\/strong><\/p>\n<p>[Nama &amp; NIP/NIDN]<\/p><\/td>\n<td><p>Diperiksa oleh,<\/p>\n<p><strong>Ketua Program Studi<\/strong><\/p>\n<p>[Nama &amp; NIP/NIDN]<\/p><\/td>\n<td><p>Disahkan oleh,<\/p>\n<p><strong>Pimpinan UPPS<\/strong><\/p>\n<p>[Nama &amp; NIP/NIDN]<\/p><\/td>\n<\/tr>\n<\/tbody>\n<\/table>"},"C6-01":{"id":"C6-01","title":"Template Inventaris Sarana, Prasarana, dan Sistem Pendukung Pembelajaran","elements":["6.1.1","6.1.2","6.2.3"],"related":"P19, INS-SVY-01, INS-SVY-02, K10, STD-MKM-01, C6-03, C6-09","by":"Dihimpun Koordinator bidang Sarpras, Keuangan & Tata Kelola bersama Bagian keuangan/umum dan unit TI; diverifikasi Kaprodi.","when":"Dimutakhirkan setiap tahun pada monev P19 (September, sebagai masukan RKAT) dan setiap ada pengadaan atau penghapusan aset.","purpose":"Membuktikan bahwa ruang kuliah, ruang dosen, ruang diskusi, laboratorium, perpustakaan, dan sistem pendukung pembelajaran (LMS, SIA, internet, perangkat lunak) memadai, dalam kondisi baik, jelas status kepemilikannya, dapat diakses termasuk oleh mahasiswa berkebutuhan khusus dan di luar jam kerja, serta direncanakan pengembangannya.","assessor":["Kecukupan, kondisi, kemutakhiran, dan status kepemilikan ruang kelas, ruang dosen, dan laboratorium sesuai jumlah mahasiswa dan dosen (6.1.1).","Aksesibilitas bagi mahasiswa berkebutuhan khusus dan akses fasilitas di luar jam kerja.","Sistem pendukung pembelajaran (LMS, internet, wifi, help desk) andal dan mendukung pembelajaran jarak jauh bila digunakan (6.1.2).","Rencana perubahan atau pengembangan fasilitas untuk tiga tahun ke depan dan anggaran pemeliharaan.","Sistem keamanan dan kesiapsiagaan darurat di semua lokasi."],"tips":["Isi kapasitas dan luas dari data aset resmi; pastikan konsisten dengan data yang diunggah ke tabel data dukung LAM-PTKes.","Untuk fasilitas milik bersama (fakultas/universitas), tulis mekanisme pemakaian dan jadwal agar asesor melihat jaminan akses prodi.","Sertakan statistik ketersediaan LMS dan bandwidth dari unit TI sebagai bukti keandalan, bukan sekadar menyebut nama sistem."],"outline":["A. Daftar prasarana dan ruang","B. Sarana pendukung utama","C. Sistem pendukung pembelajaran","D. Keselamatan, keamanan, dan aksesibilitas","E. Rencana pengembangan tiga tahun"],"html":"<table>\n<colgroup>\n<col/>\n<col/>\n<\/colgroup>\n<tbody>\n<tr>\n<td><strong>Tanggal inventaris<\/strong><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Jumlah mahasiswa aktif dan dose ":["Tanggung jawab dan wewenang penjaminan mutu diberikan kepada dosen dan tendik secara tertulis (7.1.2).","Pelaporan kinerja SPM dan peluang perbaikan ditetapkan dan terdokumentasi, termasuk jalur ke Pimpinan UPPS dan LPM (7.1.2).","Integritas SPM dipertahankan melalui independensi auditor, kode etik, dan pengendalian perubahan.","Struktur mencakup pemangku kepentingan internal dan eksternal (perwakilan mahasiswa, penasihat eksternal).","Pemisahan peran antara pemilik proses (Kaprodi, unit pelaksana) dan Tim PM sebagai pemantau dipahami."],"tips":["Jangan menyalin ulang lampiran SK-PM-01; dokumen ini merangkum struktur, garis pelaporan, dan matriks tanggung jawab, lalu merujuk SK sebagai dasar hukum.","Tegaskan bahwa Tim PM tidak menggantikan tanggung jawab pemilik proses; asesor sering menguji pemahaman ini melalui wawancara dosen.","Sertakan bukti pengakuan beban kerja anggota Tim PM dalam BKD sebagai indikator dukungan pimpinan.","Perbarui dokumen segera jika ada pergantian Ketua Tim PM atau koordinator agar tidak ada kekosongan peran."],"outline":["A. Struktur dan garis koordinasi","B. Matriks tanggung jawab per bidang","C. Jalur pelaporan kinerja SPM","D. Ketentuan integritas sistem"],"html":"<table>\n<colgroup>\n<col/>\n<col/>\n<\/colgroup>\n<tbody>\n<tr>\n<td><strong>Dasar penetapan<\/strong><\/td>\n<td>SK-PM-01 (nomor diisi setelah terbit); KM-SPMI-01 bagian 8<\/td>\n<\/tr>\n<tr>\n<td><strong>Periode<\/strong><\/td>\n<td>2026–2028<\/td>\n<\/tr>\n<tr>\n<td><strong>Tanggal berlaku<\/strong><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><h3><strong>A. Struktur dan garis koordinasi<\/strong><\/h3><ol>\n<li><p>LPM/KJM universitas: menetapkan kebijakan SPMI universitas, melatih dan menugaskan auditor AMI, menerima laporan AMI.<\/p><\/li>\n<li><p>Gugus Penjaminan Mutu fakultas: mengoordinasikan SPMI tingkat fakultas dan menyelaraskan dokumen fakultas–prodi.<\/p><\/li>\n<li><p>Pimpinan UPPS: penanggung jawab SPMI prodi, mengesahkan dokumen mutu, menyediakan sumber daya, memimpin RTM.<\/p><\/li>\n<li><p>Ketua Program Studi: pengarah dan pemilik proses akademik, melaksanakan standar dan tindakan koreksi.<\/p><\/li>\n<li><p>Tim PM prodi (Gugus Kendali Mutu): Ketua, Sekretaris, lima Koordinator bidang, operator data, perwakilan mahasiswa, dan penasihat eksternal.<\/p><\/li>\n<\/ol><h3><strong>B. Matriks tanggung jawab per bidang<\/strong><\/h3><table>\n<colgroup>\n<col/>\n<col/>\n<col/>\n<col/>\n<col/>\n<\/colgroup>\n<thead>\n<tr>\n<th><strong>Peran dalam Tim PM<\/strong><\/th>\n<th><strong>Kriteria/bidang<\/strong><\/th>\n<th><strong>Program kerja utama<\/strong><\/th>\n<th><strong>Unsur (dosen/tendik/mahasiswa/eksternal)<\/strong><\/th>\n<th><strong>Laporan yang dihasilkan<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Ketua Tim PM<\/td>\n<td>K7 dan koordinasi seluruh kriteria<\/td>\n<td>P01, P02, P07, P08, P09<\/td>\n<td>Dosen<\/td>\n<td>Laporan semester, laporan tahunan mutu<\/td>\n<\/tr>\n<tr>\n<td>Sekretaris Tim PM<\/td>\n<td>Dokumen dan data<\/td>\n<td>P10<\/td>\n<td>Dosen/tendik<\/td>\n<td>Daftar induk, register PTK dan risiko<\/td>\n<\/tr>\n<tr>\n<td>Koordinator K2<\/td>\n<td>Pembelajaran dan kurikulum<\/td>\n<td>P03, P12, P13<\/td>\n<td>Dosen<\/td>\n<td>Laporan monev pembelajaran<\/td>\n<\/tr>\n<tr>\n<td>Koordinator K3<\/td>\n<td>Penjaminan mutu penilaian<\/td>\n<td>P04<\/td>\n<td>Dosen<\/td>\n<td>Laporan QA penilaian<\/td>\n<\/tr>\n<tr>\n<td>Koordinator K4<\/td>\n<td>Kemahasiswaan, alumni, keselamatan<\/td>\n<td>P06, P14, P15, P16<\/td>\n<td>Dosen<\/td>\n<td>Laporan layanan dan keselamatan<\/td>\n<\/tr>\n<tr>\n<td>Koordinator K5<\/td>\n<td>SDM, penelitian, PkM<\/td>\n<td>P17, P18<\/td>\n<td>Dosen<\/td>\n<td>Laporan monev SDM dan penelitian/PkM<\/td>\n<\/tr>\n<tr>\n<td>Koordinator K1, K6, K8<\/td>\n<td>VMTS, sarpras, keuangan, tata kelola<\/td>\n<td>P11, P19, P20<\/td>\n<td>Dosen/tendik<\/td>\n<td>Laporan sarpras, keuangan, risiko<\/td>\n<\/tr>\n<tr>\n<td>Operator data<\/td>\n<td>Data dan survei<\/td>\n<td>P05, P10<\/td>\n<td>Tendik<\/td>\n<td>Laporan survei, rekonsiliasi PD Dikti<\/td>\n<\/tr>\n<tr>\n<td>Perwakilan mahasiswa<\/td>\n<td>Suara pengguna layanan<\/td>\n<td>P05, P15<\/td>\n<td>Mahasiswa<\/td>\n<td>Masukan forum mahasiswa<\/td>\n<\/tr>\n<tr>\n<td>Penasihat eksternal<\/td>\n<td>Relevansi dan perspektif eksternal<\/td>\n<td>P06, P11, P12<\/td>\n<td>Eksternal<\/td>\n<td>Masukan tertulis<\/td>\n<\/tr>\n<\/tbody>\n<\/table><h3><strong>C. Jalur pelaporan kinerja SPM<\/strong><\/h3><table>\n<colgroup>\n<col/>\n<col/>\n<col/>\n<col/>\n<col/>\n<\/colgroup>\n<thead>\n<tr>\n<th><strong>Laporan<\/strong><\/th>\n<th><strong>Penyusun<\/strong><\/th>\n<th><strong>Frekuensi<\/strong><\/th>\n<th><strong>Penerima<\/strong><\/th>\n<th><strong>Forum pembahasan<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Laporan bulanan Tim PM<\/td>\n<td>Ketua Tim PM<\/td>\n<td>Bulanan<\/td>\n<td>Kaprodi<\/td>\n<td>Rapat mutu bulanan<\/td>\n<\/tr>\n<tr>\n<td>Laporan monev semester<\/td>\n<td>Ketua Tim PM<\/td>\n<td>Semester (≤ 2 minggu sebelum RTM)<\/td>\n<td>Kaprodi, Pimpinan UPPS<\/td>\n<td>RTM (SOP-PM-10)<\/td>\n<\/tr>\n<tr>\n<td>Laporan AMI<\/td>\n<td>Ketua auditor<\/td>\n<td>Tahunan<\/td>\n<td>Pimpinan UPPS, LPM<\/td>\n<td>RTM<\/td>\n<\/tr>\n<tr>\n<td>Laporan tahunan mutu<\/td>\n<td>Ketua Tim PM<\/td>\n<td>Tahunan (Desember)<\/td>\n<td>Pimpinan UPPS, universitas, publik (ringkasan)<\/td>\n<td>RTM<\/td>\n<\/tr>\n<\/tbody>\n<\/table><h3><strong>D. Ketentuan integritas sistem<\/strong><\/h3><ul>\n<li><p>Auditor AMI berasal dari LPM atau prodi lain dan menandatangani pakta independensi (SOP-PM-02).<\/p><\/li>\n<li><p>Seluruh anggota Tim PM menandatangani kode etik SK-PM-01 Lampiran III: objektivitas, independensi, kerahasiaan, kejujuran, konstruktif, dan tepat waktu.<\/p><\/li>\n<li><p>Perubahan dokumen SPMI dikendalikan melalui F-PM-17 dan SOP-PM-01.<\/p><\/li>\n<li><p>Verifikasi efektivitas PTK dilakukan oleh pihak yang independen dari pelaksana koreksi (SOP-PM-09).<\/p><\/li>\n<\/u <script>
"use strict";
/* ============================================================
   Dashboard Kesiapan Akreditasi MKM 2028
   Katalog statis (instrumen, daftar dokumen, contoh, linimasa) tertanam di halaman;
   status kerja tim (elemen, dokumen, tonggak, unggahan) disimpan di basis data bersama (db).
   ============================================================ */
const CAT = JSON.parse(document.getElementById("catalog").textContent);
const CRIT = CAT.crit.map(([id, name]) => ({ id, name }));
const SUBS = CAT.subs;
const ELS = CAT.elements;
const EVID = CAT.evidence;
const TPL = CAT.templates;
const EL_BY_ID = Object.fromEntries(ELS.map(e => [e.id, e]));
const SUB_BY_ID = Object.fromEntries(SUBS.map(s => [s.id, s]));
const EV_BY_ID = Object.fromEntries(EVID.map(e => [e.id, e]));

/* Item yang harus disiapkan: 4 kelompok, satu skema status */
const GROUPS = [
  { id: "ev", name: "Dokumen bukti", items: EVID.map(e => ({ id: e.id, crit: e.crit, title: e.doc, sub: e.tpl, src: "", tpl: true })) },
  { id: "tb", name: "Tabel data dukung", items: CAT.tables.map(t => ({ id: t.id, crit: t.crit, title: `Tabel ${t.no}. ${t.title}`, sub: t.note, src: t.src, applies: t.applies, cols: t.cols, ev: t.ev })) },
  { id: "led", name: "Komponen LED", items: CAT.led.map(l => ({ id: l.id, crit: "", title: l.title, sub: l.note, src: l.src })) },
  { id: "al", name: "Asesmen lapangan", items: CAT.al.map(a => ({ id: a.id, crit: "", title: a.title, sub: a.note, src: "" })) },
];
const ITEM_BY_ID = {};
GROUPS.forEach(g => g.items.forEach(i => { i.group = g.id; ITEM_BY_ID[i.id] = i; }));

const ST_ITEM = [
  { v: "belum", t: "Belum ada", w: 0 },
  { v: "proses", t: "Sedang disusun", w: 0.4 },
  { v: "ada", t: "Tersedia, belum divalidasi", w: 0.8 },
  { v: "valid", t: "Tervalidasi", w: 1 },
  { v: "na", t: "Tidak berlaku", w: null },
];
const ST_ITEM_BY = Object.fromEntries(ST_ITEM.map(s => [s.v, s]));
const ST_MS = [{ v: "belum", t: "Belum mulai" }, { v: "proses", t: "Berjalan" }, { v: "selesai", t: "Selesai" }];
const EL_LABEL = { M: "Memenuhi", MS: "Memenuhi sebagian", TM: "Tidak memenuhi", "": "Belum dinilai" };
const SUB_LABEL = { M: "Memenuhi", MS: "Memenuhi sebagian", TM: "Tidak memenuhi", NA: "Belum lengkap", NONE: "Belum dinilai" };
const PILL = { M: "ok", MS: "warn", TM: "bad", NA: "none", NONE: "none", "": "none" };

const S = {
  el: {}, ev: {}, ms: {}, up: {}, cfg: {},
  mode: "connecting", db: null, user: null, me: null, sample: null, assets: null, downloads: null,
  canWrite: true, tab: "ringkasan", krit: "K1", tpl: "C1-01", listGroup: "ev",
  filters: { elQ: "", elSt: "all", itQ: "", itCrit: "all", itSt: "all", upQ: "", upCrit: "all" },
  pending: [], // berkas yang sedang diproses (belum disimpan)
  openEl: new Set(), confirmDel: null,
};

/* ---------- utilitas ---------- */
const $ = (sel, root = document) => root.querySelector(sel);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pct = x => `${Math.round((x || 0) * 100)}%`;
const todayISO = () => new Date().toISOString().slice(0, 10);
const parseD = s => { const [y, m, d] = String(s).split("-").map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const fmtD = s => s ? parseD(s).toLocaleDateString("id-ID", { day: "numeric", month: "short", year: "numeric" }) : "–";
const daysTo = s => Math.round((parseD(s) - parseD(todayISO())) / 86400000);
const uid = () => "u" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const submitDate = () => S.cfg.submit || "2027-12-15";
function toast(msg) {
  const host = $("#toastHost");
  host.innerHTML = `<div class="toast" role="status">${esc(msg)}</div>`;
  clearTimeout(toast.t); toast.t = setTimeout(() => (host.innerHTML = ""), 3200);
}
function critName(k) { return (CRIT.find(c => c.id === k) || {}).name || ""; }
function elMatchesRef(elId, ref) { return ref === elId || elId.startsWith(ref + "."); }

/* ---------- penyimpanan ---------- */
const LS_KEY = "akreditasi-mkm-2028-v1";
function loadLocal() {
  try { const d = JSON.parse(localStorage.getItem(LS_KEY) || "{}"); ["el", "ev", "ms", "up", "cfg"].forEach(k => d[k] && (S[k] = d[k])); } catch (e) { /* penyimpanan tidak tersedia */ }
}
function saveLocal() {
  try { localStorage.setItem(LS_KEY, JSON.stringify({ el: S.el, ev: S.ev, ms: S.ms, up: S.up, cfg: S.cfg })); } catch (e) { /* abaikan */ }
}
const writeQueue = {};
function write(coll, id, data) {
  if (coll === "cfg") S.cfg = data; else S[coll][id] = data;
  if (S.mode !== "shared") { saveLocal(); scheduleRender(); return Promise.resolve(); }
  const path = `${coll}/${id}`;
  const run = () => S.db.doc(path).set(data).catch(e => {
    if (e && e.code === "invalid_argument") { S.canWrite = false; toast("Akses Anda hanya baca; perubahan tidak tersimpan."); scheduleRender(); }
    else if (e && e.code === "quota_exceeded") toast("Basis data penuh. Hapus beberapa unggahan lama.");
    else toast("Gagal menyimpan. Coba lagi sebentar lagi.");
  });
  writeQueue[path] = (writeQueue[path] || Promise.resolve()).then(run);
  scheduleRender();
  return writeQueue[path];
}
function remove(coll, id) {
  delete S[coll][id];
  if (S.mode !== "shared") { saveLocal(); scheduleRender(); return Promise.resolve(); }
  scheduleRender();
  return S.db.doc(`${coll}/${id}`).delete().catch(() => toast("Gagal menghapus."));
}
const stamp = () => ({ by: S.me || "", at: new Date().toISOString() });
function setEl(id, patch) { write("el", id, { ...(S.el[id] || {}), ...patch, ...stamp() }); }
function setItem(id, patch) { write("ev", id, { ...(S.ev[id] || {}), ...patch, ...stamp() }); }
function setMs(id, patch) { write("ms", id, { ...(S.ms[id] || {}), ...patch, ...stamp() }); }

/* ---------- perhitungan kesiapan ---------- */
function elSt(id) { return (S.el[id] && S.el[id].status) || ""; }
function itemSt(id) {
  const it = ITEM_BY_ID[id];
  const s = S.ev[id] && S.ev[id].status;
  if (s) return s;
  if (it && it.applies === "Tidak berlaku") return "na";
  return "belum";
}
function subStatus(sid) {
  const els = ELS.filter(e => e.sub === sid);
  const st = els.map(e => elSt(e.id));
  const done = st.filter(Boolean);
  const res = { total: els.length, assessed: done.length, M: st.filter(x => x === "M").length, MS: st.filter(x => x === "MS").length, TM: st.filter(x => x === "TM").length };
  const rule = arr => {
    if (!arr.length) return "NONE";
    if (arr.every(x => x === "M")) return "M";
    const tm = arr.filter(x => x === "TM").length;
    if (tm > arr.length / 2) return "TM";
    return "MS";
  };
  res.provisional = rule(done);
  res.s = done.length < els.length ? (done.length ? "NA" : "NONE") : rule(done);
  return res;
}
/* Simulasi Buku II 3.4: semua sub-kriteria "Memenuhi" → Unggul 5 th; 1–2 / 3–4 dari 9 sub fleksibel MS → Unggul 4 / 3 th;
   ≥5 sub fleksibel MS → Terakreditasi; TM mana pun atau MS di sub kritis → Tidak Terakreditasi. */
function predict() {
  const rows = SUBS.map(s => ({ s, r: subStatus(s.id) }));
  const scored = rows.filter(x => x.r.assessed > 0).map(x => ({ ...x, st: x.r.provisional }));
  const unassessed = rows.filter(x => x.r.assessed === 0).length;
  const incomplete = rows.filter(x => x.r.assessed > 0 && x.r.assessed < x.r.total).length;
  const tm = scored.filter(x => x.st === "TM");
  const msK = scored.filter(x => x.st === "MS" && !x.s.flex);
  const msF = scored.filter(x => x.st === "MS" && x.s.flex);
  let label, tone;
  if (!scored.length) { label = "Belum dapat disimulasikan"; tone = "none"; }
  else if (tm.length || msK.length) { label = "Tidak Terakreditasi"; tone = "bad"; }
  else if (msF.length === 0) { label = "Unggul · 5 tahun"; tone = "ok"; }
  else if (msF.length <= 2) { label = "Unggul · 4 tahun"; tone = "ok"; }
  else if (msF.length <= 4) { label = "Unggul · 3 tahun"; tone = "warn"; }
  else { label = "Terakreditasi"; tone = "warn"; }
  if (scored.length && (unassessed || incomplete)) label = "Sementara: " + label;
  return { label, tone, tm, msK, msF, unassessed, incomplete, scored: scored.length };
}
function critStats(k) {
  const els = ELS.filter(e => e.crit === k);
  const c = { total: els.length, M: 0, MS: 0, TM: 0, X: 0 };
  els.forEach(e => { const s = elSt(e.id); c[s || "X"]++; });
  c.score = (c.M + c.MS * 0.5) / c.total;
  const items = EVID.filter(e => e.crit === k).map(e => e.id).concat(CAT.tables.filter(t => t.crit === k).map(t => t.id));
  c.doc = itemsScore(items);
  c.uploads = Object.values(S.up).filter(u => (u.elements || []).some(id => id.startsWith(k.slice(1) + "."))).length;
  return c;
}
function itemsScore(ids) {
  const ws = ids.map(id => ST_ITEM_BY[itemSt(id)].w).filter(w => w !== null);
  return ws.length ? ws.reduce((a, b) => a + b, 0) / ws.length : 0;
}
function readiness() {
  const elScore = ELS.reduce((a, e) => a + ({ M: 1, MS: 0.5 }[elSt(e.id)] || 0), 0) / ELS.length;
  const assessed = ELS.filter(e => elSt(e.id)).length / ELS.length;
  const ev = itemsScore(EVID.map(e => e.id));
  const tb = itemsScore(CAT.tables.map(t => t.id));
  const led = itemsScore(CAT.led.map(l => l.id).concat(CAT.al.map(a => a.id)));
  return { elScore, assessed, ev, tb, led, overall: (elScore + ev + tb + led) / 4 };
}

  const counts = g.items.reduce((a, i) => (a[itemSt(i.id)] = (a[itemSt(i.id)] || 0) + 1, a), {});
  const hasCrit = g.id === "ev" || g.id === "tb";

  <div class="toolbar" style="margin-bottom:12px">

const LIBS = {
  pdf: ["https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js", "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js"],
  mammoth: ["https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js"],
  xlsx: ["https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"],
  jszip: ["https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"],
};
const loaded = {};
function loadScript(src) {
  return loaded[src] || (loaded[src] = new Promise((res, rej) => {
    const s = document.createElement("script"); s.src = src; s.onload = res;
    s.onerror = () => { delete loaded[src]; rej(new Error("Pustaka pembaca gagal dimuat: " + src.split("/").slice(-2, -1)[0])); };
    document.head.appendChild(s);
  }));
}
async function lib(name) { for (const src of LIBS[name]) await loadScript(src); }

const MAX_TEXT = 20000; // karakter teks yang disimpan per dokumen
async function extractText(file) {
  const ext = (file.name.split(".").pop() || "").toLowerCase();
  const buf = await file.arrayBuffer();
  if (ext === "pdf") {
    await lib("pdf");
    const pdf = await window.pdfjsLib.getDocument({ data: new Uint8Array(buf), isEvalSupported: false }).promise;
    const n = Math.min(pdf.numPages, 250); let out = [];
    for (let i = 1; i <= n; i++) {
      const page = await pdf.getPage(i);
      const tc = await page.getTextContent();
      out.push(tc.items.map(it => it.str + (it.hasEOL ? "\n" : " ")).join(""));
    }
    return { text: out.join("\n"), pages: pdf.numPages };
  }
  if (ext === "docx") {
    await lib("mammoth");
    const r = await window.mammoth.extractRawText({ arrayBuffer: buf });
    return { text: r.value, pages: null };
  }
  if (["xlsx", "xls", "xlsm", "csv"].includes(ext)) {
    await lib("xlsx");
    const wb = window.XLSX.read(buf, { type: "array" });
    const text = wb.SheetNames.map(n => `## ${n}\n` + window.XLSX.utils.sheet_to_csv(wb.Sheets[n], { blankrows: false })).join("\n");
    return { text, pages: wb.SheetNames.length };
  }
  if (ext === "pptx") {
    await lib("jszip");
    const zip = await window.JSZip.loadAsync(buf);
    const slides = Object.keys(zip.files).filter(k => /^ppt\/slides\/slide\d+\.xml$/.test(k)).sort((a, b) => parseInt(a.match(/\d+/)[0]) - parseInt(b.match(/\d+/)[0]));
    const out = [];
    for (const k of slides) { const x = await zip.file(k).async("string"); out.push((x.match(/<a:t>([^<]*)<\/a:t>/g) || []).map(t => t.replace(/<\/?a:t>/g, "")).join(" ")); }
    return { text: out.join("\n"), pages: slides.length };
  }
  if (["txt", "md", "html", "htm", "json", "rtf"].includes(ext)) {
    let t = new TextDecoder().decode(buf);
    if (ext.startsWith("htm")) { const d = new DOMParser().parseFromString(t, "text/html"); t = d.body ? d.body.innerText || d.body.textContent : t; }
    return { text: t, pages: null };
  }
  if (ext === "doc" || ext === "ppt") throw new Error("Format lama (.doc/.ppt) belum bisa dibaca. Simpan ulang sebagai .docx/.pptx atau PDF.");
  throw new Error("Format belum didukung. Gunakan PDF, DOCX, XLSX, CSV, PPTX, atau TXT.");
}

/* ---------- pemetaan kata kunci ---------- */
const STOP = new Set("yang untuk dengan dari pada dalam atau oleh ini itu sebagai adalah serta tersebut setiap juga akan dapat telah bagaimana apakah siapa program studi prodi mahasiswa dosen terhadap kepada secara antara melalui sesuai memiliki tentang bentuk tidak sudah hasil adanya terkait".split(" "));
const norm = t => " " + String(t).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9\.\-\s]/g, " ").replace(/\s+/g, " ") + " ";
const toks = t => [...new Set(norm(t).split(" ").filter(w => w.length >= 5 && !STOP.has(w) && !/^\d/.test(w)))];
const EL_TOK = Object.fromEntries(ELS.map(e => [e.id, toks(e.q + " " + e.check.join(" "))]));
const EV_TOK = Object.fromEntries(EVID.map(e => [e.id, toks(e.doc + " " + e.tpl.replace(/^Template /, ""))]));
function countIn(text, kw, cap = 12) {
  const needle = " " + kw; let n = 0, i = 0;
  while (n < cap && (i = text.indexOf(needle, i)) !== -1) { n++; i += needle.length; }
  return n;
}
function analyzeText(name, raw) {
  const text = norm(name.replace(/[_\.]/g, " ") + " " + raw.slice(0, 200000));
  const words = new Set(text.split(" "));
  const head = norm(name.replace(/[_\.]/g, " ") + " " + raw.slice(0, 4000));
  // jenis dokumen
  let doctype = "Lainnya", best = 0;
  CAT.doctypes.forEach(d => { const s = d.kw.reduce((a, k) => a + countIn(head, k, 5) * 2 + Math.min(countIn(text, k, 20), 6) * 0.3, 0); if (s > best) { best = s; doctype = d.name; } });
  // periode
  const yrs = (raw.match(/\b20[12]\d\b/g) || []).map(Number).filter(y => y >= 2015 && y <= 2030);
  const yc = {}; yrs.forEach(y => (yc[y] = (yc[y] || 0) + 1));
  const topYears = Object.entries(yc).sort((a, b) => b[1] - a[1]).slice(0, 3).map(x => +x[0]).sort();
  const period = topYears.length ? (topYears.length > 1 ? `${topYears[0]}–${topYears[topYears.length - 1]}` : String(topYears[0])) : "";
  // skor sub-kriteria
  const subScore = {};
  SUBS.forEach(s => { const L = CAT.lex[s.id] || []; subScore[s.id] = L.reduce((a, kw) => a + Math.sqrt(countIn(text, kw)) * (kw.includes(" ") ? 2 : 1), 0) / Math.sqrt(Math.max(1, L.length) / 10); });
  const maxSub = Math.max(0.0001, ...Object.values(subScore));
  // skor elemen
  const elRank = ELS.map(e => {
    const tk = EL_TOK[e.id]; const hit = tk.filter(w => words.has(w)).length / Math.max(1, tk.length);
    const sn = subScore[e.sub] / maxSub;
    return { id: e.id, score: subScore[e.sub] >= 2 ? 0.55 * sn + 0.45 * hit : 0.3 * hit };
  }).sort((a, b) => b.score - a.score);
  const elements = elRank.filter(x => x.score >= 0.32).slice(0, 8).map(x => ({ id: x.id, score: +x.score.toFixed(2) }));
  const topCrit = new Set(elements.slice(0, 4).map(x => EL_BY_ID[x.id].crit));
  const dtKey = (CAT.doctypes.find(d => d.name === doctype) || { kw: [] }).kw[0] || "";
  const evRank = EVID.map(e => {
    const tk = EV_TOK[e.id]; let s = tk.filter(w => words.has(w)).length / Math.max(1, tk.length);
    if (topCrit.has(e.crit)) s += 0.15;
    if (dtKey && norm(e.doc).includes(" " + dtKey.split(" ")[0])) s += 0.25;
    return { id: e.id, score: Math.min(1, s) };
  }).sort((a, b) => b.score - a.score);
  const evidence = evRank.filter(x => x.score >= 0.38).slice(0, 4).map(x => ({ id: x.id, score: +x.score.toFixed(2) }));
  return { doctype, period, kw: elements, kwEv: evidence };
}

async function handleFiles(list) {
  const files = [...list];
  if (!files.length) return;
  S.tab = "unggah";
  for (const f of files) {
    const p = { pid: uid(), name: f.name, size: f.size, ext: (f.name.split(".").pop() || "").toLowerCase(), file: f, state: "reading", elements: [], evidence: [], link: "", keepCopy: false };
    S.pending.unshift(p);
  }
  render(true);
  for (const p of S.pending.filter(x => x.state === "reading")) {
    try {
      const r = await extractText(p.file);
      const text = (r.text || "").replace(/\u0000/g, "").replace(/[ \t]+/g, " ").replace(/\n{3,}/g, "\n\n").trim();
      p.text = text; p.pages = r.pages; p.chars = text.length;
      if (text.length < 80) { p.state = "empty"; }
      else {
        Object.assign(p, analyzeText(p.name, text)); p.state = "ready";
        // Pra-centang hanya kecocokan kuat; sisanya tampil sebagai saran
        p.elements = (p.kw.filter(x => x.score >= 0.5).length ? p.kw.filter(x => x.score >= 0.5) : p.kw.slice(0, 3)).map(x => x.id);
        p.evidence = (p.kwEv.filter(x => x.score >= 0.5).length ? p.kwEv.filter(x => x.score >= 0.5) : p.kwEv.slice(0, 1)).map(x => x.id);
      }
    } catch (e) { p.state = "error"; p.err = e.message || String(e); }
    scheduleRender();
  }
}

  const msRows = CAT.milestones.map(m => { const d = S.ms[m.id] || {}; return { Kode: m.id, Tenggat: m.date, Tonggak: m.title, Luaran: m.output, PIC: d.pic || m.pic, Status: (ST_MS.find(s => s.v === msStatus(m)) || {}).t, Catatan: d.note || "" }; });

  [["Elemen", elRows], ["Sub-kriteria", subRows], ["Daftar_Persiapan", itRows], ["Unggahan", upRows.length ? upRows : [{ Berkas: "(belum ada)" }]], ["Linimasa", msRows]]
    .forEach(([n, rows]) => X.utils.book_append_sheet(wb, X.utils.json_to_sheet(rows), n));
  const data = X.write(wb, { type: "array", bookType: "xlsx" });
  try { await S.downloads.save({ filename: `Kesiapan_Akreditasi_MKM_${todayISO()}.xlsx`, data: new Blob([data], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }) }); }
  catch (e) { if (e && e.code !== "cancelled" && e.code !== "declined") toast("Unduhan dibatalkan atau gagal."); }
}

/* ============================ kerangka .docx (dibangun di peramban) ============================
   Konversi HTML templat sederhana (h1–h3, p, ul/ol, table, strong/em) ke WordprocessingML
   lalu dikemas dengan JSZip menjadi .docx yang valid. */
const xmlEsc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function wRuns(node, fmt = {}) {
  let out = "";
  node.childNodes.forEach(n => {
    if (n.nodeType === 3) {
      const t = n.textContent.replace(/\s+/g, " ");
      if (!t.trim() && !out) return;
      const rpr = (fmt.b ? "<w:b/>" : "") + (fmt.i ? "<w:i/>" : "") + (fmt.color ? `<w:color w:val="${fmt.color}"/>` : "") + (fmt.sz ? `<w:sz w:val="${fmt.sz}"/>` : "");
      out += `<w:r>${rpr ? `<w:rPr>${rpr}</w:rPr>` : ""}<w:t xml:space="preserve">${xmlEsc(t)}</w:t></w:r>`;
    } else if (n.nodeType === 1) {
      const tag = n.tagName;
      if (tag === "BR") out += "<w:r><w:br/></w:r>";
      else if (!["TABLE", "UL", "OL"].includes(tag)) out += wRuns(n, { ...fmt, b: fmt.b || tag === "STRONG" || tag === "B", i: fmt.i || tag === "EM" || tag === "I" });
    }
  });
  return out;
}
const wP = (inner, ind) => `<w:p><w:pPr><w:spacing w:after="80"/>${ind ? `<w:ind w:left="${ind}" w:hanging="240"/>` : ""}</w:pPr>${inner}</w:p>`;
function wBlocks(node) {
  let out = "";
  node.childNodes.forEach(el => {
    if (el.nodeType === 3) { if (el.textContent.trim()) out += wP(`<w:r><w:t xml:space="preserve">${xmlEsc(el.textContent.trim())}</w:t></w:r>`); return; }
    if (el.nodeType !== 1) return;
    const tag = el.tagName;
    if (/^H[1-4]$/.test(tag)) out += wP(wRuns(el, { b: true, sz: { H1: 32, H2: 28, H3: 24, H4: 22 }[tag], color: "1D4B9B" }));
    else if (tag === "P") out += wP(wRuns(el));
    else if (tag === "UL" || tag === "OL") [...el.children].forEach((li, i) => { out += wP(`<w:r><w:t xml:space="preserve">${tag === "OL" ? i + 1 + "." : "•"} </w:t></w:r>` + wRuns(li), 360); });
    else if (tag === "TABLE") out += wTable(el);
    else if (["DIV", "SECTION", "ARTICLE", "BLOCKQUOTE", "FIGURE"].includes(tag)) out += wBlocks(el);
    else out += wP(wRuns(el));
  });
  return out;
}
function wTable(tbl) {
  const rows = [...tbl.querySelectorAll("tr")].filter(tr => tr.closest("table") === tbl);
  const ncol = Math.max(1, ...rows.map(tr => [...tr.children].reduce((a, c) => a + (+c.getAttribute("colspan") || 1), 0)));
  const b = k => `<w:${k} w:val="single" w:sz="4" w:space="0" w:color="8A94A6"/>`;
  let x = `<w:tbl><w:tblPr><w:tblW w:w="5000" w:type="pct"/><w:tblBorders>${["top", "left", "bottom", "right", "insideH", "insideV"].map(b).join("")}</w:tblBorders><w:tblCellMar><w:left w:w="80" w:type="dxa"/><w:right w:w="80" w:type="dxa"/></w:tblCellMar></w:tblPr><w:tblGrid>${'<w:gridCol w:w="1"/>'.repeat(ncol)}</w:tblGrid>`;
  rows.forEach(tr => {
    x += "<w:tr>";
    [...tr.children].forEach(td => {
      const span = +td.getAttribute("colspan") || 1;
      const hasBlock = [...td.children].some(c => ["P", "UL", "OL", "TABLE", "DIV", "H3", "H4"].includes(c.tagName));
      let inner = hasBlock ? wBlocks(td) : wP(wRuns(td, { b: td.tagName === "TH" }));
      if (!inner || !inner.endsWith("</w:p>")) inner += "<w:p/>";
      x += `<w:tc><w:tcPr><w:tcW w:w="0" w:type="auto"/>${span > 1 ? `<w:gridSpan w:val="${span}"/>` : ""}${td.tagName === "TH" ? '<w:shd w:val="clear" w:color="auto" w:fill="EEF1F6"/>' : ""}</w:tcPr>${inner}</w:tc>`;
    });
    x += "</w:tr>";
  });
  return x + "</w:tbl>" + wP("");
}
async function buildDocx(t) {
  await lib("jszip");
  const holder = document.createElement("div");
  holder.innerHTML = tplDoc(t).replace(/^[\s\S]*<body>/, "").replace(/<\/body>[\s\S]*$/, "");
  const body = wBlocks(holder);
  const doc = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><w:body>${body}<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1134" w:header="567" w:footer="567" w:gutter="0"/></w:sectPr></w:body></w:document>`;
  const styles = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Arial" w:hAnsi="Arial" w:cs="Arial" w:eastAsia="Arial"/><w:sz w:val="21"/><w:szCs w:val="21"/><w:lang w:val="id-ID"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:after="80" w:line="264" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults><w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/></w:style></w:styles>`;
  const zip = new window.JSZip();
  zip.file("[Content_Types].xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/></Types>`);
  zip.file("_rels/.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`);
  zip.file("word/_rels/document.xml.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`);
  zip.file("word/document.xml", doc);
  zip.file("word/styles.xml", styles);
  return zip.generateAsync({ type: "blob", mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
}

/* ============================ interaksi ============================ */
function go(tab) { S.tab = tab; render(true); window.scrollTo(0, 0); }
function scrollToId(id) { requestAnimationFrame(() => { const el = document.getElementById(id); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); }); }
function gotoItem(id) {
  const it = ITEM_BY_ID[id]; if (!it) return;
  S.listGroup = it.group; S.filters.itQ = ""; S.filters.itCrit = "all"; S.filters.itSt = "all";
  go("daftar"); scrollToId("item-" + id);
}
function gotoEl(id) {
  const e = EL_BY_ID[id]; if (!e) return;
  S.krit = e.crit; S.filters.elQ = ""; S.filters.elSt = "all"; S.openEl.add(id);
  go("kriteria"); scrollToId("el-" + id);
}
document.addEventListener("click", async e => {
  const t = e.target.closest("button,[data-tab-go],[data-goto-krit],tr[data-goto-krit]");
  if (!t) return;
  const ds = t.dataset;
  if (ds.tab) return go(ds.tab);
  if (ds.tabGo) return go(ds.tabGo);
  if (ds.gotoKrit) { S.krit = ds.gotoKrit; return go("kriteria"); }
  if (ds.krit) { S.krit = ds.krit; render(true); return; }
  if (ds.gotoSub) { S.krit = SUB_BY_ID[ds.gotoSub].crit; S.filters.elQ = ""; S.filters.elSt = "all"; go("kriteria"); return scrollToId("sub-" + ds.gotoSub); }
  if (ds.gotoEl) return gotoEl(ds.gotoEl);
  if (ds.gotoItem) return gotoItem(ds.gotoItem);
  if (ds.gotoUp) { S.openUp = ds.gotoUp; go("unggah"); return scrollToId("up-" + ds.gotoUp); }
  if (ds.openTpl || ds.tpl) { S.tpl = ds.openTpl || ds.tpl; if (S.tab !== "contoh") go("contoh"); else { render(true); $(".doc-sheet") && $(".doc-sheet").scrollIntoView({ block: "start" }); } return; }
  if (ds.elset) { e.preventDefault(); const v = ds.v === "X" ? "" : ds.v; setEl(ds.elset, { status: v }); S.openEl.add(ds.elset); return; }
  if (t.id === "expandAll") { ELS.filter(x => x.crit === S.krit).forEach(x => S.openEl.add(x.id)); return render(true); }
  if (ds.group) { S.listGroup = ds.group; return render(true); }
  if (t.id === "exportXlsx") return exportXlsx();
  if (t.id === "exportJson") {
    const data = JSON.stringify({ app: "kesiapan-akreditasi-mkm", version: 1, exportedAt: new Date().toISOString(), el: S.el, ev: S.ev, ms: S.ms, up: S.up, cfg: S.cfg }, null, 1);
    try { await S.downloads.save({ filename: `data_kesiapan_akreditasi_${todayISO()}.json`, data: new Blob([data], { type: "application/json" }) }); } catch (err) { toast("Ekspor dibatalkan."); }
    return;
  }
  if (t.id === "importJsonBtn") return $("#importJson").click();
  if (ds.dlTpl) {
    const tp = TPL[ds.dlTpl];
    try { const blob = await buildDocx(tp); await S.downloads.save({ filename: `${tp.id}_${tp.title.replace(/^Template /, "").replace(/[^\w\s-]/g, "").trim().replace(/\s+/g, "_").slice(0, 60)}.docx`, data: blob }); }
    catch (err) { if (err && !["cancelled", "declined"].includes(err.code)) toast("Unduhan dibatalkan atau gagal."); }
    return;
  }
  if (ds.copyTpl) {
    const txt = tplPlain(TPL[ds.copyTpl]);
    try { await navigator.clipboard.writeText(txt); toast("Kerangka disalin ke papan klip."); } catch (err) { toast("Penyalinan diblokir; pilih teks kerangka secara manual."); }
    return;
  }
  if (t.id === "pickFiles") return $("#fileInput").click();
  if (ds.ai) return runAI(ds.ai);
  if (ds.saveUp) return saveDoc(ds.saveUp);
  if (ds.discard) { S.pending = S.pending.filter(x => x.pid !== ds.discard); return render(true); }
  if (ds.upToggle) { S.openUp = S.openUp === ds.upToggle ? null : ds.upToggle; return render(true); }
  if (ds.delUp) { S.confirmDel = ds.delUp; return render(true); }
  if (ds.delNo !== undefined) { S.confirmDel = null; return render(true); }
  if (ds.delYes) {
    const u = S.up[ds.delYes]; S.confirmDel = null;
    if (u && u.assetId && S.assets) { try { await S.assets.delete(u.assetId); } catch (err) { /* aset mungkin sudah terhapus */ } }
    await remove("up", ds.delYes); toast("Dokumen dihapus dari pustaka."); return;
  }
});
document.addEventListener("toggle", e => {
  const d = e.target; if (!d.matches || !d.matches("details.el")) return;
  d.open ? S.openEl.add(d.dataset.el) : S.openEl.delete(d.dataset.el);
}, true);
document.addEventListener("change", async e => {
  const t = e.target, ds = t.dataset;
  if (t.id === "submitDate" && t.value) { write("cfg", "main", { ...S.cfg, submit: t.value, ...stamp() }); return; }
  if (t.id === "elSt") { S.filters.elSt = t.value; return render(true); }
  if (t.id === "itCrit") { S.filters.itCrit = t.value; return render(true); }
  if (t.id === "itSt") { S.filters.itSt = t.value; return render(true); }
  if (t.id === "upCrit") { S.filters.upCrit = t.value; return render(true); }
  if (t.id === "fileInput") { handleFiles(t.files); t.value = ""; return; }
  if (t.id === "importJson" && t.files[0]) {
    try {
      const d = JSON.parse(await t.files[0].text());
      if (d.app !== "kesiapan-akreditasi-mkm") throw new Error("bukan berkas data dashboard ini");
      ["el", "ev", "ms", "up"].forEach(k => (S[k] = d[k] && typeof d[k] === "object" ? d[k] : {}));
      S.cfg = d.cfg && typeof d.cfg === "object" ? d.cfg : {};
      saveLocal(); render(true); toast("Data diimpor.");
    } catch (err) { toast("Impor gagal: " + (err.message || "berkas tidak valid")); }
    t.value = ""; return;
  }
  if (ds.elfield) return setEl(ds.id, { [ds.elfield]: t.value.trim() });
  if (ds.itfield) return setItem(ds.id, { [ds.itfield]: t.value.trim() });
  if (ds.msfield) return setMs(ds.id, { [ds.msfield]: t.value.trim() });
  if (ds.map) return toggleMap(ds.map, ds.kind, ds.id, t.checked);
  if (ds.keep) { const p = S.pending.find(x => x.pid === ds.keep); if (p) p.keepCopy = t.checked; return; }
  if (ds.uplink) { const f = findDoc(ds.uplink); if (!f) return; if (f.saved) write("up", ds.uplink, { ...f.doc, link: t.value.trim() }); else f.doc.link = t.value.trim(); return; }
});
let searchTimer = null;
document.addEventListener("input", e => {
  const t = e.target;
  const key = { elQ: "elQ", itQ: "itQ", upQ: "upQ" }[t.id];
  if (!key) return;
  S.filters[key] = t.value;
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    const pos = t.selectionStart; render(true);
    const n = document.getElementById(t.id); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (err) { /* abaikan */ } }
  }, 180);
});
document.addEventListener("focusout", () => { if (S.deferred) setTimeout(() => { if (!editingInView()) render(true); }, 0); });

/* ============================ mulai ============================ */
render(true);
(async () => {
  if (!window.claude || typeof window.claude.use !== "function") {
    // Versi mandiri (mis. GitHub Pages): penyimpanan lokal + unduhan langsung dari peramban
    S.mode = "local"; loadLocal(); S.downloads = browserSaver; render(true); return;
  }
  const use = n => window.claude.use(n).catch(() => null);
  const [db, user, sample, assets, downloads] = await Promise.all(["db", "user", "sample", "assets", "downloads"].map(use));
  S.user = user; S.sample = sample; S.assets = assets; S.downloads = downloads;
  if (user) {
    try { S.me = await user.id(); } catch (e) { /* tanpa id */ }
    try { const c = await user.can("data.write"); if (c === false) S.canWrite = false; } catch (e) { /* tidak diketahui */ }
  }
  if (db) {
    S.db = db; S.mode = "shared";
    ["el", "ev", "ms", "up"].forEach(coll => db.collection(coll).onSnapshot(snap => {
      const o = {}; snap.docs.forEach(d => (o[d.id] = d.data())); S[coll] = o;
      if (coll === "up") resolveNames();
      scheduleRender();
    }, err => { if (err && err.code === "revoked") { S.mode = "local"; S.canWrite = false; scheduleRender(); } }));
    db.doc("cfg/main").onSnapshot(d => { S.cfg = d.exists ? d.data() : {}; scheduleRender(); }, () => {});
  } else { S.mode = "local"; loadLocal(); }
  render(true);
})();

</script>
