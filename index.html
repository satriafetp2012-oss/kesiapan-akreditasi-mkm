<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Dashboard kesiapan akreditasi LAM-PTKes Unggul Prodi Magister Kesehatan Masyarakat">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Kesiapan Akreditasi MKM 2028</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: rail navigasi kiri (layar lebar) + kanvas kerja; di ponsel rail menjadi tab horizontal di atas.
   Identitas: tinta biru-petrol institusional, kode instrumen (1.1.1, C1-01, Tabel 1–38) dalam huruf mono. */
:root{
  --bg:#f4f6f9; --surface:#ffffff; --surface-2:#eef1f6; --surface-3:#e3e8f0;
  --ink:#152132; --ink-2:#43516a; --muted:#69768a; --line:#d9dfe8; --line-2:#c6cfdc;
  --accent:#1d4b9b; --accent-2:#2f63c2; --accent-ink:#ffffff; --accent-soft:#e2eafa;
  --ok:#0ca30c; --warn:#fab219; --bad:#d03b3b; --none:#bcc4d0;
  --ok-ink:#0b6e0b; --warn-ink:#7f5300; --bad-ink:#ad2828;
  --ok-soft:#e3f5e3; --warn-soft:#fdf2d8; --bad-soft:#fbe5e5;
  --shadow:0 1px 2px rgba(21,33,50,.06),0 4px 14px rgba(21,33,50,.05);
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e131a; --surface:#151c26; --surface-2:#1b2431; --surface-3:#243041;
  --ink:#e6ebf2; --ink-2:#b3bfce; --muted:#8996a8; --line:#283343; --line-2:#344257;
  --accent:#7ea7f0; --accent-2:#9bbcf5; --accent-ink:#0c1524; --accent-soft:#1b2a45;
  --none:#4a5568; --ok-ink:#62d162; --warn-ink:#f4c452; --bad-ink:#f28a8a;
  --ok-soft:#163018; --warn-soft:#352a10; --bad-soft:#3a1a1c;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0e131a; --surface:#151c26; --surface-2:#1b2431; --surface-3:#243041;
  --ink:#e6ebf2; --ink-2:#b3bfce; --muted:#8996a8; --line:#283343; --line-2:#344257;
  --accent:#7ea7f0; --accent-2:#9bbcf5; --accent-ink:#0c1524; --accent-soft:#1b2a45;
  --none:#4a5568; --ok-ink:#62d162; --warn-ink:#f4c452; --bad-ink:#f28a8a;
  --ok-soft:#163018; --warn-soft:#352a10; --bad-soft:#3a1a1c;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark; }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;margin:0}
h1,h2,h3,h4{margin:0;line-height:1.25;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.mono{font-family:var(--f-mono);font-size:.86em;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .ink2{color:var(--ink-2)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
#view{display:grid;gap:16px;min-width:0}
.rail{min-width:0;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto;background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:18px}
.brand{display:grid;gap:4px;padding:0 6px}
.brand .eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.brand b{font-size:17px;font-weight:800;letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--muted)}
.nav{display:grid;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:6px;color:var(--ink-2);font-weight:500;cursor:pointer}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.nav .k{font-family:var(--f-mono);font-size:11px;color:var(--muted);width:18px}
.nav button[aria-current="page"] .k{color:var(--accent)}
.nav .count{margin-left:auto;font-size:11px;color:var(--muted)}
.rail-foot{margin-top:auto;font-size:12px;color:var(--muted);display:grid;gap:6px;padding:0 6px}
.conn{display:inline-flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--none);display:inline-block;flex:none}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)}

.main{min-width:0;padding-block:20px 60px;padding-inline:28px;display:grid;gap:20px;align-content:start}
.topbar{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 24px;justify-content:space-between}
.topbar h1{font-size:24px;font-weight:800;letter-spacing:-.015em}
.topbar p{margin:4px 0 0;color:var(--ink-2);max-width:70ch}
.countdown{display:flex;align-items:baseline;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;box-shadow:var(--shadow)}
.countdown b{font-size:28px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.countdown small{color:var(--muted);display:block;font-size:12px}

/* fase strip */
.phasebar{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.phase{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:12px;min-width:0}
.phase b{display:block;font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phase span{color:var(--muted);font-variant-numeric:tabular-nums}
.phase .bar{height:4px;border-radius:2px;background:var(--surface-3);margin-top:6px;overflow:hidden}
.phase .bar i{display:block;height:100%;background:var(--accent)}
.phase.now{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.phase.done{opacity:.72}

/* ---------- components ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.panel h2{font-size:16px;font-weight:800}
.panel h3{font-size:14px;font-weight:700}
.panel-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;margin-bottom:12px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.lbl{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line-2);border-radius:999px;padding:1px 8px;font-size:12px;background:var(--surface);white-space:nowrap;color:var(--ink-2)}
button.chip{cursor:pointer} button.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.code{font-family:var(--f-mono);font-size:11px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:4px;padding:2px 8px;font-size:12px;font-weight:700;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.pill.ok{background:var(--ok-soft);color:var(--ok-ink)} .pill.warn{background:var(--warn-soft);color:var(--warn-ink)}
.pill.bad{background:var(--bad-soft);color:var(--bad-ink)} .pill.none{background:var(--surface-2);color:var(--muted)}
.pill.info{background:var(--accent-soft);color:var(--accent)}
.tag-crit{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:3px;padding:1px 5px}
.tag-crit.k{background:var(--bad-soft);color:var(--bad-ink)} .tag-crit.f{background:var(--surface-2);color:var(--ink-2)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);border-radius:6px;padding:6px 12px;font-weight:600;font-size:13px;cursor:pointer;color:var(--ink)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-2);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:none}
.btn.danger{color:var(--bad-ink)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:3px 8px;font-size:12px}
input[type=text],input[type=date],input[type=url],input[type=search],select,textarea{border:1px solid var(--line-2);background:var(--surface);border-radius:6px;padding:5px 8px;min-width:0;max-width:100%}
textarea{width:100%;resize:vertical;min-height:54px}
input:disabled,select:disabled,textarea:disabled{opacity:.65}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar input[type=search]{flex:1 1 200px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:6px;overflow:hidden;flex:none}
.seg button{border:0;background:var(--surface);padding:4px 9px;font-size:12px;font-weight:700;cursor:pointer;color:var(--muted);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"].M{background:var(--ok-soft);color:var(--ok-ink)}
.seg button[aria-pressed="true"].MS{background:var(--warn-soft);color:var(--warn-ink)}
.seg button[aria-pressed="true"].TM{background:var(--bad-soft);color:var(--bad-ink)}
.seg button[aria-pressed="true"].X{background:var(--surface-3);color:var(--ink)}
.subtabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px}
.subtabs button{border:0;background:none;padding:8px 12px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.subtabs button[aria-pressed="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.empty{border:1px dashed var(--line-2);border-radius:var(--r);padding:20px;text-align:center;color:var(--muted)}
.note{border-left:3px solid var(--accent);background:var(--accent-soft);padding:10px 12px;border-radius:0 6px 6px 0;font-size:13px;color:var(--ink-2)}
.note.warn{border-color:var(--warn);background:var(--warn-soft)}
details>summary{cursor:pointer;list-style:none}
details>summary::-webkit-details-marker{display:none}
.caret{display:inline-block;transition:transform .15s;color:var(--muted)}
details[open] .caret{transform:rotate(90deg)}

/* meters & bars */
.meter{display:grid;gap:6px}
.meter .v{font-size:26px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.meter .track{height:8px;border-radius:4px;background:var(--surface-3);overflow:hidden}
.meter .track i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.stack{display:flex;height:12px;border-radius:4px;overflow:hidden;background:var(--surface-3);gap:2px}
.stack i{display:block;height:100%}
.stack i.M{background:var(--ok)} .stack i.MS{background:var(--warn)} .stack i.TM{background:var(--bad)} .stack i.X{background:var(--none)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--surface-2);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr:last-child td{border-bottom:0}
table.t tr.row-click{cursor:pointer} table.t tr.row-click:hover td{background:var(--surface-2)}

/* kriteria */
.krit-layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;align-items:start}
.klist{display:grid;gap:6px;position:sticky;top:12px}
.kbtn{display:grid;gap:6px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 12px;cursor:pointer}
.kbtn:hover{border-color:var(--line-2)}
.kbtn[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.kbtn .top{display:flex;gap:8px;align-items:baseline}
.kbtn .top b{font-family:var(--f-mono);font-size:12px;color:var(--accent)}
.kbtn .top span{font-weight:600;font-size:13px}
.kbtn small{color:var(--muted);font-size:11px}
.sub{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.sub-head{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:12px 14px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.sub-head h3{font-size:15px;font-weight:700}
.sub-head .id{font-family:var(--f-mono);font-weight:600;color:var(--accent)}
.sub-body{padding:12px 14px;display:grid;gap:10px}
.el{border:1px solid var(--line);border-radius:6px}
.el>summary{display:grid;grid-template-columns:auto 52px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 10px}
.el>summary .id{font-family:var(--f-mono);font-size:12px;color:var(--ink-2)}
.el>summary .q{font-weight:500}
.el .stripe{width:4px;align-self:stretch;border-radius:2px;background:var(--none)}
.el .stripe.M{background:var(--ok)} .el .stripe.MS{background:var(--warn)} .el .stripe.TM{background:var(--bad)}
.el-body{padding:4px 12px 14px 26px;display:grid;gap:12px;border-top:1px dashed var(--line)}
.el-body ul{margin:4px 0 0;padding-left:18px}
.el-body li{margin:2px 0}
.field-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.field{display:grid;gap:4px;min-width:0}

/* daftar */
.item{display:grid;grid-template-columns:72px minmax(0,1fr) 150px;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:start}
.item:last-child{border-bottom:0}
.item .code{font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--accent)}
.item .title{font-weight:600}
.item .meta{font-size:12px;color:var(--muted);margin-top:2px}
.item .ctrl{display:grid;gap:6px;justify-items:stretch}
.item .more{grid-column:2/4;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.st-belum{border-left:3px solid var(--none)} .st-proses{border-left:3px solid var(--warn)} .st-ada{border-left:3px solid var(--accent)} .st-valid{border-left:3px solid var(--ok)} .st-na{border-left:3px solid transparent;opacity:.62}

/* contoh */
.tpl-layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}
.tpl-list{display:grid;gap:2px;max-height:78vh;overflow:auto;position:sticky;top:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px}
.tpl-list .grp{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:10px 8px 4px}
.tpl-list button{display:grid;grid-template-columns:52px minmax(0,1fr);gap:6px;text-align:left;border:0;background:none;padding:6px 8px;border-radius:5px;cursor:pointer;font-size:12.5px;color:var(--ink-2)}
.tpl-list button:hover{background:var(--surface-2)}
.tpl-list button[aria-current="true"]{background:var(--accent-soft);color:var(--ink)}
.tpl-list button .mono{color:var(--accent)}
.doc-sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px 28px;display:grid;gap:16px;min-width:0}
.doc-sheet h2{font-size:20px;font-weight:800}
.doc-meta{display:grid;grid-template-columns:150px minmax(0,1fr);gap:6px 14px;font-size:13px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 0}
.doc-meta dt{color:var(--muted);font-weight:600}
.doc-meta dd{margin:0}
.doc-sheet>*{min-width:0}
.tpl-body{font-size:13px;overflow-x:auto;max-width:100%}
.tpl-body h3{font-size:14px;font-weight:700;margin:18px 0 8px;color:var(--accent)}
.tpl-body table{border-collapse:collapse;width:100%;margin:6px 0 10px;font-size:12.5px}
.tpl-body td,.tpl-body th{border:1px solid var(--line-2);padding:5px 8px;vertical-align:top;text-align:left}
.tpl-body th{background:var(--surface-2)}
.tpl-body p{margin:6px 0}
.tpl-body strong{font-weight:700}
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.cols3 ul{margin:6px 0 0;padding-left:18px;font-size:13px}
.cols3 li{margin:3px 0}

/* unggah */
.drop{border:2px dashed var(--line-2);border-radius:var(--r);padding:26px;text-align:center;background:var(--surface);display:grid;gap:8px;justify-items:center;transition:border-color .15s,background .15s}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop b{font-size:16px}
.ucard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;min-width:0}
.ucard-head{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.ucard-head b{font-size:15px;word-break:break-word}
.maprow{display:grid;grid-template-columns:auto 70px minmax(0,1fr) 90px;gap:8px;align-items:center;font-size:13px;padding:3px 0}
.maprow .mono{color:var(--accent)}
.score{height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.score i{display:block;height:100%;background:var(--accent)}
.excerpt{font-size:12px;color:var(--ink-2);background:var(--surface-2);border-radius:6px;padding:10px;max-height:160px;overflow:auto;white-space:pre-wrap;word-break:break-word}
.ai{border:1px solid var(--accent-soft);background:linear-gradient(0deg,var(--surface),var(--surface)) padding-box;border-radius:6px;padding:12px;display:grid;gap:8px}
.ai h4{font-size:13px;font-weight:700;color:var(--accent)}
.heat{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:3px}
.heat .c{aspect-ratio:1.4;border-radius:3px;display:grid;place-items:center;font-size:10px;font-family:var(--f-mono);border:1px solid var(--line);max-width:100%}
.progress{height:4px;background:var(--surface-3);border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;width:40%;background:var(--accent);animation:slide 1.1s infinite ease-in-out}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
@media (prefers-reduced-motion:reduce){.progress i{animation:none;width:100%}}

/* linimasa */
.gantt{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.gantt-in{min-width:820px;position:relative;padding:10px 12px 30px}
.g-months{display:grid;font-size:10.5px;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:4px}
.g-months span{text-align:center;white-space:nowrap}
.g-row{position:relative;height:30px;margin-top:6px}
.g-bar{position:absolute;top:4px;height:22px;border-radius:4px;background:var(--accent-soft);border:1px solid var(--accent);color:var(--ink);font-size:11.5px;font-weight:600;padding:2px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-bar.post{background:var(--surface-2);border-style:dashed;border-color:var(--line-2)}
.g-ms{position:absolute;top:0;height:100%;}
.g-line{position:absolute;top:0;bottom:0;width:0;border-left:2px solid var(--bad)}
.g-line.sub{border-left:2px dashed var(--accent)}
.g-line span{position:absolute;bottom:-20px;left:4px;font-size:10px;font-weight:700;white-space:nowrap;background:var(--surface);padding:0 3px}
.dia{position:absolute;width:10px;height:10px;transform:translate(-5px,10px) rotate(45deg);background:var(--accent);border:2px solid var(--surface)}
.dia.done{background:var(--ok)} .dia.late{background:var(--bad)}

/* toast & modal */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:6px;font-size:13px;z-index:50;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--bad-soft);border-radius:6px;padding:8px 10px;font-size:13px}

/* bars chart */
.vbars{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px;align-items:end;height:130px;padding-top:16px;border-bottom:1px solid var(--line-2)}
.vbars .b{position:relative;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}
.vbars .b span{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:10.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.vbars .b.partial{background:repeating-linear-gradient(135deg,var(--accent) 0 3px,var(--accent-soft) 3px 6px)}
.vlabels{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px;font-size:10.5px;color:var(--muted);text-align:center;margin-top:4px}

@media (max-width:1100px){ .g4{grid-template-columns:repeat(2,minmax(0,1fr))} .cols3{grid-template-columns:1fr} }
@media (max-width:960px){
  .app{grid-template-columns:minmax(0,1fr)}
  .krit-layout,.tpl-layout{grid-template-columns:minmax(0,1fr)!important}
  #view{display:grid;gap:16px;min-width:0}
.rail{min-width:0;position:sticky;top:env(safe-area-inset-top,0px);height:auto;z-index:20;flex-direction:row;align-items:center;padding:8px 16px;gap:12px;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}
  .brand,.rail-foot{display:none}
  .nav{display:flex;gap:4px}
  .nav button{white-space:nowrap;padding:7px 10px}
  .nav .count,.nav .k{display:none}
  .main{padding-inline:16px}
  .klist{position:static;grid-template-columns:repeat(2,minmax(0,1fr))}
  .tpl-list{position:static;max-height:300px}
  .phasebar{grid-template-columns:repeat(3,minmax(0,1fr))}
  .g2,.g3{grid-template-columns:1fr}
}
@media (max-width:560px){
  .phasebar{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g4{grid-template-columns:1fr 1fr}
  .item{grid-template-columns:1fr}
  .item .more{grid-column:auto;grid-template-columns:1fr}
  .field-row{grid-template-columns:1fr}
  .el>summary{grid-template-columns:auto 44px minmax(0,1fr)}
  .el>summary .pillwrap{grid-column:2/4}
  .maprow{grid-template-columns:auto 60px minmax(0,1fr)}
  .maprow .score{grid-column:2/4}
  .doc-sheet{padding:16px}
  .doc-meta{grid-template-columns:1fr}
  .heat{grid-template-columns:repeat(7,minmax(0,1fr))}
  .topbar h1{font-size:20px}
}

<script type="application/json" id="catalog">{"crit":[["K1","Visi, Misi, Tujuan, dan Strategi"],["K2","Kurikulum"],["K3","Penilaian"],["K4","Mahasiswa"],["K5","Dosen, Tendik, Penelitian, dan PkM"],["K6","Sarana, Prasarana Pendidikan, dan Keuangan"],["K7","Penjaminan Mutu"],["K8","Tata Kelola dan Administrasi"]],"subs":[{"id":"1.1","crit":"K1","name":"Pernyataan Visi, Misi, Tujuan, dan Strategi","flex":false,"guide":"Program Studi menyatakan secara terbuka mengenai visi, misi, tujuan, strategi dan unggulan (visi keilmuan). Jelaskan secara singkat dan ringkas tujuan dari program studi, nilai-nilai, tujuan pendidikan, peranan penelitian, dan kaitannya dengan layanan kesehatan masyarakat. Tunjukkan sejauh mana pernyataan tersebut telah disusun dengan melibatkan para pemangku kepentingan. Jelaskan bagaimana pernyataan misi mendasari penyusunan kurikulum dan penjaminan mutu."},{"id":"2.1","crit":"K2","name":"Capaian Pembelajaran dalam Kurikulum","flex":false,"guide":"Program studi telah menetapkan capaian pembelajaran lulusan, serta capaian pembelajaran yang diharapkan untuk setiap mata kuliah. Capaian pembelajaran lulusan perlu mengandung unsur sikap dan tata nilai; keterampilan umum, keterampilan khusus dan penguasaan pengetahuan untuk menjadi tenaga kesehatan masyarakat. Pertimbangkan apakah capaian pembela jaran lulusan yang ditetapkan sejalan dengan visi, misi dan unggulan program studi. Capaian pembelajaran lulusan perlu dievaluasi dan dipetakan kesesuaiannya dengan standar dan peraturan nasional atau pemerintah, dan kebutuhan dari pengguna lulusan. Analisis kesesuaian capaian pembelajaran tertentu terkait dengan sikap dan tata nilai; keterampilan umum, keterampilan khusus dan penguasaan pengetahuan pada setiap mata kuliah. Capaian pembelajaran lulusan pada kurikulum dapat dinyatakan sedemikian rupa sehingg a dapat digunakan sebagai panduan dalam penilaian/asesmen. Capaian pembelajaran lulusan tersebut juga dibutuhkan dalam merancang dan menyampaikan bahan kajian, penilaian pembelajaran, dan evaluasi mata kuliah."},{"id":"2.2","crit":"K2","name":"Struktur Kurikulum","flex":false,"guide":"Program studi memiliki dokumentasi lengkap mengenai struktur kurikulum, yang meliputi prinsip yang mendasari model kurikulum yang dipilih dan hubungan antar bidang ilmu kesehatan masyarakat. Standar ini mengacu pada bagaimana konten (sikap, pengetahuan dan keterampilan), bidang ilmu kesehatan masyarakat, dan pengalaman belajar yang diatur dalam kurikulum. Terdapat banyak pilihan dan variasi dari berbagai model terintegrasi. Pilihan desain kurikulum tersebut, seyogyanya terkait dengan visi, misi, tujuan, strategi dan unggulan, capaian pembelajaran, sumber daya, dan konteks dari program studi."},{"id":"2.3","crit":"K2","name":"Isi Kurikulum","flex":false,"guide":"a. Program studi memasukkan bahan kajian yang diperlukan untuk mempersiapkan mahasiswa menjadi tenaga kesehatan masyarakat yang kompeten dan untuk pendidikan tahap selanjutnya. b. Isi kurikulum setidaknya memuat delapan bidang utama: administrasi kebijakan kesehatan, biostatistik, epidemiologi, gizi kesehatan masyarakat, kesehatan kerja, kesehatan lingkungan, kesehatan reproduksi, dan pendidikan kesehatan dan ilmu perilaku/promosi kesehatan. Isi kurikulum di semua bidang harus memadai untuk memungkinkan mahasiswa mencapai capaian pembelajaran dari kurikulum dan berlanjut ke tahap pendidikan selanjutnya. Isi kurikulum dapat bervariasi menurut unggulan program studi dan konteks kewilayahan, mencakup setidaknya delapan bidang utama: administrasi kebijakan kesehatan, biostatistik, epidemiologi, gizi kesehatan masyarakat, kesehatan kerja, kesehatan lingkungan, kesehatan reproduksi, dan pendidikan kesehatan dan ilmu perilaku/promosi kesehatan sesua i konteks, kearifan lokal, profesionalisme dan etika. Isi lainnya dari kurikulum: metodologi penelitian kesehatan masyarakat, humaniora, seni, dan digital kesehatan masyarakat (digital public health)."},{"id":"2.4","crit":"K2","name":"Metode dan Pengalaman Pembelajaran","flex":false,"guide":"Program Studi menerapkan serangkaian metode dan pengalaman pembelajaran untuk memastikan bahwa mahasiswa mencapai hasil yang diharapkan dari kurikulum. Metode dan pengalaman pembelajaran mencakup teknik belajar mengajar yang dirancang untuk memberikan capa ian pembelajaran yang ditetapkan, dan untuk mendukung mahasiswa dalam pembelajaran mereka sendiri. Pengalaman tersebut mungkin bersifat formal atau informal, berbasis kelompok atau individu, dan dilaksanakan di dalam program studi, di lahan praktik (pemuki man, puskesmas, rumah sakit, tempat kerja/industri, tempat rekreasi, tempat dan fasilitas umum). Pilihan pengalaman pembelajaran akan ditentukan dalam kurikulum dan keunggulan dalam pembelajaran, sumber daya manusia, serta sarana dan prasarana yang tersedi a. Metode pembelajaran virtual yang dirancang, digunakan, dan didukung dengan baik (digital, jarak jauh, terdistribusi, atau e-learning) dapat dilaksanakan."},{"id":"3.1","crit":"K3","name":"Kebijakan dan Sistem Penilaian","flex":false,"guide":"Kebijakan penilaian dengan sistem terpusat yang memandu dan mendukung implementasinya akan memerlukan penggunaan berbagai metode formatif dan sumatif yang mengarah pada perolehan pengetahuan, keterampilan kesehatan masyarakat, dan perilaku yang diperlukan untuk menjadi tenaga kesehatan masyarakat. Kebijakan dan sistem harus responsif terhadap misi UPPS/PS, hasil pendidikan tertentu, sumber daya yang tersedia, dan konteksnya."},{"id":"3.2","crit":"K3","name":"Penilaian dalam Mendukung Pembelajaran","flex":true,"guide":"a) UPPS/PS mempunyai sistem penilaian teratur, memberikan umpan balik yang dapat ditindaklanjuti kepada mahasiswa dengan mengidentifikasi kekuatan, kelemahan, dan membantu mengkonsolidasikan pembelajaran mereka. b) Penilaian formatif ini terkait dengan intervensi pendidikan yang memastikan bahwa semua mahasiswa mempunyai kesempatan untuk mencapai potensi mereka. Umpan balik merupakan salah satu pendorong terbesar dalam pencapaian pendidikan. Mahasiswa perlu dinilai sejak dini dan secara teratur dalam pembelajaran dan praktik kerja lapangan kesehatan masyarakat untuk memberikan umpan balik yang memandu pembelajaran mereka. Hal ini mencakup identifikasi awal mahasiswa yang memiliki performa kurang baik dan kesempatan untuk memperbaiki hal tersebut."},{"id":"3.3","crit":"K3","name":"Penilaian untuk Mendukung Pengambilan Keputusan","flex":false,"guide":"a) UPPS/PS mempunyai sistem penilaian yang menginformasikan keputusan mengenai kemajuan dan kelulusan. b) Penilaian sumatif sesuai untuk mengukur hasil capaian pembelajaran. c) Penilaian dirancang dengan baik, menghasilkan skor/nilai yang valid dan reliabel Penilaian dalam pengambilan keputusan sangat penting untuk akuntabilitas institusi. Penilaian harus adil bagi mahasiswa dan kelompok, harus membuktikan seluruh aspek kompetensi. Untuk mencapai tujuan ini, mereka harus memenuhi standar kualitas."},{"id":"3.4","crit":"K3","name":"Penjaminan Mutu Penilaian","flex":false,"guide":"a) Mempunyai mekanisme untuk menjamin mutu penilaian. b) Data penilaian digunakan untuk perbaikan dan peningkatan kinerja dosen, pembimbing lapangan, mata kuliah, PS dan UPPS. UPPS perlu meninjau penilaian individu secara teratur dan keseluruhan sistem penilaian serta umpan balik dari pemangku kepentingan, untuk peningkatan kualitas penilaian, sistem penilaian, mata kuliah secara berkelanjutan."},{"id":"4.1","crit":"K4","name":"Kebijakan Seleksi dan Penerimaan Mahasiswa Baru","flex":false,"guide":"Unit Pengelola Program Studi memiliki kebijakan khusus yang dapat diakses oleh seluruh mahasiswa yang menjelaskan tujuan, prinsip, kriteria, dan proses seleksi dan penerimaan Maba. Apabila prosedur seleksi dan penerimaan Maba diatur oleh kebijakan nasional, sebaiknya jelaskan bagaimana peraturan tersebut diterapkan secara lokal. Jika Institusi memiliki kebijakan dan proses seleksi dan penerimaan Maba tersendiri, jelaskan hubungan antara kebijakan dan proses seleksi dan penerimaan Maba dengan rumusan misi, ketentuan peraturan yang berlaku, dan kearifan lokal. Isu- isu penerimaan Maba berikut ini penting dalam mengembangkan kebijakan: keterkaitan antara jumlah mahasiswa yang diterima (termasuk mahasiswa internasional) dengan sumber daya, kapasitas, dan infrastr uktur yang tersedia untuk menyelenggarakan pendidikan yang layak bagi calon Maba; isu-isu tentang kesetaraan dan keanekaragaman; kebijakan tentang penerimaan mahasiswa yang mengalami keterlambatan, dan penerimaan mahasiswa transfer dari institusi atau program studi lain. Dalam proses seleksi, perhatikan hal-hal berikut ini: persyaratan untuk seleksi, tahapan dalam proses seleksi; mekanisme untuk mengajukan permohonan; dan mekanisme menerima pengaduan."},{"id":"4.2","crit":"K4","name":"Konseling dan Dukungan Mahasiswa","flex":true,"guide":"UPPS menyediakan layanan dukungan akademik, sosial, psikologis, dan finansial serta bimbingan karir kepada mahasiswa yang dapat diakses dan bersifat rahasia. Mahasiswa memerlukan dukungan dalam mengembangkan keterampilan akademik, mengelola disabilitas, kesehatan fisik dan mental serta kesejahteraan pribadi, mengelola keuangan, dan perencanaan karir. Pertimbangkan layanan dukungan darurat apa yang tersedia jika terjadi trauma atau krisis pribadi. Tentukan proses untuk mengidentifikasi mahasiswa yang membutuhkan konseling dan dukungan akademik atau pribadi. Pertimbangkan bagaimana layanan tersebut akan disosialisasikan, ditawarkan, dan diakses secara rahasia serta bagaimana mengembangkan layanan dukungan dengan berkonsultasi bersama perwakilan mahasiswa."},{"id":"4.3","crit":"K4","name":"Lingkungan Kerja dan Belajar Mahasiswa","flex":true,"guide":"Menyadari bahwa keberhasilan pembelajaran didapat melalui lingkungan belajar yang nyaman, maka mahasiswa harus memiliki lingkungan kerja yang aman dan nyaman untuk belajar. Perlu keseimbangan antara tanggung jawab dan komitmen pendidikan dan praktik lapang an, dengan pengaturan pengawasan lingkungan kerja dan belajar mahasiswa yang memadai, aman, nyaman, tepat, dan waktu pembelajaran, termasuk persiapan dan pelaksanaan ujian. Institusi Pendidikan perlu menerapkan sistem peningkatan kualitas untuk mengatasi m asalah keselamatan fisik dan psikologis mahasiswa di lingkungan pendidikan, dengan menerapkan lingkungan ‘kampus sehat’, termasuk bebas dari kekerasan seksual, perundungan, dan intoleransi."},{"id":"4.4","crit":"K4","name":"Keselamatan Mahasiswa","flex":false,"guide":"Institusi Pendidikan harus memperjelas upaya perlindungan dan keselamatan mahasiswa dalam proses belajar mengajar dan menerapkan sistem peningkatan kualitas untuk mengatasi masalah keselamatan fisik dan psikologis mahasiswa di lingkungan pendidikan."},{"id":"5.1","crit":"K5","name":"Kebijakan Penetapan Dosen","flex":false,"guide":"Institusi memiliki jumlah dan jenis dosen yang memenuhi syarat yang diperlukan untuk menerapkan kurikulum program studi, dengan mempertimbangkan jumlah mahasiswa dan model pembelajaran. Penentuan kebijakan penetapan dosen mencakup pertimbangan: jumlah dan kualifikas i dosen yang diperlukan untuk menyampaikan kurikulum yang direncanakan kepada mahasiswa yang dituju; distribusi dosen berdasarkan kualifikasi (tingkat pendidikan, jabatan fungsional dan kompetensi) dan pengalaman."},{"id":"5.2","crit":"K5","name":"Kinerja dan Perilaku Dosen","flex":false,"guide":"Institusi menetapkan dan mengkomunikasikan harapannya terhadap kinerja dan perilaku dosen. Pernyataan yang jelas yang menggambarkan tanggung jawab dosen untuk pembelajaran dan kode etik perilaku dosen."},{"id":"5.3","crit":"K5","name":"Pengembangan Profesional Berkelanjutan untuk Dosen","flex":true,"guide":"Institusi menerapkan kebijakan pengembangan profesional berkelanjutan untuk dosen. Mengembangkan dan mempublikasikan secara jelas tentang bagaimana Institusi mendukung dan mengelola pengembangan akademik dan profesional setiap dosen."},{"id":"5.4","crit":"K5","name":"Pengembangan Tenaga Kependidikan","flex":true,"guide":"Tenaga kependidikan (laboran/operator/teknisi/analis, pustakawan, administrasi, operator IT) mendukung kegiatan tridharma perguruan tinggi. UPPS/PS menyediakan tenaga kependidikan yang profesional dan memenuhi kecukupan jumlah dan kualifikasi. UPPS/PS menjamin pula pengembangan tenaga kependidikan."},{"id":"5.5","crit":"K5","name":"Relevansi Penelitian sesuai Visi dan Unggulan PS","flex":false,"guide":"Institusi memiliki roadmap penelitian yang menjadi rujukan kegiatan penelitian dosen dan mahasiswa untuk memastikan relevansi serta kesesuaian dengan visi dan unggulan program studi. Hasil penelitian dosen dan mahasiswa diintegrasikan dalam kegiatan pembelajaran dan mendapatkan penghargaan atau pengakuan atas hasil penelitian dalam bentuk Hibah penelitian, HaKi, dan Paten."},{"id":"5.6","crit":"K5","name":"Relevansi PkM sesuai Visi dan Unggulan PS","flex":false,"guide":"Institusi memiliki roadmap PkM yang menjadi rujukan kegiatan PkM dosen dan mahasiswa untuk memastikan relevansi serta kesesuaian dengan visi dan unggulan program studi. Hasil PkM dosen dan mahasiswa diintegrasikan dalam kegiatan pembelajaran dan mendapatkan penghargaan atau pengakuan dalam bentuk Hibah PkM, HaKi, dan Paten. Hasil PkM berkontribusi terhadapat kesejahteraan masyarakat dan ilmu pengetahuan."},{"id":"6.1","crit":"K6","name":"Fasilitas Fisik untuk Pendidikan dan Pelatihan","flex":false,"guide":"UPPS/PS memiliki fasilitas fisik untuk pendidikan dan pelatihan yang memadai untuk memastikan kurikulum disampaikan secara memadai. Fasilitas fisik mencakup sarana dan prasarana yang tersedia untuk melaksanakan kurikulum, disesuaikan dengan jumlah mahasiswa dan dosen."},{"id":"6.2","crit":"K6","name":"Sumber Informasi","flex":true,"guide":"Program studi menyediakan akses yang memadai terhadap sumber informasi cetak dan elektronik untuk mendukung misi dan kurikulum program studi. Pertimbangkan penyediaan akses program studi terhadap sumber informasi bagi mahasiswa, dosen, dan pembimbing praktikum kesehatan masyarakat, termasuk sumber daya perpustakaan online dan fisik. Evaluasi fasilitas tersebut dalam kaitannya dengan misi dan kur ikulum program studi dalam pembelajaran dan penelitian."},{"id":"6.3","crit":"K6","name":"Sumber Daya Keuangan","flex":true,"guide":"Sumber daya keuangan yang berkelanjutan, cukup untuk memastikan pemenuhan capaian pembelajaran lulusan di akhir program, dan sepadan dengan sumber daya organisasi yang mengelola."},{"id":"7.1","crit":"K7","name":"Sistem Penjaminan Mutu","flex":false,"guide":"Program studi menerapkan sistem penjaminan mutu yang mencakup komponen pendidikan, penelitian, pengabdian kepada masyarakat dan administrasi. Mempertimbangkan tujuan, peran, desain, dan pengelolaan sistem penjaminan mutu, termasuk apa yang dianggap sebagai mutu yang sesuai dalam perencanaan dan praktik pelaksanaannya. Merancang dan menerapkan struktur dan proses pengambilan ke putusan dan manajemen perubahan, sebagai bagian dari penjaminan mutu. Menyiapkan dokumen tertulis yang menjelaskan sistem penjaminan mutu."},{"id":"8.1","crit":"K8","name":"Tata Kelola","flex":false,"guide":"UPPS/PS memiliki struktur tata kelola yang jelas terkait dengan pengajaran, pembelajaran, penelitian, dan alokasi sumber daya, yang transparan dan dapat diakses oleh semua pemangku kepentingan, selaras dengan visi, misi dan tujuan institusi untuk memastika n stabilitas perguruan tinggi. Jelaskan model kepemimpinan dan sistem pengambilan keputusan institusi, serta struktur organisasinya, termasuk keanggotaan, tugas pokok dan fungsi, tanggung jawab, serta mekanisme pelaporannya. Pastikan bahwa program studi memiliki prosedur manajemen risiko."},{"id":"8.2","crit":"K8","name":"Keterlibatan Mahasiswa dan Dosen dalam Tata Kelola","flex":true,"guide":"UPPS/PS memiliki kebijakan dan prosedur untuk melibatkan atau berkonsultasi dengan mahasiswa dan dosen dalam aspek-aspek utama manajemen institusi dan kegiatan serta proses pendidikan. Pertimbangkan bagaimana mahasiswa dan dosen dapat berpartisipasi dalam perencanaan, pelaksanaan, penilaian mahasiswa, dan kegiatan evaluasi kualitas institusi, atau memberikan komentar terhadap kegiatan tersebut. Tentukan mekanisme untuk mengatur keterlibatan mahasiswa dan dosen dalam tata kelola dan administrasi."},{"id":"8.3","crit":"K8","name":"Administrasi","flex":true,"guide":"UPPS/PS memiliki dukungan administrasi yang tepat dan memadai untuk mencapai tujuan dalam pembelajaran, penelitian, dan pengabdian kepada masyarakat. Mengembangkan kebijakan dan proses peninjauan untuk memastikan dukungan staf administrasi, dan anggaran yang memadai dan efisien untuk semua kegiatan dan operasional institusi."}],"elements":[{"id":"1.1.1","sub":"1.1","crit":"K1","cat":"KRITIS","q":"Bagaimana rumusan VMTS dan unggulan PS ditetapkan?","check":["Ada mekanisme perumusan VMTS & unggulan","Mempertimbangkan masalah kesehatan lokal, regional, nasional","Menggunakan pendekatan ilmiah","Keterkaitan VMTS UPPS dengan VMTS PS"],"src":"Pimpinan UPPS, Kaprodi, dosen, mitra/dinkes"},{"id":"1.1.2","sub":"1.1","crit":"K1","cat":"KRITIS","q":"Bagaimana VMTS disesuaikan dengan renstra, penjaminan mutu, dan manajemen PS?","check":["VMTS diterjemahkan ke program & aktivitas (perencanaan)","Monev capaian VMTS dan tindak lanjut perbaikan"],"src":"Pimpinan UPPS, Kaprodi, dosen, mitra/dinkes"},{"id":"1.1.3","sub":"1.1","crit":"K1","cat":"KRITIS","q":"Bagaimana pemangku kepentingan terlibat dalam penyusunan VMTS?","check":["Mekanisme identifikasi keterlibatan stakeholder internal & eksternal","Kontribusi stakeholder dan manfaat yang didapat terdokumentasi"],"src":"Pimpinan UPPS, Kaprodi, dosen, mitra/dinkes"},{"id":"1.1.4","sub":"1.1","crit":"K1","cat":"KRITIS","q":"Bagaimana VMTS menentukan peran PS di masyarakat?","check":["VMTS diarahkan memecahkan masalah kesmas wilayah melalui kerja sama fasyankes, pemda, kelompok masyarakat"],"src":"Pimpinan UPPS, Kaprodi, dosen, mitra/dinkes"},{"id":"1.1.5","sub":"1.1","crit":"K1","c elitian, PkM","tpl":"Template Kerangka SOP Pelaporan Administratif Pembelajaran, Penelitian, dan PkM","elements":["8.3.3","8.1.2"],"by":"SOP universitas/fakultas ditetapkan pimpinan (bagian akademik, LPPM, perencanaan); penjabaran prodi disusun Kaprodi dan Ketua Tim PM; laporan disusun koordinator bidang.","when":"Laporan kegiatan tridharma setiap akhir semester; laporan kinerja prodi tahunan setiap Desember (SOP-PM-14); pelaporan PD Dikti sesuai jadwal universitas."},{"id":"C8-10","crit":"K8","doc":"Dokumen indikator kinerja utama dan tambahan","tpl":"Template Dokumen Penetapan Indikator Kinerja Utama (IKU) dan Indikator Kinerja Tambahan (IKT) Program Studi","elements":["8.1.4","7.1.1"],"by":"Disusun Ketua Tim PM dan Kaprodi (P02); baseline diisi operator data; disahkan Pimpinan UPPS melalui RTM.","when":"Baseline diukur pada Semester Ganjil 2026/2027 (target 30 November 2026); target ditetapkan dalam RTM; review IKU/IKT setiap November."}],"templates":{"C1-01":{"id":"C1-01","title":"Template Notulen Lokakarya Perumusan dan Review VMTS serta Unggulan Program Studi","elements":["1.1.1","1.1.3","1.1.4","1.1.5"],"related":"P11, P02, SOP-PM-14, F-PM-01, F-PM-02, INS-SVY-07, STD-MKM-01, C1-02, C1-04","by":"Sekretaris Tim PM sebagai notulis; diperiksa Ketua Tim PM; ditandatangani Kaprodi sebagai pimpinan rapat dan diketahui Pimpinan UPPS.","when":"Lokakarya review VMTS setiap Januari (P11) dan perumusan penuh setiap 4–5 tahun; notulen final didistribusikan ≤ 5 hari kerja setelah lokakarya.","purpose":"Membuktikan bahwa VMTS dan unggulan PS dirumuskan melalui mekanisme yang jelas dan pendekatan ilmiah, diturunkan dari VMTS UPPS dan universitas, mempertimbangkan masalah kesehatan lokal, regional, dan nasional, melibatkan pemangku kepentingan internal dan eksternal, serta memuat peran PS dalam meningkatkan derajat kesehatan masyarakat.","assessor":["Mekanisme perumusan VMTS tertulis dan dijalankan, termasuk metode ilmiah yang digunakan (analisis data, SWOT, FGD, benchmark).","Keterkaitan eksplisit antara VMTS universitas, VMTS UPPS, dan VMTS PS.","Data masalah kesehatan lokal, regional, dan nasional yang benar-benar dibahas dan memengaruhi rumusan.","Kehadiran dan kontribusi nyata pemangku kepentingan internal dan eksternal beserta manfaat yang mereka peroleh.","Rumusan peran PS di masyarakat melalui kerja sama dengan fasyankes, pemerintah daerah, dan kelompok masyarakat.","Keputusan yang ditindaklanjuti dengan pengesahan, publikasi, dan penerjemahan ke Renop."],"tips":["Lampirkan bahan rapat (paparan data, matriks keselarasan) sebagai bagian notulen; asesor menilai proses, bukan hanya rumusan akhir.","Catat masukan per unsur pemangku kepentingan dan nyatakan apakah diakomodasi; hindari notulen yang hanya berisi daftar keputusan.","Jangan menulis notulen setelah dokumen VMTS disahkan dengan tanggal mundur; notulen harus mendahului SK pengesahan.","Gunakan istilah unggulan (visi keilmuan) secara konsisten dengan dokumen Renstra dan kurikulum."],"outline":["A. Identitas forum","B. Unsur peserta","C. Bahan dan data yang dibahas","E. Poin pembahasan khas VMTS","F. Matriks keselarasan VMTS","G. Kontribusi dan manfaat pemangku kepentingan","H. Keputusan dan tindak lanjut"],"html":"<blockquote>\n<p>Kerangka dasar mengikuti F-PM-02 (Notulen Rapat) dengan daftar hadir F-PM-01 (rekap pada C1-02). Bagian B–H di bawah adalah tambahan khusus topik VMTS dan wajib diisi.<\/p>\n<\/blockquote><h3><strong>A. Identitas forum<\/strong><\/h3><table>\n<colgroup>\n<col/>\n<col/>\n<\/colgroup>\n<tbody>\n<tr>\n<td><strong>Nama forum<\/strong><\/td>\n<td>Lokakarya Perumusan/Review VMTS dan Unggulan PS MKM<\/td>\n<\/tr>\n<tr>\n<td><strong>Jenis kegiatan<\/strong><\/td>\n<td>☐ Review tahunan ☐ Perumusan penuh (4–5 tahunan)<\/td>\n<\/tr>\n<tr>\n<td><strong>Hari/tanggal &amp; waktu<\/strong><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Tempat/tautan daring<\/strong><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Pimpinan rapat<\/strong><\/td>\n<td>Ketua Program Studi<\/td>\n<\/tr>\n<tr>\n<td><strong>Notulis<\/strong><\/td>\n<td>Sekretaris Tim PM<\/td>\n<\/tr>\n<tr>\n<td><strong>Fasilitator/narasumber<\/strong><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Nomor undangan<\/strong><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><h3><strong>B. Unsur peserta<\/strong><\/h3><table>\n<colgroup>\n<col/>\n<col/>\n<col/>\n<col/>\n<\/colgroup>\n<thead>\n<tr>\n<th><strong>Unsur<\/strong><\/th>\n<th><strong>Wajib<\/strong><\/th>\n<th><strong>Jumlah hadir<\/strong><\/th>\n<th><strong>Keterangan<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Pimpinan UPPS<\/td>\n<td>Ya<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Kaprodi dan Tim PM<\/td>\n<td>Ya<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Dosen (mewakili bidang kesmas)<\/td>\n<td>Ya<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Tenaga kependidikan<\/td>\n<td>Ya<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Mahasiswa<\/td>\n<td>Ya<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Alumni<\/td>\n<td>Ya<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Pengguna lulusan<\/td>\n<td>Ya<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Dinas kesehatan/fasyankes<\/td>\n<td>Ya<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Pemerintah daerah, lintas sektor, kelompok masyarakat<\/td>\n<td>Dianjurkan<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Asosiasi profesi/pendidikan kesmas<\/td>\n<td>Dianjurkan<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><h3><strong>C. Bahan dan data yang dibahas<\/strong><\/h3><table>\n<colgroup>\n<col/>\n<col/>\n<col/>\n<col/>\n<\/colgroup>\n<thead>\n<tr>\n<th><strong>No<\/strong><\/th>\n<th><strong>Bahan<\/strong><\/th>\n<th><strong>Sumber<\/strong><\/th>\n<th><strong>Tersedia<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>VMTS universitas dan VMTS UPPS yang berlaku<\/td>\n<td>Renstra universitas/UPPS<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>VMTS PS berlaku dan hasil review sebelumnya<\/td>\n<td>Repositori C1 5<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><p>[Kota], [tanggal]<\/p><table>\n<colgroup>\n<col/>\n<col/>\n<col/>\n<\/colgroup>\n<tbody>\n<tr>\n<td><p>Disusun oleh,<\/p>\n<p><strong>Ketua Tim PM<\/strong><\/p>\n<p>[Nama &amp; NIP/NIDN]<\/p><\/td>\n<td><p>Diperiksa oleh,<\/p>\n<p><strong>Ketua Program Studi<\/strong><\/p>\n<p>[Nama &amp; NIP/NIDN]<\/p><\/td>\n<td><p>Disahkan oleh,<\/p>\n<p><strong>Pimpinan UPPS<\/strong><\/p>\n<p>[Nama &amp; NIP/NIDN]<\/p><\/td>\n<\/tr>\n<\/tbody>\n<\/table>"},"C2-01":{"id":"C2-01","title":"Template Notulen Rapat Tim Kurikulum Perumusan CPL dan CPMK","elements":["2.1.1","2.1.2","2.1.3","2.1.4","2.1.7","2.3.1"],"related":"SOP-PM-11, F-PM-01, F-PM-02, F-PM-05, P12, P06, INS-SVY-04, INS-SVY-05, K22, C2-02","by":"Sekretaris Tim Kurikulum atau Sekretaris Tim PM sebagai notulis; Ketua Tim Kurikulum memimpin; Kaprodi mengesahkan.","when":"Saat perumusan atau peninjauan CPL dan CPMK (lokakarya kurikulum Juli–Agustus sesuai SOP-PM-11) dan sebelum validasi RPS awal semester.","purpose":"Membuktikan bahwa CPL dan CPMK setiap mata kuliah (pengetahuan, keterampilan, perilaku) dirumuskan oleh tim kurikulum berdasarkan VMTS, unggulan, dan masalah kesehatan utama wilayah, selaras KKNI level 8 dan SN-Dikti, melibatkan pemangku kepentingan dengan sudut pandang berbeda, dan dapat diukur dengan penilaian yang sesuai.","assessor":["Tim/komite kurikulum ditetapkan dan rapat melibatkan pemangku kepentingan internal dan eksternal.","Penurunan CPL dari VMTS, unggulan, masalah kesehatan utama, KKNI level 8, dan SN-Dikti terdokumentasi.","CPMK mencakup ranah pengetahuan, keterampilan, dan perilaku serta terukur melalui metode penilaian yang ditetapkan.","Cakupan delapan bidang kesehatan masyarakat dalam CPL dan CPMK.","Sudut pandang berbeda dicatat dan cara mengakomodasinya dijelaskan."],"tips":["Lampirkan matriks hasil rumusan CPMK sebagai bagian tak terpisahkan dari notulen.","Gunakan kata kerja operasional jenjang magister (menganalisis, mengevaluasi, merancang) agar CPMK terukur.","Catat sumber data masalah kesehatan (mis. profil dinkes, survei kesehatan nasional) yang dipakai sebagai dasar rumusan.","Hindari rapat yang hanya dihadiri dosen; hadirkan alumni, pengguna, dan dinkes/fasyankes atau lampirkan masukan tertulis mereka."],"outline":["A. Identitas forum","B. Unsur peserta","C. Bahan yang dibahas","D. Poin pembahasan khas","E. Matriks hasil rumusan CPMK","F. Sudut pandang berbeda dan resolusinya","G. Tindak lanjut"],"html":"<blockquote>\n<p>Kerangka dasar mengikuti F-PM-02 dengan daftar hadir F-PM-01. Bagian B–G adalah tambahan khusus perumusan CPL dan CPMK.<\/p>\n<\/blockquote><h3><strong>A. Identitas forum<\/strong><\/h3><table>\n<colgroup>\n<col/>\n<col/>\n<\/colgroup>\n<tbody>\n<tr>\n<td><strong>Nama rapat<\/strong><\/td>\n<td>Rapat Tim Kurikulum Perumusan CPL dan CPMK<\/td>\n<\/tr>\n<tr>\n<td><strong>Hari/tanggal &amp; waktu<\/strong><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Tempat/tautan daring<\/strong><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Pimpinan rapat<\/strong><\/td>\n<td>Ketua Tim Kurikulum<\/td>\n<\/tr>\n<tr>\n<td><strong>Notulis<\/strong><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Dasar penugasan tim (SK)<\/strong><\/td>\n<td>[Nomor SK Tim Kurikulum]<\/td>\n<\/tr>\n<tr>\n<td><strong>Kurikulum/tahun berlaku yang dibahas<\/strong><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><h3><strong>B. Unsur peserta<\/strong><\/h3><table>\n<colgroup>\n<col/>\n<col/>\n<col/>\n<col/>\n<\/colgroup>\n<thead>\n<tr>\n<th><strong>Unsur<\/strong><\/th>\n<th><strong>Wajib<\/strong><\/th>\n<th><strong>Jumlah hadir<\/strong><\/th>\n<th><strong>Keterangan<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Tim Kurikulum dan Kaprodi<\/td>\n<td>Ya<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Dosen pengampu mewakili delapan bidang kesmas<\/td>\n<td>Ya<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Pakar pendidikan/psikologi pendidikan<\/td>\n<td>Dianjurkan<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Mahasiswa<\/td>\n<td>Ya<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Alumni<\/td>\n<td>Ya<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Pengguna lulusan<\/td>\n<td>Ya<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Dinas kesehatan/fasyankes<\/td>\n<td>Ya<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Asosiasi pendidikan/profesi kesmas<\/td>\n<td>Dianjurkan<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><h3><strong>C. Bahan yang dibahas<\/strong><\/h3><ul>\n<li><p>VMTS, unggulan, dan profil lulusan yang berlaku.<\/p><\/li>\n<li><p>Deskriptor KKNI level 8, SN-Dikti, dan standar kompetensi asosiasi.<\/p><\/li>\n<li><p>Data prioritas masalah kesehatan wilayah dan nasional.<\/p><\/li>\n<li><p>Hasil tracer study dan survei pengguna (INS-SVY-04, INS-SVY-05).<\/p><\/li>\n<li><p>Laporan ketercapaian CPL dan QA penilaian periode sebelumnya.<\/p><\/li>\n<\/ul><h3><strong>D. Poin pembahasan khas<\/strong><\/h3><table>\n<colgroup>\n<col/>\n<col/>\n<col/>\n<col/>\n<\/colgroup>\n<thead>\n<tr>\n<th><strong>No<\/strong><\/th>\n<th><strong>Pokok bahasan<\/strong><\/th>\n<th><strong>Ringkasan pembahasan<\/strong><\/th>\n<th><strong>Keputusan<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>Prioritas masalah kesehatan dan implikasinya terhadap CPL<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>Keselarasan CPL dengan KKNI level 8 dan SN-Dikti<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>Cakupan delapan bidang kesmas dan kesetaraan kesehatan<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>Pembebanan CPL ke mata kuliah<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>Rumusan CPMK per ranah dan keterukurannya<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>Metode penilaian yang sesuai untuk setiap CPMK<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><h3><strong>E. Matriks hasil rumusan CPMK<\/strong><\/h3><table>\n<colgroup>\n<col/>\n<col/>\n<col/>\n<col/>\n<col/>\n<col/>\n<col/>\n<\/colgroup>\n<thead>\n<tr>\n<th><strong>Mata kuliah<\/strong><\/th>\n<th><strong>CPL dibebankan<\/strong><\/th>\n<th><strong>CPMK pengetahuan<\/strong><\/th>\n<th><strong>CPMK keterampilan<\/strong><\/th>\n<th><strong>CPMK perilaku<\/strong><\/th>\n<th><strong>Masalah kesehatan/unggulan terkait<\/strong><\/th>\n<th><strong>Metode penilaian<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><h3><strong>F. Sudut pandang berbeda dan resolusinya<\/strong><\/h3><table>\n<colgroup>\n<col/>\n<col/>\n<col/>\n<col/>\n<\/colgroup>\n<thead>\n<tr>\n<th><strong>Isu<\/strong><\/th>\n<th><strong>Pandangan dan unsur pengusul<\/strong><\/th>\n<th><strong>Pandangan lain dan unsur pengusul<\/strong><\/th>\n<th><strong>Resolusi<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><h3><strong>G. Tindak lanjut<\/strong><\/h3><table>\n<colgroup>\n<col/>\n<col/>\n<col/>\n<col/>\n<\/colgroup>\n<thead>\n<tr>\n<th><strong>No<\/strong><\/th>\n<th><strong>Tindak lanjut<\/strong><\/th>\n<th><strong>PIC<\/strong><\/th>\n<th><strong>Tenggat<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>Finalisasi dokumen CPL–CPMK dan pengesahan<\/td>\n<td>Kaprodi<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>Pembaruan RPS dan validasi dengan F-PM-05<\/td>\n<td>Dosen pengampu<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>Pemutakhiran buku kurikulum (C2-02)<\/td>\n<td>Tim Kurikulum<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><p>[Kota], [tanggal]<\/p><table>\n<colgroup>\n<col/>\n<col/>\n<col/>\n<\/colgroup>\n<tbody>\n<tr>\n<td><p>Pimpinan rapat,<\/p>\n<p><strong>Ketua Tim Kurikulum<\/strong><\/p>\n<p>[Nama &amp; NIP/NIDN]<\/p><\/td>\n<td><p>Notulis,<\/p>\n<p><strong>Sekretaris Tim PM<\/strong><\/p>\n<p>[Nama &amp; NIP/NIDN]<\/p><\/td>\n<td><p>Mengesahkan,<\/p>\n<p><strong>Ketua Program Studi<\/strong><\/p>\n<p>[Nama &amp; NIP/NIDN]<\/p><\/td>\n<\/tr>\n<\/tbody>\n<\/table>"},"C2-02":{"id":"C2-02","title":"Template Kerangka Buku Kurikulum Program Studi MKM","elements":["2.1.3","2.2.1","2.2.2","2.2.3","2.3.2","2.3.3","2.3.6","2.3.10","2.4.2"],"related":"SOP-PM-11, SOP-PM-03, F-PM-05, P12, P03, K04, K22, C2-01, C2-03, C3-04","by":"Tim Kurikulum menyusun; Kaprodi memeriksa; Pimpinan UPPS mengesahkan melalui SK kurikulum.","when":"Disusun pada peninjauan kurikulum mayor (4–5 tahunan) dan dimutakhirkan setiap peninjauan minor tahunan (Agustus) sebelum semester berjalan.","purpose":"Membuktikan bahwa kurikulum memiliki prinsip desain, isi, urutan, peta kompetensi, CPL, metode pendidikan, dan penilaian capaian pembelajaran yang selaras VMTS, KKNI level 8, regulasi, sumber daya, dan konteks wilayah.","assessor":["Prinsip desain dan model kurikulum dipilih secara logis-ilmiah dan sesuai regulasi.","Peta kompetensi menunjukkan urutan, hierarki, dan kompleksitas bahan kajian.","Matriks CPL–MK dan cakupan delapan bidang kesmas, elemen sistem pelayanan kesmas, serta metodologi penelitian.","Distribusi metode pembelajaran, pengalaman lapangan, dan pembelajaran antarprofesi.","Sistem penilaian capaian pembelajaran dan RPS seluruh mata kuliah."],"tips":["Nyatakan dasar perhitungan beban belajar (≥ 36 SKS, dirancang ≥ 3 semester, wajib tesis sesuai Pasal 19 Permendiktisaintek 39/2025).","Pastikan setiap CPL dibebankan ke lebih dari satu mata kuliah dan setiap mata kuliah mendukung minimal satu CPL.","Lampirkan RPS hasil validasi F-PM-05, bukan versi draf.","Jelaskan prosedur penentuan mata kuliah pilihan dan alternatif bagi bidang yang tidak memiliki pengalaman khusus."],"outline":["A. Outline buku kurikulum","B. Matriks CPL–mata kuliah","C. Cakupan delapan bidang kesehatan masyarakat","D. Struktur per semester","E. Distribusi metode dan pengalaman belajar"],"html":"<h3><strong>A. Outline buku kurikulum<\/strong><\/h3><table>\n<colgroup>\n<col/>\n<col/>\n<col/>\n<\/colgroup>\n<thead>\n<tr>\n<th><strong>Bab<\/strong><\/th>\n<th><strong>Judul<\/strong><\/th>\n<th><strong>Isi minimal<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>I<\/td>\n<td>Pendahuluan<\/td>\n<td>Dasar hukum, landasan filosofis, sosiologis, dan historis, mekanisme penyusunan, tim kurikulum, dan pemangku kepentingan yang terlibat.<\/td>\n<\/tr>\n<tr>\n<td>II<\/td>\n<td>VMTS, unggulan, dan profil lulusan<\/td>\n<td>Keterkaitan VMTS dengan profil lulusan dan peran karir; hasil tracer dan analisis kebutuhan wilayah.<\/td>\n<\/tr>\n<tr>\n<td>III<\/td>\n<td>Capaian pembelajaran lulusan<\/td>\n<td>Rumusan CPL dan sumbernya (KKNI level 8, SN-Dikti, asosiasi, masalah kesehatan utama).<\/td>\n<\/tr>\n<tr>\n<td>IV<\/td>\n<td>Prinsip desain dan struktur<\/td>\n<td>Model kurikulum, kriteria isi (kemandirian, signifikansi, validitas, minat, utilitas, kemampuan dipelajari, kelayakan, relevansi), beban dan masa tempuh.<\/td>\n<\/tr>\n<tr>\n<td>V<\/td>\n<td>Bahan kajian dan peta kompetensi<\/td>\n<td>Delapan bidang kesmas, sistem pelayanan kesmas, kesetaraan kesehatan, metodologi penelitian, urutan dan prasyarat.<\/td>\n<\/tr>\n<tr>\n<td>VI<\/td>\n<td>Struktur mata kuliah<\/td>\n<td>Sebaran per semester, mata kuliah wajib dan pilihan beserta prosedur penentuannya.<\/td>\n<\/tr>\n<tr>\n<td>VII<\/td>\n<td>Metode dan pengalaman belajar<\/td>\n<td>Prinsip pemilihan metode, distribusi metode, pembelajaran antarprofesi, praktik lapangan, alokasi waktu, logbook.<\/td>\n<\/tr>\n<tr>\n<td>VIII<\/td>\n<td>Penilaian capaian pembelajaran<\/td>\n<td>Kebijakan penilaian, formatif dan sumatif, asesmen ketercapaian CPL, keterkaitan dengan panduan ujian (C3-04).<\/td>\n<\/tr>\n<tr>\n<td>IX<\/td>\n<td>Tesis<\/td>\n<td>Tahapan, standar KKNI level 8, pembimbingan, etika penelitian.<\/td>\n<\/tr>\n<tr>\n<td>X<\/td>\n<td>Evaluasi dan peninjauan<\/td>\n<td>Siklus peninjauan minor dan mayor, data yang digunakan, pihak yang terlibat.<\/td>\n<\/tr>\n<tr>\n<td>Lampiran<\/td>\n<td>RPS dan dokumen pendukung<\/td>\n<td>RPS seluruh mata kuliah tervalidasi, SK kurikulum, notulen C2-01 dan C2-04.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><h3><strong>B. Matriks CPL–mata kuliah<\/strong><\/h3><blockquote>\n<p>Tambahkan kolom sesuai jumlah CPL; beri tanda ✓ pada CPL yang dibebankan.<\/p>\n<\/blockquote><table>\n<colgroup>\n<col/>\n<col/>\n<col/>\n<col/>\n<col/>\n<col/>\n<col/>\n<col/>\n<col/>\n<col/>\n<\/colgroup>\n<thead>\n<tr>\n<th><strong>Kode MK<\/strong><\/th>\n<th><strong>Mata kuliah<\/strong><\/th>\n<th><strong>SKS<\/strong><\/th>\n<th><strong>Smt<\/strong><\/th>\n<th><strong>CPL-1<\/strong><\/th>\n<th><strong>CPL-2<\/strong><\/th>\n<th><strong>CPL-3<\/strong><\/th>\n<th><strong>CPL-4<\/strong><\/th>\n<th><strong>CPL-5<\/strong><\/th>\n<th><strong>CPL-6<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n d>\n<td><p>Mengesahkan,<\/p>\n<p><strong>Ketua Program Studi<\/strong><\/p>\n<p>[Nama &amp; NIP/NIDN]<\/p><\/td>\n<\/tr>\n<\/tbody>\n<\/table>"},"C2-04":{"id":"C2-04","title":"Template Notulen Rapat Peninjauan Kurikulum dan Metode Pendidikan","elements":["2.2.1","2.3.8","2.3.10","2.4.1","2.4.2","2.4.3","3.4.5"],"related":"SOP-PM-11, SOP-PM-03, F-PM-01, F-PM-02, P12, P03, P06, K22, K06, C2-01, C2-02","by":"Notulis yang ditunjuk Ketua Tim Kurikulum; Kaprodi memimpin lokakarya; Pimpinan UPPS mengesahkan keputusan perubahan.","when":"Peninjauan minor setiap Juli–Agustus dan peninjauan mayor setiap 4–5 tahun (SOP-PM-11); rapat metode pendidikan setelah monev akhir semester (SOP-PM-03).","purpose":"Membuktikan bahwa kurikulum dan metode pendidikan ditelaah, dievaluasi, dan ditinjau secara berkala berdasarkan data (ketercapaian CPL, EDOM, QA penilaian, tracer, perkembangan IPTEK dan regulasi) bersama pemangku kepentingan, dan hasilnya digunakan untuk memodifikasi isi, metode, dan pengalaman belajar.","assessor":["Peninjauan berbasis data yang dihimpun sebelum rapat.","Keterlibatan pemangku kepentingan internal dan eksternal, termasuk pakar pendidikan.","Prinsip pemilihan dan distribusi metode yang berbasis bukti, memuat interaksi antarprofesi, dan sesuai kearifan lokal.","Keputusan modifikasi isi dan metode yang diterapkan pada RPS semester berikutnya.","Pemanfaatan data penilaian untuk evaluasi pembelajaran dan kurikulum."],"tips":["Bedakan dengan jelas usulan perubahan minor dan mayor beserta jalur pengesahannya.","Catat data pemicu setiap usulan perubahan agar keterkaitan data–keputusan terlihat.","Tunjukkan bukti penerapan pada semester berikutnya (RPS revisi) sebagai penutup siklus."],"outline":["A. Identitas forum","B. Unsur peserta","C. Paket data yang ditelaah","D. Telaah per aspek kurikulum","E. Evaluasi metode pendidikan","F. Keputusan dan tindak lanjut"],"html":"<blockquote>\n<p>Kerangka dasar mengikuti F-PM-02 dengan daftar hadir F-PM-01. Bagian B–F berikut adalah tambahan khusus peninjauan kurikulum dan metode pendidikan.<\/p>\n<\/blockquote><h3><strong>A. Identitas forum<\/strong><\/h3><table>\n<colgroup>\n<col/>\n<col/>\n<\/colgroup>\n<tbody>\n<tr>\n<td><strong>Nama rapat<\/strong><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Jenis peninjauan<\/strong><\/td>\n<td>☐ Minor tahunan ☐ Mayor 4–5 tahunan ☐ Rapat metode pendidikan<\/td>\n<\/tr>\n<tr>\n<td><strong>Hari/tanggal &amp; waktu<\/strong><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Pimpinan rapat<\/strong><\/td>\n<td>Ketua Program Studi<\/td>\n<\/tr>\n<tr>\n<td><strong>Notulis<\/strong><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><h3><strong>B. Unsur peserta<\/strong><\/h3><ul>\n<li><p>Internal wajib: Tim Kurikulum, dosen pengampu, Sub-tim penjaminan mutu penilaian, Tim PM, perwakilan mahasiswa.<\/p><\/li>\n<li><p>Eksternal wajib: alumni, pengguna lulusan, dinas kesehatan/fasyankes, pembimbing lapangan.<\/p><\/li>\n<li><p>Dianjurkan: pakar pendidikan/psikologi pendidikan dan asosiasi pendidikan kesmas.<\/p><\/li>\n<\/ul><h3><strong>C. Paket data yang ditelaah<\/strong><\/h3><table>\n<colgroup>\n<col/>\n<col/>\n<col/>\n<col/>\n<\/colgroup>\n<thead>\n<tr>\n<th><strong>No<\/strong><\/th>\n<th><strong>Data<\/strong><\/th>\n<th><strong>Sumber<\/strong><\/th>\n<th><strong>Temuan pokok<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>Ketercapaian CPL per angkatan<\/td>\n<td>Laporan CPL (SOP-PM-11)<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>EDOM dan laporan monev pembelajaran<\/td>\n<td>INS-SVY-08; SOP-PM-03<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>Laporan QA penilaian<\/td>\n<td>SOP-PM-04<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>Tracer study dan survei pengguna<\/td>\n<td>SOP-PM-08<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>Perkembangan IPTEK, isu kesehatan, dan regulasi<\/td>\n<td>Kajian tim<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>Masukan mahasiswa dan mitra lahan praktik<\/td>\n<td>INS-SVY-01; INS-SVY-06<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><h3><strong>D. Telaah per aspek kurikulum<\/strong><\/h3><table>\n<colgroup>\n<col/>\n<col/>\n<col/>\n<col/>\n<\/colgroup>\n<thead>\n<tr>\n<th><strong>Aspek<\/strong><\/th>\n<th><strong>Temuan<\/strong><\/th>\n<th><strong>Usulan perubahan<\/strong><\/th>\n<th><strong>Minor/Mayor<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>CPL dan profil lulusan<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Struktur, urutan, prasyarat<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Isi (isu terkini, kesetaraan, kesehatan digital)<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Mata kuliah pilihan<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Metode pembelajaran<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Pengalaman praktik dan alokasi waktu<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Penilaian<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Lahan praktik<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><h3><strong>E. Evaluasi metode pendidikan<\/strong><\/h3><table>\n<colgroup>\n<col/>\n<col/>\n<col/>\n<col/>\n<\/colgroup>\n<thead>\n<tr>\n<th><strong>Prinsip/metode<\/strong><\/th>\n<th><strong>Bukti efektivitas<\/strong><\/th>\n<th><strong>Kesesuaian sumber daya dan kearifan lokal<\/strong><\/th>\n<th><strong>Keputusan<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Student-centred learning<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Problem/project-based learning<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Pembelajaran berbasis lapangan<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Pembelajaran antarprofesi<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><h3><strong>F. Keputusan dan tindak lanjut<\/strong><\/h3><table>\n<colgroup>\n<col/>\n<col/>\n<col/>\n<col/>\n<col/>\n<\/colgroup>\n<thead>\n<tr>\n<th><strong>No<\/strong><\/th>\n<th><strong>Keputusan<\/strong><\/th>\n<th><strong>PIC<\/strong><\/th>\n<th><strong>Tenggat<\/strong><\/th>\n<th><strong>Bukti penerapan<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><p>[Kota], [tanggal]<\/p><table>\n<colgroup>\n<col/>\n<col/>\n<col/>\n<\/colgroup>\n<tbody>\n<tr>\n<td><p>Pimpinan rapat,<\/p>\n<p><strong>Ketua Program Studi<\/strong><\/p>\n<p>[Nama &amp; NIP/NIDN]<\/p><\/td>\n<td><p>Notulis,<\/p>\n<p><strong>Sekretaris Tim PM<\/strong><\/p>\n<p>[Nama &amp; NIP/NIDN]<\/p><\/td>\n<td><p>Mengetahui,<\/p>\n<p><strong>Pimpinan UPPS<\/strong><\/p>\n<p>[Nama &amp; NIP/NIDN]<\/p><\/td>\n<\/tr>\n<\/tbody>\n<\/table>"},"C3-01":{"id":"C3-01","title":"Template Kerangka Peraturan/Pedoman Penilaian Hasil Belajar Tingkat Universitas–Fakultas dan Keterkaitannya dengan SOP-PM-04","elements":["3.1.1","3.1.2","3.1.3","3.3.2","3.4.2"],"related":"SOP-PM-04, SOP-PM-05, SOP-PM-06, F-PM-08, P04, K07, K08, K09, STD-MKM-01, C3-04, C3-06","by":"Kaprodi bersama Koordinator bidang Penjaminan Mutu Penilaian (K3) menyusun usulan; Pimpinan UPPS mengesahkan atau mengusulkan ke tingkat universitas bila menyangkut peraturan akademik.","when":"Disusun bersama paket SOP Rev. 01 dan ditinjau setiap Juli pada review sistem penilaian (SOP-PM-04 langkah 8).","purpose":"Membuktikan bahwa UPPS/PS memiliki kebijakan dan prosedur penilaian terpusat yang memetakan metode penilaian ke setiap capaian pembelajaran, menetapkan komponen dan waktu penilaian formatif dan sumatif, disetujui UPPS, dan diinformasikan kepada dosen serta mahasiswa.","assessor":["Kebijakan penilaian tertulis yang menyatakan prinsip valid, reliabel, transparan, akuntabel, berkeadilan, objektif, dan edukatif.","Keputusan komponen dan waktu penilaian dibuat PS dan disetujui UPPS.","Prosedur tersosialisasi kepada dosen dan mahasiswa (orientasi, RPS, laman).","Keterkaitan dengan panduan ujian, standard setting, banding, remedial, dan QA penilaian."],"tips":["SOP-PM-04 sudah mengatur QA penilaian tingkat prodi; yang perlu dilengkapi pada tingkat universitas/fakultas adalah skala nilai, syarat lulus mata kuliah dan program, ujian susulan, serta kewenangan yudisium.","Hindari duplikasi ketentuan yang bertentangan dengan peraturan akademik universitas; rujuk pasalnya.","Sertakan bukti sosialisasi (daftar hadir orientasi, unggahan di LMS)."],"outline":["A. Dasar hukum","B. Ketentuan pokok yang wajib dimuat","C. Pihak dan kewenangan","D. Prosedur ringkas","E. Skala nilai (diisi sesuai peraturan akademik universitas)","F. Pemantauan"],"html":"<blockquote>\n<p>Hubungan dokumen: peraturan akademik universitas/pedoman penilaian fakultas menetapkan ketentuan umum; SOP-PM-04 mengatur pelaksanaan QA penilaian di prodi; panduan ujian (C3-04) mengatur teknis ujian; SOP-PM-05 mengatur banding; SOP-PM-06 mengatur dukungan mahasiswa berisiko.<\/p>\n<\/blockquote><h3><strong>A. Dasar hukum<\/strong><\/h3><ul>\n<li><p>UU No. 12 Tahun 2012 tentang Pendidikan Tinggi.<\/p><\/li>\n<li><p>Permendiktisaintek No. 39 Tahun 2025, Pasal 26–28 tentang standar penilaian, penilaian formatif dan sumatif, dan sosialisasi mekanisme penilaian.<\/p><\/li>\n<li><p>Peraturan akademik [Nama Universitas] dan pedoman akademik [Nama Fakultas/UPPS].<\/p><\/li>\n<li><p>STD-3.1, STD-3.3, dan STD-3.4 dalam STD-MKM-01.<\/p><\/li>\n<\/ul><h3><strong>B. Ketentuan pokok yang wajib dimuat<\/strong><\/h3><ol>\n<li><p>Prinsip penilaian dan keterkaitan metode penilaian dengan setiap CPL dan CPMK.<\/p><\/li>\n<li><p>Jenis penilaian formatif dan sumatif serta waktunya sesuai tahapan capaian pembelajaran.<\/p><\/li>\n<li><p>Kewenangan: komponen dan bobot ditetapkan PS dan disetujui UPPS.<\/p><\/li>\n<li><p>Skala nilai, batas lulus mata kuliah, dan syarat kelulusan program.<\/p><\/li>\n<li><p>Penetapan standar kelulusan ujian sumatif dan ujian tesis.<\/p><\/li>\n<li><p>Umpan balik hasil penilaian ≤ 14 hari.<\/p><\/li>\n<li><p>Ujian susulan, remedial, dan banding.<\/p><\/li>\n<li><p>Penjaminan mutu penilaian: moderasi, analisis butir, reliabilitas, review sistem tahunan.<\/p><\/li>\n<li><p>Kewajiban sosialisasi kepada dosen dan mahasiswa.<\/p><\/li>\n<\/ol><h3><strong>C. Pihak dan kewenangan<\/strong><\/h3><table>\n<colgroup>\n<col/>\n<col/>\n<\/colgroup>\n<thead>\n<tr>\n<th><strong>Pihak<\/strong><\/th>\n<th><strong>Kewenangan/tanggung jawab<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Pimpinan UPPS<\/td>\n<td>Menyetujui kebijakan dan komponen penilaian; menetapkan yudisium.<\/td>\n<\/tr>\n<tr>\n<td>Kaprodi<\/td>\n<td>Menetapkan komponen dan jadwal penilaian; memutus banding tingkat prodi.<\/td>\n<\/tr>\n<tr>\n<td>Sub-tim penjaminan mutu penilaian<\/td>\n<td>Moderasi, standard setting, analisis butir, laporan QA penilaian.<\/td>\n<\/tr>\n<tr>\n<td>Dosen pengampu<\/td>\n<td>Menyusun kisi-kisi, soal, rubrik; menilai dan memberi umpan balik.<\/td>\n<\/tr>\n<tr>\n<td>Mahasiswa<\/td>\n<td>Memperoleh informasi penilaian; mengajukan banding sesuai prosedur.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><h3><strong>D. Prosedur ringkas<\/strong><\/h3><table>\n<colgroup>\n<col/>\n<col/>\n<col/>\n<col/>\n<\/colgroup>\n<thead>\n<tr>\n<th><strong>Tahap<\/strong><\/th>\n<th><strong>Aktivitas<\/strong><\/th>\n<th><strong>Pelaksana<\/strong><\/th>\n<th><strong>Rekaman<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Perencanaan<\/td>\n<td>Penetapan komponen, bobot, jadwal, dan kisi-kisi per mata kuliah<\/td>\n<td>Dosen; Kaprodi<\/td>\n<td>RPS; kisi-kisi<\/td>\n<\/tr>\n<tr>\n<td>Pra-ujian<\/td>\n<td>Moderasi soal/rubrik dan standard setting<\/td>\n<td>Sub-tim penilaian<\/td>\n<td>F-PM-08 bag. A–B<\/td>\n<\/tr>\n<tr>\n<td>Pelaksanaan<\/td>\n<td>Ujian sesuai tata tertib dan panduan ujian<\/td>\n<td>Panitia ujian<\/td>\n<td>BA ujian<\/td>\n<\/tr>\n<tr>\n<td>Pasca-ujian<\/td>\n<td>Analisis butir/kalibrasi, umpan balik, pengumuman nilai<\/td>\n<td>Sub-tim penilaian; dosen<\/td>\n<td>F-PM-08 bag. C; LMS<\/td>\n<\/tr>\n<tr>\n<td>Evaluasi<\/td>\n<td>Laporan QA penilaian dan review sistem tahunan<\/td>\n<td>Tim PM; Kaprodi<\/td>\n<td>Laporan QA; panduan revisi<\/td>\n<\/tr>\n<\/tbody>\n<\/table><h3><strong>E. Skala nilai (diisi sesuai peraturan akademik universitas)<\/strong><\/h3><table>\n<colgroup>\n<col/>\n<col/>\n<col/>\n<col/>\n<\/colgroup>\n<thead>\n<tr>\n<th><strong>Huruf mutu<\/strong><\/th>\n<th><strong>Angka mutu<\/strong><\/th>\n<th><strong>Rentang nilai<\/strong><\/th>\n<th><strong>Keterangan lulus<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><h3><strong>F. Pemantauan<\/strong><\/h3><p>Kepatuhan dipantau melalui K07 (moderasi 100%), K08 (analisis butir ≥ 90%), dan K09 (umpan balik ≤ 14 hari ≥ 90%), dilaporkan setiap semester ke rapat mutu dan RTM.<\/p><p>[Kota], [tanggal]<\/p><table>\n<colgroup>\n<col/>\n<col/>\n<col/>\n<\/colgroup>\n<tbody>\n<tr>\n<td><p>Disusun oleh,<\/p>\n<p><strong>Ketua Program Studi<\/strong><\/p>\n<p>[Nama &amp; NIP/NIDN]<\/p><\/td>\n<td><p>Diperiksa oleh,<\/p>\n<p><strong>Ketua Tim PM<\/strong><\/p>\n<p>[Nama &amp; NIP/NIDN]<\/p><\/td>\n<td><p>Disahkan oleh,<\/p>\n<p><strong>Pimpinan UPPS<\/strong><\/p>\n<p>[Nama &amp; NIP/NIDN]<\/p><\/td>\n<\/tr>\n<\/tbody>\n<\/table>"},"C3-02":{"id":"C3-02","title":"Template Bundel Bukti Umpan Balik, Logbook, Pemantauan Kemajuan, dan Revisi Strategi Pembelajaran","elements":["3.2.1","3.2.2","3.3.5","2.4.2","3.4.5"],"related":"F-PM-11, F-PM-12, F-PM-06, SOP-PM-06, SOP-PM-03, INS-SVY-08, P13, P15, P03, K09, K24, K26","by":"Koordinator bidang Pembelajaran & Kurikulum (K2) menghimpun; dosen, PA, dan pembimbing lapangan mengisi; operator data menyiapkan rekap dari LMS/SIA.","when":"Logbook diisi selama pembelajaran dan praktik lapangan; rekap pemantauan bulanan (P13) dan per semester; lembar revisi strategi disusun setelah monev akhir semester.","purpose":"Membuktikan bahwa mahasiswa menerima umpan balik tepat waktu atas penilaian formatif dan sumatif (termasuk dari pembimbing lapangan), kemajuan belajar dipantau pembimbing akademik melalui sistem terpusat, dan dosen merevisi strategi pembelajaran berdasarkan hasil penilaian.","assessor":["Logbook berisi umpan balik langsung dari dosen atau pembimbing lapangan pada waktu yang tepat.","Bukti PA memantau kemajuan (IPK, nilai, progres tesis) melalui sistem terpusat.","Data penilaian digunakan untuk mengidentifikasi mahasiswa yang membutuhkan dukungan.","Revisi strategi mengajar yang didasarkan pada data penilaian dan EDOM.","Ketepatan waktu umpan balik (K09)."],"tips":["Siapkan sampel terpilih yang representatif (beberapa mata kuliah, beberapa angkatan), bukan seluruh berkas.","Data individual mahasiswa disajikan terbatas; untuk paparan gunakan rekap agregat.","Revisi strategi harus menunjukkan rantai data pemicu → perubahan → evaluasi efek."],"outline":["A. Daftar isi bundel bukti","B. Logbook kegiatan pembelajaran/praktik lapangan","C. Rekap pemantauan kemajuan (agregat per angkatan)","D. Rekap ketepatan umpan balik (K09)","E. Lembar revisi strategi pembelajaran"],"html":"<h3><strong>A. Daftar isi bundel bukti<\/strong><\/h3><table>\n<colgroup>\n<col/>\n<col/>\n<col/>\n<col/>\n<\/colgroup>\n<thead>\n<tr>\n<th><strong>Komponen<\/strong><\/th>\n<th><strong>Dokumen/rekaman<\/strong><\/th>\n<th><strong>Sumber/formulir<\/strong><\/th>\n<th><strong>Sampel yang disiapka
